# La preuve que la plateforme fonctionne, et pas seulement qu'elle est déployée.
#
# Deux vérifications, et la première est celle qui compte : une requête HTTP
# émise depuis le poste, qui traverse le load balancer, entre dans le réseau
# privé, atteint une machine web **sans adresse publique**, et revient. Si elle
# aboutit, toute la chaîne tient : le load balancer, ses cibles IPAM, le réseau
# privé, le groupe de sécurité et nginx.
#
# La seconde exerce la collection elle-même sur les machines découvertes.

- name: La chaîne complète répond depuis l'extérieur
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Interroger l'application par le load balancer
      ansible.builtin.uri:
        url: "{{ application_url }}"
        return_content: true
        status_code: 200
      register: reponse
      retries: 30
      delay: 5
      until: reponse.status is defined and reponse.status == 200

    - name: La réponse vient bien d'une machine du tier web
      ansible.builtin.assert:
        that:
          - "'collection-scaleway' in reponse.content"
          - "'adresse privée' in reponse.content"
        success_msg: >-
          la requête a traversé le load balancer et atteint une machine sans
          adresse publique
        fail_msg: >-
          le load balancer répond, mais pas avec la page du tier web :
          {{ reponse.content[:120] | default('rien') }}

- name: Ce que la collection sait dire de chaque machine découverte
  hosts: scw_product_instance
  connection: local
  gather_facts: false

  tasks:
    # Chaque machine est lue par l'API avec ses seules variables d'inventaire.
    # C'est l'intégration Day-2 : l'inventaire découvre, les modules agissent,
    # et aucun identifiant n'est écrit à la main nulle part.
    - name: Lire la machine par l'API
      stephrobert.scaleway.instance_server_info:
        zone: "{{ scaleway_zone }}"
        server_id: "{{ scaleway_id }}"
      delegate_to: localhost
      register: lue

    - name: L'API décrit bien la machine que l'inventaire a nommée
      ansible.builtin.assert:
        that:
          - lue.server.id == scaleway_id
          - lue.server.name == inventory_hostname
          - lue.server.state == 'running'
          - lue is not changed
        quiet: true

- name: Le cycle Day-2 sur une machine, arrêt puis redémarrage
  hosts: scw_tag_role_app
  connection: local
  gather_facts: false
  run_once: true

  tasks:
    # Une seule machine, et une machine applicative : arrêter le bastion
    # couperait le chemin de tout le reste, et arrêter une machine web ferait
    # sortir une cible du load balancer.
    - name: Arrêter la machine, et attendre qu'elle le soit
      stephrobert.scaleway.instance_server_action:
        zone: "{{ scaleway_zone }}"
        server_id: "{{ scaleway_id }}"
        action: poweroff
        wait: true
      delegate_to: localhost
      register: arret

    - name: L'arrêt est confirmé par l'état observé
      ansible.builtin.assert:
        that:
          - arret is changed
          - arret.state == 'stopped'
        quiet: true

    - name: La relancer, et attendre qu'elle réponde
      stephrobert.scaleway.instance_server_action:
        zone: "{{ scaleway_zone }}"
        server_id: "{{ scaleway_id }}"
        action: poweron
        wait: true
      delegate_to: localhost
      register: relance

    - name: Le cycle est prouvé
      ansible.builtin.assert:
        that:
          - relance is changed
          - relance.state == 'running'
        success_msg: >-
          {{ inventory_hostname }} arrêtée puis relancée, états observés par
          l'API et non supposés
        quiet: true

    # **`reboot` et `stop_in_place` n'étaient éprouvés nulle part**, et deux
    # défauts fermés portaient précisément sur eux : `reboot` rendait la main
    # sans avoir observé le redémarrage, et `stop_in_place` échouait toujours
    # parce que l'override attendait `stopped` là où le contrat déclare
    # `stopped in place`. Des tests unitaires verts n'auraient rien dit de plus
    # sur ces deux-là que sur les deux précédents.
    #
    # Ils sont joués ici, dans cet ordre, parce que l'état de départ compte :
    # la machine tourne après la relance ci-dessus, `reboot` la laisse en
    # marche, et `stop_in_place` peut donc l'arrêter ensuite.

    # **Ces deux-là ne sont jouées que contre le cloud réel**, et c'est mesuré
    # plutôt que prudent. L'émulateur accepte un `reboot` en répondant
    # `success` et ne change jamais l'état de la machine : l'attente, qui exige
    # d'observer l'état quitter `running`, expire alors sur une action pourtant
    # acceptée. C'est feint#654, et le module a raison d'insister — une action
    # acceptée n'est pas une action advenue.
    #
    # `stop_in_place` suit le même sort, parce qu'il vient après `reboot` dans
    # une séquence dont l'état de départ compte.

    - name: Redémarrer, et attendre que la machine réponde à nouveau
      when: cible | default('reel') == 'reel'
      stephrobert.scaleway.instance_server_action:
        zone: "{{ scaleway_zone }}"
        server_id: "{{ scaleway_id }}"
        action: reboot
        wait: true
      delegate_to: localhost
      register: redemarrage

    - name: Le redémarrage est observé, pas seulement déclenché
      when: cible | default('reel') == 'reel'
      ansible.builtin.assert:
        that:
          - redemarrage is changed
          - redemarrage.state == 'running'
        fail_msg: >-
          `reboot` a rendu la main sur l'état {{ redemarrage.state | default('inconnu') }}.
          Rendre la main sur un déclenchement accepté est exactement le défaut
          que l'attente existe pour empêcher.
        quiet: true

    - name: Arrêter sur place, un état que le contrat distingue de `stopped`
      when: cible | default('reel') == 'reel'
      stephrobert.scaleway.instance_server_action:
        zone: "{{ scaleway_zone }}"
        server_id: "{{ scaleway_id }}"
        action: stop_in_place
        wait: true
      delegate_to: localhost
      register: sur_place

    - name: L'état observé est bien `stopped in place`
      when: cible | default('reel') == 'reel'
      ansible.builtin.assert:
        that:
          - sur_place is changed
          - sur_place.state == 'stopped in place'
        fail_msg: >-
          État observé : {{ sur_place.state | default('inconnu') }}. Le contrat
          déclare `stopped` et `stopped in place` comme deux états distincts ;
          attendre le mauvais faisait échouer l'action sur une Instance pourtant
          arrêtée.
        quiet: true

    - name: La remettre en marche, pour que la destruction parte d'un état connu
      when: cible | default('reel') == 'reel'
      stephrobert.scaleway.instance_server_action:
        zone: "{{ scaleway_zone }}"
        server_id: "{{ scaleway_id }}"
        action: poweron
        wait: true
      delegate_to: localhost
      register: retour

    - name: Les quatre actions du module ont été jouées et observées
      when: cible | default('reel') == 'reel'
      ansible.builtin.assert:
        that:
          - retour is changed
          - retour.state == 'running'
        success_msg: >-
          {{ inventory_hostname }} : poweroff, poweron, reboot et stop_in_place,
          chacune confirmée par l'état que l'API rend, jamais par le fait que
          l'appel a été accepté
