    # Les trois derniers ont une cible, et leurs champs obligatoires viennent
    # de ce que la lecture a rendu. C'est le cas le plus exigeant du lot :
    # `lb_backend` déclare sept paramètres requis, et les réécrire à
    # l'identique est exactement ce qu'un opérateur fait quand il ne change
    # qu'une valeur.

    - name: L'ACL du frontend, lue par son identifiant
      stephrobert.scaleway.lb_acl_info:
        zone: "{{ zone }}"
        acl_id: "{{ (acls.acls | first).id }}"
      register: une_acl
      failed_when: une_acl.failed | default(false)
        and une_acl.api_type | default('') != 'not_emulated'
      when: acls.acls | default([]) | length > 0

    - name: Réécrire cette ACL à l'identique
      stephrobert.scaleway.lb_acl:
        zone: "{{ zone }}"
        acl_id: "{{ (acls.acls | first).id }}"
        name: "{{ (acls.acls | first).name }}"
        index: "{{ (acls.acls | first).index }}"
        action: "{{ (acls.acls | first).action }}"
      register: repris_acl
      failed_when: repris_acl.failed | default(false)
        and repris_acl.api_type | default('') != 'not_emulated'
      when: acls.acls | default([]) | length > 0

    - name: Réécrire le backend à l'identique
      stephrobert.scaleway.lb_backend:
        zone: "{{ zone }}"
        backend_id: "{{ (backends.backends | first).id }}"
        name: "{{ (backends.backends | first).name }}"
        forward_protocol: "{{ (backends.backends | first).forward_protocol }}"
        forward_port: "{{ (backends.backends | first).forward_port }}"
        forward_port_algorithm: "{{ (backends.backends | first).forward_port_algorithm }}"
        sticky_sessions: "{{ (backends.backends | first).sticky_sessions }}"
      register: repris_backend
      failed_when: repris_backend.failed | default(false)
        and repris_backend.api_type | default('') != 'not_emulated'
      when: backends.backends | default([]) | length > 0

    - name: Réécrire le frontend à l'identique
      stephrobert.scaleway.lb_frontend:
        zone: "{{ zone }}"
        frontend_id: "{{ (frontends.frontends | first).id }}"
        name: "{{ (frontends.frontends | first).name }}"
        inbound_port: "{{ (frontends.frontends | first).inbound_port }}"
        backend_id: "{{ (frontends.frontends | first).backend.id }}"
      register: repris_frontend
      failed_when: repris_frontend.failed | default(false)
        and repris_frontend.api_type | default('') != 'not_emulated'
      when: frontends.frontends | default([]) | length > 0

    - name: Les trois sous-ressources du load balancer sont idempotentes
      ansible.builtin.assert:
        that:
          - repris_acl.api_type | default('') == 'not_emulated'
            or not (repris_acl.changed | default(false))
          - repris_backend.api_type | default('') == 'not_emulated'
            or not (repris_backend.changed | default(false))
          - repris_frontend.api_type | default('') == 'not_emulated'
            or not (repris_frontend.changed | default(false))
        fail_msg: >-
          Une réécriture identique a rendu `changed` :
          acl={{ repris_acl.changed | default('non joué') }}
          backend={{ repris_backend.changed | default('non joué') }}
          frontend={{ repris_frontend.changed | default('non joué') }}
        quiet: true

    # ---- Ce que ces réécritures ont prouvé, et ce qu'elles n'ont pas mesuré
    #
    # **Une tolérance sans compte se lit comme une preuve.** Chaque assertion
    # d'idempotence ci-dessus tolère une route non émulée par une disjonction, et
    # c'est voulu : contre l'émulateur, une route absente n'est pas un défaut de
    # la collection. Mais une assertion satisfaite par sa branche de tolérance ne
    # vérifie rien, et rien ne distinguait ensuite « prouvé » de « non mesuré ».
    # Le compte rendu annonçait « les modules de gestion sont idempotents » sans
    # dire sur combien.
    #
    # Le recensement se construit **depuis les noms de variables**, pas depuis
    # une liste tenue à la main. Une liste écrite à la main dériverait le jour où
    # quelqu'un ajoute une écriture sans l'y inscrire, et ce serait le même
    # défaut remonté d'un cran : un compte qui se lit comme une mesure.

    - name: Les réécritures identiques, recensées par leur registre
      ansible.builtin.set_fact:
        noms_repris: "{{ query('varnames', '^repris_') | sort }}"

    - name: Chaque réécriture, avec ce que son module a rendu
      ansible.builtin.set_fact:
        reecritures: "{{ dict(noms_repris
          | zip(noms_repris | map('extract', vars))) | dict2items }}"

    - name: Ce que la cible n'a pas mesuré, faute de cible ou faute de route
      ansible.builtin.set_fact:
        # Sautée : la stack n'a pas fourni la ressource, donc rien n'a été
        # écrit. Non émulée : feint ne sert pas la route. Dans les deux cas
        # l'assertion est passée sans rien vérifier.
        reecritures_non_mesurees: "{{ ((reecritures
          | selectattr('value.skipped', 'defined')
          | map(attribute='key') | list) + (reecritures
          | selectattr('value.api_type', 'defined')
          | selectattr('value.api_type', 'equalto', 'not_emulated')
          | map(attribute='key') | list)) | unique | sort }}"

    - name: Les idempotences réellement prouvées
      ansible.builtin.set_fact:
        idempotences_prouvees: "{{ noms_repris
          | reject('in', reecritures_non_mesurees) | list }}"

    - name: Combien d'idempotences cette exécution a prouvées
      ansible.builtin.debug:
        msg: >-
          {{ idempotences_prouvees | length }} idempotence(s) prouvée(s)
          sur {{ noms_repris | length }} réécriture(s) jouée(s){{
          '' if reecritures_non_mesurees | length == 0
          else ' · non mesurée(s) : ' ~ reecritures_non_mesurees | join(', ') }}

    - name: Contre le cloud réel, chaque réécriture doit être mesurée
      ansible.builtin.assert:
        that:
          - reecritures_non_mesurees | length == 0
        fail_msg: >-
          Réécritures non mesurées sur le compte réel :
          {{ reecritures_non_mesurees | join(', ') }}.
          Une route absente ou une cible manquante y est un défaut, pas une
          limite déclarée : les neuf ressources visées sont toutes créées par
          la stack Terraform.
        quiet: true
      when: cible == 'reel'

    # **Six modules de gestion n'ont aucune cible dans cette stack**, et le
    # dire vaut mieux que de laisser croire qu'ils sont couverts :
    #
    # * `instance_snapshot` et `instance_volume` lisent l'API Instance, qui ne
    #   voit pas un volume ni un instantané SBS. La stack n'en crée pas d'autres,
    #   et en créer un seulement pour ce test serait payer une ressource pour
    #   décorer une couverture ;
    # * `instance_image` n'existe que sur la cible réelle, et son écriture
    #   demanderait de toucher l'image d'or dont dépend le reste ;
    # * `lb_certificate`, `lb_route` et `lb_subscriber` demandent un domaine, un
    #   second backend et une adresse de destinataire. Les trois lectures
    #   correspondantes sont appelées et répondent `[]`, ce qui est déjà une
    #   réponse, et créer ces ressources pour écrire dessus reviendrait à
    #   étendre la plateforme pour décorer une couverture ;
    # * `instance_security_group_rule` exige l'identifiant d'une règle, que seul
    #   `instance_security_group_rule_info` saurait donner, et ce module est
    #   écarté par le modèle (deux listes pour une ressource).

    - name: Ce que les modules ont trouvé
      ansible.builtin.debug:
        msg: >-
          {{ machines.servers | length }} machines ·
          {{ groupes.security_groups | selectattr('name', 'search', prefixe)
             | list | length }} groupes de sécurité ·
          {{ places.servers | length }} machines en groupe de placement ·
          {{ volumes.volumes | length }} volumes vus par instance/v1 ·
          {{ adresses.ips | selectattr('tags', 'contains', 'exemple')
             | list | length }} adresse publique ·
          {{ (types.result | default({})).servers | default({}) | length }} types offerts ·
          {{ cartes.private_nics | default([]) | length }} carte privée sur un worker ·
          {{ balanceurs.lbs | default([]) | length }} load balancer ·
          {{ backends.backends | default([]) | length }} backend
