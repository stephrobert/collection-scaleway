# OpenSSF Scorecard : un audit de l'extérieur de la posture du dépôt, protection
# de branche, épinglage des actions, motifs de workflow dangereux.
#
# Le résultat part dans l'onglet de code scanning, pour qu'une régression
# apparaisse comme une alerte plutôt que comme un nombre que personne ne relit.
#
# Le nombre n'est pas l'objectif. Cinq contrôles ne se règlent pas par une
# configuration : ils mesurent le nombre de relecteurs et l'âge du dépôt.
# `docs/scorecard.md` dit lesquels, et pourquoi les gonfler serait pire que de
# les laisser tels quels.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "31 5 * * 3"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Analyse Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Aucun `repo_token` ici. Le contrôle Branch-Protection réclame un PAT à
      # portée Administration quand un dépôt utilise la protection *classique* ;
      # `main` est protégée par un **ruleset** (.github/rulesets/main.json), que
      # le `GITHUB_TOKEN` par défaut sait déjà lire. Ajouter un jeton privilégié
      # serait une capacité permanente dont rien n'a besoin.
      - name: Lancer l'analyse
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Publier vers le code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
