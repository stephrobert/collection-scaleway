# Recherche de secrets sur chaque poussée et chaque pull request.
#
# Ce dépôt n'a besoin d'aucun credential Scaleway pour tourner, et c'est
# précisément ce qui rend cette porte utile : elle prouve que la propriété
# tient. Le scénario d'intégration lit ses identifiants de l'émulateur, jamais
# du dépôt, et les seules chaînes qui ressemblent à des clés sont les valeurs
# factices d'exemples et de tests.
name: Secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Analyser
        env:
          # Binaire de release à somme vérifiée, comme les trois scanners de
          # workflow-security.yml, et pour la même raison : l'outil qui garde
          # la frontière de confiance ne doit pas l'élargir.
          TRUFFLEHOG_VERSION: "3.97.1"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"
          asset="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/${asset}" "${base}/${asset}"
          curl --retry 3 --retry-connrefused -fsSL -o "${workdir}/sums" "${base}/trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt"
          (cd "${workdir}" && grep " ${asset}$" sums | sha256sum -c -)
          tar -xzf "${workdir}/${asset}" -C "${workdir}" trufflehog
          sudo install -m 0755 "${workdir}/trufflehog" /usr/local/bin/trufflehog
          # `--no-update` : le binaire se met à jour tout seul au démarrage, et
          # depuis /usr/local/bin il n'y arrive pas, sort en 1 sur « cannot move
          # binary back ». Un scanner qui échoue parce qu'il a voulu changer la
          # version qu'on auditait ne s'épingle pas, ce qui vide de son sens
          # l'installation par somme vérifiée.
          trufflehog --no-update --version
          # `filesystem` plutôt que `git base..head` pose la meilleure question :
          # non pas « ce changement a-t-il ajouté un secret » mais « le dépôt en
          # contient-il un ». `--results=verified --fail` en fait une porte.
          trufflehog --no-update filesystem . --results=verified --fail
