# Bloque une pull request qui introduit une dépendance porteuse d'une
# vulnérabilité connue ou d'une licence non permissive.
#
# Ce dépôt verrouille ses dépendances de développement dans
# `requirements-dev.lock`, empreintes comprises. Cette porte est ce qui garde
# la décision honnête quand le verrou est régénéré : un verrou se relit comme
# un diff, et un diff que personne ne lit n'est pas un contrôle.
name: Revue des dépendances

on:
  pull_request:

permissions: {}

jobs:
  review:
    name: Revoir les changements de dépendances
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # La liste de licences est celle qu'une collection publiée sous
      # GPL-3.0-or-later peut consommer sans se contredire.
      #
      # **Ce contrôle est rouge sur toute pull request qui touche
      # `meta/ee-requirements.txt`, et ce n'est pas un faux positif.** Le paquet
      # PyPI `scaleway` déclare deux classifiers qui s'excluent, « BSD License »
      # et « Other/Proprietary License », et ne livre aucun fichier de licence.
      # L'outil en tire
      # `BSD-2-Clause AND BSD-3-Clause AND LicenseRef-scancode-proprietary-license`,
      # et le `AND` est le mot décisif : aucune liste de licences ouvertes ne
      # peut accepter cette expression.
      #
      # Le dépôt amont, lui, est **Apache-2.0**, licence déjà autorisée
      # ci-dessous. Les trois sources se contredisent, mesuré le 3 septembre
      # 2026 sur les versions 2.9.0 à 2.12.0.
      #
      # **Aucune exemption n'est posée ici, et c'est délibéré.**
      # `allow-dependencies-licenses: pkg:pypi/scaleway` rendrait le contrôle
      # vert en acceptant une licence inconnue sur parole, ce qui est
      # exactement ce qu'une revue de licences existe pour empêcher. Le défaut
      # est signalé à la source, scaleway/scaleway-sdk-python#2131, avec la
      # mesure et un correctif proposé. Le vert reviendra quand le paquet
      # dira ce qu'il est.
      #
      # Se passer du SDK n'est pas l'issue : l'inventaire dynamique s'appuie sur
      # cinq de ses APIs produit, et le dépôt assume ce partage des rôles.
      - name: Revue des dépendances
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, PSF-2.0, GPL-3.0-or-later
