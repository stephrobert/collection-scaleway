# Une nomenclature logicielle sur chaque poussée vers `main`.
#
# Elle documente ce que `main` contient entre deux états, ce qui est le moment
# où une dépendance apparaît réellement. Le dépôt n'a pas encore de workflow de
# publication : quand il en aura un, c'est lui qui attachera la nomenclature et
# sa provenance à l'archive de la collection.
name: SBOM

on:
  push:
    branches: [main]

permissions: {}

jobs:
  main:
    name: Syft SBOM (main)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Anchore SBOM Action (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: collection-scaleway.spdx.json
          artifact-name: collection-scaleway.spdx.json
          upload-artifact: true
          upload-release-assets: false
