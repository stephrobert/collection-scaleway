# Analyse statique du code Python : le générateur, les lanceurs, et le runtime
# de la collection.
#
# Elle tourne sur les pull requests et une fois par semaine. L'exécution
# hebdomadaire n'est pas une redondance : une requête CodeQL ajoutée en amont
# trouve un défaut dans un fichier que plus personne ne touche, et sans elle
# ce défaut n'est jamais revu.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "25 4 * * 2"
  workflow_dispatch:

# **Le budget d'API du dépôt est partagé.** `GITHUB_TOKEN` dispose de mille
# requêtes par heure pour l'ensemble des workflows, et les téléversements de
# SARIF et d'artefacts en consomment l'essentiel. Un run périmé qui finit quand
# même paie sa part : on l'annule.
#
# Jamais sur `main`, où chaque run correspond à un état publié.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  analyze:
    name: Analyser Python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `build-mode: none` : Python ne se compile pas, et demander une
      # construction ferait échouer l'analyse sur une étape qui n'existe pas.
      # `security-extended` ajoute les requêtes que le jeu par défaut laisse
      # de côté, au prix de quelques minutes.
      - name: Initialiser CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - name: Analyser
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
