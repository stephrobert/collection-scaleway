# Publication sur Ansible Galaxy, déclenchée par un tag et rien d'autre.
#
# **Le déclencheur est le tag, jamais `push` sur `main`.** Une version publiée
# sur Galaxy est immuable : republier la même rend `conflict.collection_exists`,
# et il n'y a pas de correction, seulement une version de plus. Une publication
# irréversible ne doit pas partir d'une fusion.
#
# Ce pipeline n'a été écrit qu'**après** une première publication faite à la
# main, et c'est délibéré : un pipeline de publication qui n'a jamais publié est
# une hypothèse, et son premier essai porterait sur un numéro qu'on ne peut pas
# reprendre. Deux choses apprises ce jour-là sont écrites ici plutôt que
# redécouvertes :
#
# * l'URL du serveur doit être `https://galaxy.ansible.com/api/`. Sur l'hôte nu,
#   `ansible-galaxy` rend **401 dès la découverte des versions**, et le message
#   parle d'autorisation là où le problème est un chemin ;
# * `--token` seul ne suffit pas. C'est la configuration de serveur qui porte à
#   la fois l'URL et le jeton, et les variables `ANSIBLE_GALAXY_SERVER_*`
#   l'expriment sans écrire de fichier.
#
# Les trois règles des autres workflows valent ici : aucun droit par défaut,
# aucune action par tag, aucun jeton laissé derrière.
name: release

on:
  push:
    tags:
      # Les deux conventions, parce que `scripts/release.py` accepte les deux :
      # un workflow qui ne se déclenche que sur l'une ferait taguer sans rien
      # publier, et le silence est la pire des réponses à un tag de release.
      #
      # Le motif doit couvrir **tout** le nom : `0.2.0-rc1` ne déclenche donc
      # pas, et c'est voulu. Une préversion demande une décision, pas un
      # automatisme.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

# Deux tags poussés coup sur coup ne se marchent pas dessus, et rien n'est
# annulé : une publication commencée doit s'achever ou échouer visiblement.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publier:
    name: Publier sur Galaxy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Le jeton vit dans cet environnement, dont la politique de référence
    # n'autorise que les tags de version : un tag `essai` ou `debug` ne peut pas
    # déclencher la publication, même poussé par quelqu'un qui a les droits.
    #
    # **Attention à la syntaxe de cette politique, qui n'est pas celle du filtre
    # `on.push.tags` ci-dessus.** Le filtre d'un workflow accepte `+` comme
    # quantificateur ; une politique de déploiement filtre en `fnmatch`, où `+`
    # est un caractère littéral. Les motifs y sont donc
    # `[0-9]*.[0-9]*.[0-9]*` et `v[0-9]*.[0-9]*.[0-9]*`. Recopier les motifs
    # d'au-dessus a coûté une exécution : le tag a bien déclenché le workflow,
    # et le job a été rejeté en deux secondes, avant sa première étape, avec
    # « Tag "0.2.0" is not allowed to deploy to galaxy ».
    #
    # Une politique posée n'est pas une politique éprouvée : l'API répond
    # « créé » pour un motif qui ne correspondra jamais.
    environment: galaxy
    permissions:
      contents: write
      # Publier l'environnement d'exécution sur le registre du dépôt.
      packages: write
      # **Signer sans clé, et attester la provenance.** Les deux demandent un
      # jeton d'identité émis par la CI : c'est ce qui lie l'archive au workflow
      # qui l'a produite plutôt qu'à un secret qu'il faudrait garder, et ce qui
      # fait qu'une exécution locale ne peut pas produire une signature valide.
      id-token: write
      attestations: write
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # La garde compare le tag à `galaxy.yml` : sans l'historique des tags,
          # `git describe` ne trouve rien et la garde refuserait pour la
          # mauvaise raison.
          fetch-depth: 0

      - name: Installer mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.2.23
          # **Pas de cache dans un workflow qui publie.** L'action en active un
          # par défaut, et un cache est écrit par n'importe quelle branche du
          # dépôt : ce qui part sur Galaxy ne doit dépendre que du tag. C'est
          # l'unique constat de zizmor sur ce fichier, et il est classé haut
          # pour cette raison.
          cache: false

      - name: Installer
        run: mise run setup

      # **La garde d'abord.** Tag qui concorde avec `galaxy.yml`, arbre propre,
      # changelog composé, version sémantique. Ce qu'elle refuse coûterait un
      # numéro.
      - name: Ce qui doit être vrai avant de publier
        run: mise run release:check

      - name: Ce qu'une pull request doit passer
        run: mise run check

      - name: Ce qu'Ansible dit du fichier produit
        run: mise run sanity

      # `package` construit l'archive, contrôle son contenu, l'installe dans un
      # répertoire jetable et demande sa documentation à `ansible-doc`. Un
      # fichier présent dans une archive n'est pas un module qu'Ansible sait
      # charger.
      - name: Construire l'archive, l'installer et l'interroger
        run: mise run package

      # **Signer avant de publier.** Une archive publiée est immuable : lui
      # ajouter sa signature après coup laisserait une fenêtre où ce qui circule
      # n'est vérifiable par personne.
      - name: Installer Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # **Un bundle, et non une signature et un certificat séparés.**
      # `--output-signature` et `--output-certificate` sont dépréciés : avec le
      # format de bundle, devenu le défaut, cosign les ignore puis échoue faute
      # de `--bundle`. C'est ce qui a arrêté la première exécution de release de
      # la 0.4.0, sur `create bundle file: open : no such file or directory`.
      #
      # Le bundle porte la signature, le certificat et l'entrée de transparence
      # dans un seul fichier, ce qui rend aussi la recette de vérification plus
      # courte à publier.
      - name: Signer l'archive, sans clé
        run: |
          set -euo pipefail
          archive=$(ls build/dist/*.tar.gz)
          cosign sign-blob --yes \
            --bundle "${archive}.cosign.bundle" \
            "$archive"

      - name: Attester la provenance de la construction
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/dist/*.tar.gz

      # L'attestation vit dans l'API de GitHub ; la joindre à la release la rend
      # vérifiable par qui ne passe pas par `gh`, et c'est ce qu'un scanner de
      # chaîne d'approvisionnement va chercher parmi les actifs.
      - name: Joindre le paquet de provenance aux actifs
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          archive=$(ls build/dist/*.tar.gz)
          cp "$BUNDLE" "${archive}.intoto.jsonl"

      # La recette que `SECURITY.md` publie, jouée sur ce qui vient d'être
      # signé. Une recette qu'un lecteur copie et qui ne marche pas est pire
      # qu'une absence de recette.
      - name: La signature se vérifie avec ce que la politique publie
        env:
          DEPOT: ${{ github.repository }}
          SERVEUR: ${{ github.server_url }}
        run: |
          set -euo pipefail
          archive=$(ls build/dist/*.tar.gz)
          cosign verify-blob \
            --bundle "${archive}.cosign.bundle" \
            --certificate-identity-regexp "^${SERVEUR}/${DEPOT}/.github/workflows/release.yml@refs/tags/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"

      - name: Publier
        env:
          # Le jeton passe par l'environnement, jamais par la ligne de commande :
          # une commande finit dans un journal, et un journal se partage.
          ANSIBLE_GALAXY_SERVER_LIST: published
          ANSIBLE_GALAXY_SERVER_PUBLISHED_URL: https://galaxy.ansible.com/api/
          ANSIBLE_GALAXY_SERVER_PUBLISHED_TOKEN: ${{ secrets.GALAXY_API_TOKEN }}
        run: |
          archive=$(ls build/dist/*.tar.gz)
          ansible-galaxy collection publish "$archive"

      # **L'image d'environnement d'exécution, publiée après la collection.**
      # L'ordre compte : l'image porte l'archive, donc publier l'image avant
      # laisserait circuler un environnement qui contient une version que
      # Galaxy ne sert pas encore.
      - name: S'authentifier sur le registre
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deux étiquettes et pas de `latest` : `.plumber.yaml` refuse une image
      # étiquetée par une référence mobile, et pour la même raison qu'ailleurs
      # dans ce dépôt. Un lecteur qui veut la dernière lit la page des versions.
      - name: Construire et publier l'image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ee:${{ github.ref_name }}

      # Par condensat, jamais par étiquette : une signature posée sur une
      # étiquette bénit ce que l'étiquette désignera plus tard.
      - name: Signer l'image, sans clé
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          DEPOT: ${{ github.repository }}
        run: cosign sign --yes "ghcr.io/${DEPOT}/ee@${DIGEST}"

      - name: Attester la provenance de l'image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/ee
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # La release GitHub vient **après** la publication réussie : elle
      # enregistre ce qui est parti, elle ne l'annonce pas d'avance.
      - name: Enregistrer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          archive=$(ls build/dist/*.tar.gz)
          gh release create "$TAG" \
            "$archive" "${archive}.cosign.bundle" "${archive}.intoto.jsonl" \
            --title "$TAG" \
            --notes "Publiée sur Ansible Galaxy : https://galaxy.ansible.com/ui/repo/published/stephrobert/scaleway/" \
            --verify-tag
