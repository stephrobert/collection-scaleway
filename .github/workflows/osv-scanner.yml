# Vulnérabilités connues et paquets malveillants, par la base OSV.
#
# Les exécutions sur pull request disent ce qu'un changement introduit ; les
# exécutions planifiées attrapent un paquet reclassé malveillant après coup,
# ce qui est le cas que rien d'autre ne couvre : le verrou fige une version,
# il ne dit pas qu'elle est restée saine.
name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 12 * * 1"

# **Le budget d'API du dépôt est partagé.** `GITHUB_TOKEN` dispose de mille
# requêtes par heure pour l'ensemble des workflows, et les téléversements de
# SARIF et d'artefacts en consomment l'essentiel. Un run périmé qui finit quand
# même paie sa part : on l'annule.
#
# Jamais sur `main`, où chaque run correspond à un état publié.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  scan-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1

  scan-scheduled:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
