---
name: Installer mise
description: >-
  Installe mise et les outils de `mise.toml`, à la version épinglée par ce
  dépôt et à elle seule.

# **La version de mise n'existe qu'ici, et le condensat de l'action non plus.**
#
# Les deux étaient recopiés dans neuf étapes réparties sur quatre workflows.
# Dependabot rattrape le condensat, parce que c'est une dépendance pour lui ; il
# ne rattrape pas `version:`, qui n'en est pas une. Une des neuf pouvait donc
# partir seule, et rien ne l'aurait vu.
#
# C'est la règle d'ADR-007 appliquée à l'outillage : une valeur vraie recopiée
# en neuf endroits diverge un jour.
#
# **Pourquoi épingler, alors qu'épingler fait vieillir.** Le 8 septembre 2026,
# le point de version de mise annonçait `2026.9.3` alors que la release ne
# portait aucun artefact : le tag existait, la release non. Toute action
# résolvant « la dernière » composait une URL vers un fichier inexistant et
# recevait 404. Ce dépôt n'est pas tombé parce qu'il épingle. Dependabot lève
# l'épingle chaque semaine, après quatorze jours de quarantaine.

inputs:
  cache:
    description: >-
      Utiliser le cache de l'action. À mettre à `false` dans un workflow qui
      publie.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: mise
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        version: 2026.9.2
        # **Le cache est une entrée, pas une constante.** Il est écrit par
        # n'importe quelle branche du dépôt : ce qui part sur Galaxy ne doit
        # dépendre que du tag, et `release.yml` le désactive pour cette raison.
        # C'est l'unique constat de zizmor sur ce fichier, et il est classé haut.
        cache: ${{ inputs.cache }}
