    scaleway.k8s.v1.CreateClusterRequest.AutoscalerConfig:
      type: object
      properties:
        scale_down_disabled:
          type:
          - boolean
          - "null"
          description: Forbid cluster autoscaler to scale down the cluster, defaults
            to false.
        scale_down_delay_after_add:
          type:
          - string
          - "null"
          description: How long after scale up the scale down evaluation resumes.
        estimator:
          description: Type of resource estimator to be used in scale up.
          $ref: '#/components/schemas/scaleway.k8s.v1.AutoscalerEstimator'
        expander:
          description: Kubernetes autoscaler strategy to fit pods into nodes, see
            https://github.com/kubernetes/autoscaler/blob/master/cluster-autoscaler/FAQ.md#what-are-expanders
            for details.
          $ref: '#/components/schemas/scaleway.k8s.v1.AutoscalerExpander'
        ignore_daemonsets_utilization:
          type:
          - boolean
          - "null"
          description: Ignore DaemonSet pods when calculating resource utilization
            for scaling down, defaults to false.
        balance_similar_node_groups:
          type:
          - boolean
          - "null"
          description: Detect similar node groups and balance the number of nodes
            between them, defaults to false.
        expendable_pods_priority_cutoff:
          type:
          - integer
          - "null"
          description: Pods with priority below cutoff will be expendable. They can
            be killed without any consideration during scale down and they won't cause
            scale up. Pods with null priority (PodPriority disabled) are non expendable.
          format: int32
        scale_down_unneeded_time:
          type:
          - string
          - "null"
          description: How long a node should be unneeded before it is eligible for
            scale down, defaults to 10 minutes.
        scale_down_utilization_threshold:
          description: Node utilization level, defined as a sum of requested resources
            divided by allocatable capacity, below which a node can be considered
            for scale down.
          $ref: '#/components/schemas/google.protobuf.FloatValue'
        max_graceful_termination_sec:
          type:
          - integer
          - "null"
          description: Maximum number of seconds the cluster autoscaler waits for
            pod termination when trying to scale down a node, defaults to 600 (10
            minutes).
          format: uint32
        skip_nodes_with_local_storage:
          type:
          - boolean
          - "null"
          description: Cluster autoscaler will never delete nodes with pods with local
            storage, e.g. EmptyDir or HostPath, defaults to true.
        log_level:
          type:
          - integer
          - "null"
          description: Cluster autoscaler logging level expressed from 0 to 4 (4 being
            the more verbose), defaults to 2. see https://github.com/kubernetes/autoscaler/blob/master/cluster-autoscaler/FAQ.md#how-can-i-increase-the-information-that-the-ca-is-logging
            for details.
          format: int32
