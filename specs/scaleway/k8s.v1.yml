                  - string
                  - "null"
                  description: Maximum amount of time before the API forces the drain
                    and deletion of a `deleting` node. It overrides pods `PodDisruptionBudget`
                    and `terminationGracePeriodSeconds`. Defaults to 15 minutes, up
                    to 1 hour. (in seconds)
                  example: 2.5s
