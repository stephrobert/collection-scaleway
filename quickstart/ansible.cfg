[defaults]
inventory = lab.scaleway.yml
# The quickstart is read out loud: a recap of ten identical lines says less
# than the tasks themselves.
stdout_callback = default

[inventory]
# **The setting the collection's own `strict` option needs to mean anything.**
# Ansible downgrades an inventory plugin failure to a warning and exits zero,
# so without this line a broken emulator would produce a green run on an empty
# fleet. The quickstart ships it because that is the honest default for
# anything that checks its own result.
any_unparsed_is_failed = True
