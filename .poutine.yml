# Configuration de poutine, scanner de chaînes d'exploitation CI/CD.
#
# La règle `github_action_from_unverified_creator_used` signale toute action
# dont l'auteur n'est pas un « verified creator » de la Marketplace. Ce signal
# est utile et reste ACTIF pour toutes les autres actions : c'est lui qui
# attrape une action typosquattée ou fraîchement réenregistrée qui se
# glisserait dans le pipeline.
#
# Les entrées ci-dessous sont acquittées une par une, jamais en
# désactivant la règle. Chacune nomme le workflow qui l'exécute, pour qu'un
# lecteur puisse vérifier l'affirmation au lieu de la croire.
#
# Mesuré : ce sont les seules actions que poutine signale sur ce dépôt. Une exemption qui survivrait à l'action qu'elle
# exempte accorderait une confiance que plus personne n'utilise ni ne relit,
# donc elles se relisent quand un workflow change.
skip:
  - rule: github_action_from_unverified_creator_used
    purl:
      # Le lanceur de tâches, exécuté par les quatre jobs de
      # .github/workflows/ci.yml. Épinglé par SHA de commit, et sa propre
      # version de mise est épinglée par l'entrée `version:` : sans elle,
      # l'action télécharge la dernière release publiée, ce qui annulerait
      # l'épinglage de tout le reste.
      - pkg:githubactions/jdx/mise-action
      # L'action qui démarre l'émulateur dans le job d'intégration. Elle
      # appartient au mainteneur de ce dépôt, elle est épinglée par SHA, et le
      # dépôt de feint fait échouer un job tant que l'action publiée diffère de
      # sa source. Elle télécharge le binaire et contrôle sa somme SHA-256
      # contre le `checksums.txt` publié avant de le lancer.
      - pkg:githubactions/stephrobert/setup-feint
      # Les deux actions de ClusterFuzzLite, exécutées par
      # .github/workflows/fuzz.yml. Elles vivent dans `google/clusterfuzzlite`,
      # dépôt de Google, qui n'est pas « verified creator » sur la Marketplace :
      # l'organisation n'y a jamais publié d'action, ce que la règle ne
      # distingue pas d'un compte inconnu.
      #
      # Ce que l'acquittement repose sur : les deux sont épinglées par SHA du
      # tag `v1`, vérifié contre l'API de GitHub plutôt que recopié, et le job
      # qui les exécute ne porte que `contents: read`. Un `GITHUB_TOKEN` lui est
      # passé pour déposer un rapport SARIF, et rien d'autre.
      #
      # Le purl est au niveau du dépôt et non de chaque action : poutine
      # identifie l'auteur, et les deux actions ont le même. Mesuré, un
      # purl par sous-chemin ne correspond à rien et laisse la règle rouge.
      - pkg:githubactions/google/clusterfuzzlite
