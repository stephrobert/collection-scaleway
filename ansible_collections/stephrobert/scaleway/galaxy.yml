# Identité de la collection. Le générateur lit ce fichier : le namespace, le
# nom et la version qu'il déclare finissent dans chaque module produit.
#
# Le namespace est une décision de périmètre, pas une préférence de style.
#
# `scaleway.scaleway` appartient à Scaleway, et rien ne s'y publie sans son
# accord : le prendre serait un squat. `local` désignait une collection interne,
# installable par chemin ou par archive et **impubliable** sur Galaxy ; c'était
# le bon choix tant que la question n'était pas tranchée, et le mauvais dès que
# le nombre de playbooks écrits a commencé à en faire monter le prix.
#
# `stephrobert.scaleway` dit ce que ce dépôt est : une chaîne de génération et
# la collection de démonstration qu'elle produit. Il se publie, il n'usurpe
# rien, et il laisse ouverte la seule suite qui vaille, alimenter la collection
# officielle plutôt que lui faire concurrence.
#
# Le renommer se fait ici **et** dans le chemin du répertoire : `load_collection`
# exige que les deux concordent, et c'est cette garde qui a rattrapé le
# renommage à moitié fait.
namespace: stephrobert
name: scaleway
version: 0.7.0
readme: README.md
authors:
  - Stéphane Robert (@stephrobert)
description: >-
  Day-2 Ansible modules for the Scaleway APIs, produced by this repository's
  generator. Terraform provisions resources, this collection operates existing
  ones.
license:
  - GPL-3.0-or-later
tags:
  - scaleway
  - cloud
  - infrastructure
# **Où ça vient, et où le signaler.** Cette collection est générée : un
# utilisateur qui trouve un défaut dans un module ne doit surtout pas le
# corriger dans le module, qui sera réécrit à la prochaine génération. Le
# correctif appartient au contrat, à une règle de classification ou à un
# override, et ces deux liens sont les seuls chemins de retour depuis la page
# Galaxy vers l'endroit où la réparation est possible.
repository: https://github.com/stephrobert/collection-scaleway
issues: https://github.com/stephrobert/collection-scaleway/issues
homepage: https://github.com/stephrobert/collection-scaleway

# **Le site existe, et ce champ ne le vise pas.** Il est en ligne sur
# https://stephrobert.github.io/collection-scaleway/, produit par
# `mise run docs:site`, et il ne publie que l'état de `main`. Or Galaxy affiche
# ce lien **à côté du numéro de version** : le lecteur d'une version publiée il
# y a six mois atterrirait sur la documentation d'aujourd'hui, sans que rien
# sur la page le lui dise. C'est exactement le défaut que
# `test_aucun_lien_de_ce_depot_ne_pointe_sur_une_branche` refuse.
#
# L'arbre du dépôt au tag est donc le seul lien qui dise la vérité pour la
# version qui l'accompagne, et le site reste annoncé depuis le README, où
# aucune version ne l'encadre.
#
# Le commentaire précédent disait que le site n'était pas encore publié. Il a
# été vrai, il ne l'est plus, et rien ne l'a relevé : une affirmation sur le
# monde extérieur ne se compare à rien de local (#90).
documentation: https://github.com/stephrobert/collection-scaleway/tree/0.7.0/docs

dependencies: {}

# La collection ne contient que ce qui se livre : le générateur, les contrats
# et les tests du dépôt vivent au-dessus de `ansible_collections/`, hors de ce
# répertoire. `build_ignore` n'a donc plus à les écarter, et ce qui reste est
# ce qu'`ansible-galaxy` produirait de toute façon.
build_ignore:
  # `tests` et non `tests/output` : écarter le contenu laissait le répertoire
  # lui-même dans l'archive, vide, et le contrôle des fuites ne le voyait pas
  # parce qu'il ne regardait que les fichiers. Rien sous `tests/` n'a sa place
  # chez un utilisateur.
  - tests
