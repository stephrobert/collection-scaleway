---
minor_changes:
  - A guide for operating a Kapsule cluster, covering what to read before
    touching anything, auditing a version before it audits you, changing what a
    cluster or a pool holds, rolling through node reboots, and what is
    deliberately not supported (https://github.com/stephrobert/collection-scaleway/issues/280).
  - The guide's proof table is derived from the recorded real-cloud run rather
    than written by hand, and distinguishes a module a run proves from one whose
    only exercised route is shared with another module
    (https://github.com/stephrobert/collection-scaleway/issues/280).
