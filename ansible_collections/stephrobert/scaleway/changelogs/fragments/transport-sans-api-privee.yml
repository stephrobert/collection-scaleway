---
bugfixes:
  - "The runtime no longer writes ``requests.Response._content``. It carried the
    ``x-total-count`` header into the response body by rewriting a private
    attribute of a third-party library, in a transport that had been rewritten
    precisely to stop depending on a private method of the Scaleway SDK. The
    header is now merged into the body **that was read**, which is what the
    paginator actually needed: the behaviour is unchanged and a regression test
    follows the header all the way to what ``request`` returns."
minor_changes:
  - "``mise run api:privee`` refuses an underscored attribute of a third-party
    library anywhere in what the collection ships. The rule existed as a
    paragraph and had already been broken once by the very change that stated
    it. Two mutations prove the refusal bites, including the counter-example
    that ``self._client`` stays allowed, without which the control would refuse
    the whole runtime and be turned off."
  - "``docs/architecture/runtime.md`` describes the transport that exists.
    It still explained that requests went through ``scaleway_core.api.API._request``
    and that a guard watched that private method's signature, a decision reversed
    before 0.4.0. Every responsibility of the transport is now named with the
    place that holds it, and the absence of a retry policy is named as a
    deliberate gap rather than left to be discovered. See ADR-014."
