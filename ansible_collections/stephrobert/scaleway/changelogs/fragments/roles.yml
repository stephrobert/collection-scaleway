minor_changes:
  - "The operational playbooks are now roles, callable by their full name from
    anybody's playbook: ``stephrobert.scaleway.fleet_report``,
    ``stephrobert.scaleway.power_schedule`` and
    ``stephrobert.scaleway.rolling_reboot``. Each one carries a
    ``meta/argument_specs.yml``, so Ansible validates its arguments before the
    first task rather than failing at the third. The playbook is the
    ergonomics, the role is the operational API, the module is the technical
    one; ``doctor`` stays a playbook, because an entry command has nothing to
    compose. Nothing a user types changed."
  - "roles - ``fleet_report`` leaves its report in
    ``scaleway_fleet_report_result``, so a calling playbook can act on it
    instead of reading it off the screen. Every other fact a role sets is
    prefixed and internal: a role included in somebody else's play shares their
    namespace, and a bare ``set_fact: machines`` would overwrite whatever they
    call ``machines``. A test refuses an unprefixed one, which is a defect that
    only exists once the code is a role."
  - "roles - a shipped playbook calls its role and never reimplements it, and a
    test refuses anything else. Two implementations of one operation always end
    up disagreeing, and the day they do, the documentation describes one while
    the user plays the other."
