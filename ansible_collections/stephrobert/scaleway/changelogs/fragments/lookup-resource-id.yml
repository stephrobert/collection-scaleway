minor_changes:
  - "New ``stephrobert.scaleway.resource_id`` lookup plugin. Half of the modules
    in this collection act on a sub-resource whose identifier only the matching
    ``_info`` module returns, so a playbook had to call a module, register its
    result and dig a UUID out of it. The lookup returns that identifier from the
    name you already know. Its resolution table is derived from the versioned API
    contracts rather than written by hand, so a resource that stops being
    listable, or that loses its ``name`` field upstream, leaves the table at the
    next generation instead of staying a promise. Twelve identifiers resolve
    today; four do not, and the plugin says why rather than reporting them as
    unknown. See #177."
  - "``resource_id`` matches the name exactly, and refuses rather than choosing.
    The Scaleway ``name`` query filter matches by prefix, which the contract
    states for Instances: ``server1`` returns both ``server100`` and ``server1``.
    The filter is sent so a whole fleet is not paginated, and the exact
    comparison is always done locally. No match and several matches both fail,
    and the message names what was found nearby or which candidates collided.
    Returning the first of several would make the playbook act on a resource
    nobody designated. See ADR-0019."
bugfixes:
  - "Terraform outputs that cross into a module no longer carry their scope. The
    Scaleway provider prefixes its identifiers with ``fr-par-1/``, and a module
    receiving one composes a URL the API rejects. Four of the five outputs kept
    it, which made the ``certificate_ids`` ordering measurement unreachable on
    the only target where it can run. A guard now refuses a scoped output before
    the first playbook starts, and names all the offending ones rather than the
    first. See #186."
