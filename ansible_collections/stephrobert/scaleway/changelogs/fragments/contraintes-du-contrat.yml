---
bugfixes:
  - "lb_subscriber - the module accepted ``email_config`` and ``webhook_config``
    together, which the API rejects with a 400. The contract marks them with a
    shared ``x-one-of`` group, and the module now declares them mutually
    exclusive, so the error arrives from Ansible before any request is sent."
minor_changes:
  - "The generator now carries the constraints the contract declares.
    ``x-one-of`` becomes ``mutually_exclusive``; a clearable field
    (``oneOf: [X, null]`` or ``type: [X, \"null\"]``) is recorded and counted.
    Constraint keywords the contract does not carry are measured rather than
    assumed, and the coverage report publishes all three numbers."
