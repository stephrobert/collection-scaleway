minor_changes:
  - "The project now records what it knows about its own adoption, and what it
    does not, in ``ADOPTERS.md``. The Galaxy download counter is deliberately
    absent from it: a pipeline reinstalling on every run weighs as much there as
    a team using the collection daily, so steering anything on that number means
    optimising something nobody can read. Every recorded use names where it was
    said, and an entry without a source fails the derived block rather than
    being published as a measurement. Saying you use it no longer means opening
    a bug report: the issue chooser now points at a discussion for that, and
    CONTRIBUTING describes how a chain someone else wrote reaches the shipped
    playbooks and the recipe chapter."
