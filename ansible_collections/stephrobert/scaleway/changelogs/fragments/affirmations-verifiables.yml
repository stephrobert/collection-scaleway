---
bugfixes:
  - "``galaxy.yml`` no longer claims the documentation site is unpublished. It
    has been online for months, and the comment stayed. The field keeps pointing
    at the repository tree **at the tag**, and now says why: the site publishes
    the state of ``main`` only, and Galaxy shows that link next to a version
    number, so a reader of an old release would land on today's documentation.
    The site is announced from the README instead, where no version frames it."
  - "The repository README announced two contradictory counts of CI jobs
    fourteen lines apart, one derived and one written by hand, and described
    ``mise run check`` as what a pull request has to pass, which stopped being
    true when CI grew jobs that ``check`` does not replay. Both are corrected,
    and the supply-chain row now names the workflow scanners instead of counting
    them."
minor_changes:
  - "``mise run chiffres`` now reads numbers spelled out in letters, not only
    digits, for the vocabulary of CI: jobs, scanners, required checks, gates.
    That is the class of defect that had escaped it. A guard keeps it from
    reading a count inside a compound term such as ``Day-2 operations``, and two
    mutations prove both the reach and the guard. What the control still cannot
    see is written in its own docstring, with what it leaves to human review."
