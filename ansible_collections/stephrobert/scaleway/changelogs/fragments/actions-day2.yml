---
bugfixes:
  - "``instance_server_action`` waited for the ``stopped`` state after
    ``stop_in_place``, while the contract declares ``stopped in place``, a
    **distinct** state. The action therefore failed after ``wait_timeout`` on
    an Instance that was properly stopped. It has been played against the
    emulator since, which is the only check that could have caught it: the
    defect was in the value, not in the shape."
  - "``instance_server_action`` returned immediately on ``reboot``, having
    observed nothing: the target state is the starting state, so the first read
    satisfied the wait in zero seconds and the next task ran during the reboot.
    The module now requires observing a transition, and says so when it sees
    none."
  - "An action module whose wait failed reported ``changed=false`` even though
    the API had accepted the action and the resource had changed. A replayed
    playbook believed it had done nothing. The result now carries
    ``changed=true`` from acceptance onward, whatever the outcome of the wait."
minor_changes:
  - "The generator refuses a wait override that promises a state absent from
    the contract. The enum is derived without guessing, from the resource
    schema and the field name, and a typo can no longer produce a module that
    waits for a state the API will never reach."
