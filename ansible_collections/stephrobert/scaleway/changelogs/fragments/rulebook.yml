minor_changes:
  - "The collection now ships an Event-Driven Ansible rulebook,
    ``stephrobert.scaleway.diagnose_on_alert``: an alert posted to its webhook
    makes it read the fleet. **Detect then diagnose, never detect then modify**,
    and that boundary is the design rather than a first step towards something
    else. An event is reachable by a third party in a way a command line is not,
    so a rule that powered machines off on a malformed payload would be the
    failure mode the chains refuse by construction, moved somewhere nobody
    reviews. A test refuses a rulebook that triggers anything that writes, and
    it derives what a playbook does rather than trusting its name."
  - "The rulebook is replayed on every CI run, and by ``mise run rulebook``
    locally: an emulator, ansible-rulebook on the rulebook of the installed
    collection, an alert posted the way a monitoring system would, and the
    diagnosis played by the rule. What is measured is not that the command exits
    zero, which a rulebook that never fires would also do, but that the playbook
    ran and that an event with no status ran nothing."
  - "The sources come from the ``ansible.eda`` collection, which you install
    yourself. Measured: ansible-rulebook carries webhook code inside its own
    package, but neither ``ansible.eda.webhook`` nor a bare ``webhook`` resolves
    without that collection present. This collection does not declare it as a
    dependency, because somebody installing modules to power a fleet down at
    night should not be made to pull an event framework they never asked for."
