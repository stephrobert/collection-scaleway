---
minor_changes:
  - "New module ``instance_server_action``, which triggers an action on an
    Instance: ``poweron``, ``poweroff``, ``reboot`` and ``stop_in_place``. In
    check mode it announces the change without triggering anything, and it
    waits until the Instance has actually reached the target state before
    returning."
  - "The action module does **not** expose ``terminate``, ``backup`` or
    ``enable_routed_ip``, which the contract nevertheless puts in the same
    enum. The first deletes the Instance and its local volumes, the second
    creates an image, the third migrates the network stack with no way back:
    none of them operates an existing resource. Every exclusion is written with
    its reason in the generator's overrides."
  - "New ``waitable`` documentation fragment for ``wait`` and ``wait_timeout``,
    with the values used by the official collection."
  - "New shipped playbook ``arreter_un_serveur``, which stops a named Instance
    and reads its state back rather than taking the module's word for it."
