---
bugfixes:
  - "The inventory plugin's ``organizations`` option filtered nothing. It was
    read, carried by the discovery context and counted in the cache key, but no
    provider passed it on and no local filtering applied it: the inventory was
    silently wider than requested. It is now passed to the API when a single
    organisation is requested, and **always** applied locally."
  - "``strict`` did not enter the cache key. A partial inventory recorded with
    ``strict: false`` was therefore served as is to a run asking for
    ``strict: true``, and since discovery was not replayed, the errors already
    present no longer caused a failure."
  - "A missing permission on IPAM or VPC failed the whole inventory in strict
    mode, including when every machine had a perfectly reachable public
    address. It is now a warning: it is an enrichment that does not happen, not
    a discovery that fails."
minor_changes:
  - "The IPAM and VPC index is no longer built when no requested product
    carries private network cards. An inventory with ``products:
    [apple_silicon]`` used to issue twelve API calls it made nothing of. The
    capability is declared by each provider, not guessed by the core."
