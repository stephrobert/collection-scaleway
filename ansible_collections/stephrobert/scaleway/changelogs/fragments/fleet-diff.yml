minor_changes:
  - "roles - ``fleet_diff`` says what changed between a snapshot you kept and the
    fleet as it is now, or between two snapshots. A report that announces the
    same count every morning stops being read by the third morning; the useful
    question is why there are two more today."
  - "roles - ``fleet_diff`` only compares a zone both snapshots measured. A zone
    that did not answer, and a zone that was simply not read this time, would
    both make everything it holds look removed, and the report would be perfectly
    plausible. Such zones come out named, each with which of the two cases it is,
    and the resources they hold are counted rather than dropped."
  - "roles - the level a comparison earns is computed, never passed in: ``quiet``
    when nothing is new, ``changed`` when something moved, and
    ``action_required`` when something could not be measured. A caller able to
    force it could produce a report that calls itself calm when it is not.
    Nothing new prints one line, on purpose."
  - "roles - a last-change timestamp that moved on its own does not make a
    change. It is a witness rather than a property, and a diff line showing only
    a timestamp gives nobody an action; those resources are counted apart,
    neither hidden nor presented as actionable."
  - "playbooks - ``fleet_report`` accepts ``-e snapshot_to=<file>`` and writes the
    snapshot there. Redirecting the playbook's output would have captured
    Ansible's own decoration rather than JSON, which is what the previous
    instruction suggested."
  - "roles - ``fleet_report`` accepts ``output: none``, for a caller that
    includes it for its data and for which a second report on screen is noise."
