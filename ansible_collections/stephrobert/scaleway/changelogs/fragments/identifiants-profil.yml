---
bugfixes:
  - "``api_url`` and ``api_allow_insecure`` carried a default value in the
    ``argument_spec``. Since a default value is never absent, they **always**
    overrode what the Scaleway configuration file declared: a user whose
    profile points at an emulator saw their playbook go to production, with
    real credentials and real resources. The default is now applied after the
    profile is read, and the announced order, parameter then environment then
    file, is honoured."
  - "The secret key could appear in clear text in the failure message. The
    SDK's validation raises ``Invalid secret key format 'SCW...'``, value
    included, and Ansible only censors values that came from module parameters,
    not those read from the configuration file: the key landed in the playbook
    log and in CI artefacts. The message now names the rejected field, never
    its value."
