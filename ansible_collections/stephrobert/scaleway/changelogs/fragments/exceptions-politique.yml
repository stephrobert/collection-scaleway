minor_changes:
  - "roles - a policy now carries ``exceptions``, for the case every used policy
    meets within a week: yes, that bastion must have a public address. Without
    them the only way out is to delete the rule, which loses it for the whole
    fleet in order to excuse one machine."
  - "roles - an exception changes a finding's status, it never removes it. The
    finding stays readable with ``status: suppressed`` and the ``suppressed_by``
    that covers it, and it is counted apart. A finding that was erased is a
    problem nobody knows about any more, which is what writing the exception
    rather than removing the rule is meant to avoid."
  - "roles - ``reason``, ``owner`` and ``expires_at`` are required on every
    exception, and each stops one thing: without a reason it is a rule quietly
    switched off, without an owner there is nobody to ask whether it still
    holds, and without an expiry it is not an exception but a change to the
    policy written in the wrong place."
  - "roles - an expired exception becomes a finding of severity ``fail`` rather
    than a refusal. Refusing the whole policy over one stale line would switch
    off the audit on the day an exception expires, which is the opposite of what
    is wanted then."
  - "roles - a selector names exactly one of ``id``, ``name`` or ``tags``. Two
    criteria ask two questions and the answer would depend on the order they are
    read in, and a selector with no criterion at all would cover the whole fleet,
    which is a removed rule wearing an exception's clothes."
  - "roles - a ``name`` carried by two resources is refused rather than resolved.
    Measured on a real account: two machines accept the same name in one zone, so
    covering both would excuse a resource nobody named, and covering one would
    depend on the read order."
  - "roles - an exception that matches nothing is reported and not refused. One
    left behind by a destroyed machine is housekeeping, not a policy error."
  - "roles - the JSON and Markdown renderings of ``fleet_audit`` now carry the
    expired exceptions alongside the fleet's findings, and the status of each.
    A pipeline reading the JSON would otherwise never see the expiry, which is
    the very failure this filter exists to prevent, one level up."
