minor_changes:
  - "Every shipped operation now returns a machine-readable result alongside its
    sentence, built by the new ``stephrobert.scaleway.operation_result`` filter.
    A pipeline, a ticket or a monitoring system reads
    ``scaleway_operation`` instead of parsing standard output, and an output
    parser breaks on the first reworded sentence. Each operation also leaves its
    own ``scaleway_<operation>_operation``, which survives the next one."
  - "filter - ``operation_result`` derives its counts from the names rather than
    taking them alongside. A ``changed: 3`` passed next to the list of changed
    machines would be a second source of one fact, and two sources of one fact
    end up disagreeing; here the count is the length of the list. It refuses a
    refusal without a reason, a count passed instead of a list, and an operation
    with no target or no mode. When nothing could be examined the totals are
    ``null`` rather than ``0``, because nothing measured is not nothing found."
