bugfixes:
  - "modules - ``k8s_cluster_acl_action`` requires the ACLs it adds, and its
    published example shows one. Adding no ACL is accepted by the API, changes
    nothing, and the example was perfectly copyable: somebody copying it learned
    nothing about what the module does."
  - "modules - ``instance_snapshot_action`` requires the bucket and the key it
    exports to, and its example shows both. Exporting a snapshot without saying
    where does nothing useful, and it had the same shape of defect, found by the
    guard written for the first one."
minor_changes:
  - "generator - an action whose body carries parameters no longer publishes an
    example that supplies none. The contract cannot settle this: its
    ``requestBody`` is required while the properties inside it are not, and the
    parser translates what it reads. The decision belongs to an override, with
    its reason, and a guard now refuses the silence."
