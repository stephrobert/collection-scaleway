---
minor_changes:
  - "New inventory plugin ``stephrobert.scaleway.scaleway``. It discovers
    machines product by product, then links them to their private networks and
    their VPCs by listing IPAM **once per region** instead of once per network
    card, and it keeps the network relation rather than a single private
    address with no network attached."
  - "The inventory discovers ``instance``, ``elastic_metal`` and
    ``apple_silicon`` behind one normalised model. An unknown product in
    ``products`` is refused, not ignored."
  - "Hostname collisions no longer lose a machine: a name already taken
    receives the zone as a suffix, then the identifier, deterministically, and
    every disambiguation is reported."
  - "``ansible_host`` is chosen by order of address families, or by a named
    private network when a machine has several. The reason for the choice is
    exposed in ``scaleway_address_source``."
  - "Group names are sanitised properly: ``production/web`` becomes
    ``production_web`` and ``2024`` becomes ``_2024``, where Ansible would make
    ``_024``."
  - "``compose``, ``groups`` and ``keyed_groups`` are actually applied, and not
    merely inherited from the ``constructed`` documentation fragment."
  - "Discovery failures are classified: credentials refused (fatal), missing
    permission on a product (named error), product absent from a zone
    (warning). ``strict: true`` turns any error into a refusal."
  - "The cache key covers everything that changes the result, including the
    profile, the API URL, the filters and the address policy. Two different
    configurations no longer share an inventory."
  - "New guide ``docs/guides/dynamic-inventory.md``, which documents a measured
    trap along the way: ``ansible-inventory`` downgrades an inventory plugin's
    failure to a warning and exits 0, unless
    ``ANSIBLE_INVENTORY_ANY_UNPARSED_IS_FAILED`` is asked for."
