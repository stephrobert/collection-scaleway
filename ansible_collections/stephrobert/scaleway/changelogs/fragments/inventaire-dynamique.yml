---
minor_changes:
  - "Nouveau plugin d'inventaire ``stephrobert.scaleway.scaleway``. Il découvre les
    machines produit par produit, puis les relie à leurs réseaux privés et à
    leurs VPC en listant IPAM **une fois par région** au lieu d'une fois par
    carte réseau, et il conserve la relation réseau plutôt qu'une seule adresse
    privée sans son réseau."
  - "L'inventaire découvre ``instance``, ``elastic_metal`` et ``apple_silicon``
    derrière un même modèle normalisé. Un produit inconnu dans ``products`` est
    refusé, pas ignoré."
  - "Les collisions de noms d'hôtes ne perdent plus de machine : un nom déjà
    pris reçoit la zone en suffixe, puis l'identifiant, de façon déterministe,
    et chaque désambiguïsation est signalée."
  - "``ansible_host`` se choisit par ordre de familles d'adresses, ou par un
    réseau privé nommé quand une machine en a plusieurs. La raison du choix est
    exposée dans ``scaleway_address_source``."
  - "Les noms de groupes sont assainis pour de bon : ``production/web`` devient
    ``production_web`` et ``2024`` devient ``_2024``, là où Ansible en ferait
    ``_024``."
  - "``compose``, ``groups`` et ``keyed_groups`` sont réellement appliqués, et
    pas seulement hérités du fragment de documentation ``constructed``."
  - "Les échecs de découverte sont classés : identifiants refusés (fatal),
    droit manquant sur un produit (erreur nommée), produit absent d'une zone
    (avertissement). ``strict: true`` transforme toute erreur en refus."
  - "La clé de cache couvre tout ce qui change le résultat, y compris le profil,
    l'URL de l'API, les filtres et la politique d'adresse. Deux configurations
    différentes ne partagent plus un inventaire."
  - "Nouveau guide ``docs/guides/inventaire-dynamique.md``, qui documente au
    passage un piège mesuré : ``ansible-inventory`` déclasse l'échec d'un
    plugin d'inventaire en avertissement et sort en 0, sauf si
    ``ANSIBLE_INVENTORY_ANY_UNPARSED_IS_FAILED`` est demandé."
