---
bugfixes:
  - "Load Balancer lists are now paginated. Scaleway uses two spellings for
    page size depending on the product, ``per_page`` on Instance and
    ``page_size`` on the Load Balancer, and the rule knew only one: eleven
    operations were not declared as paginated, their pagination parameters
    became module options, and a list would have returned its **first page in
    silence**."
