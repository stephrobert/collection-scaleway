---
minor_changes:
  - "Managing modules now verify what the write produced. After the second read,
    every field the playbook asked for is compared with what the API returns,
    using the same comparison strategy as the outbound decision. A divergence
    fails the module with ``failed_postconditions`` naming the field, the
    requested value and the observed one, and ``changed`` stays true because the
    resource did move."
  - "A parameter can be excluded from that verification through an override
    carrying its reason, for an API that applies a field asynchronously. None is
    excluded today."
