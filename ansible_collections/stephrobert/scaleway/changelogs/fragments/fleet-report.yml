minor_changes:
  - "New ``stephrobert.scaleway.fleet_report`` playbook: the whole fleet in one
    read-only command, with three outputs for three readers. ``text`` for a
    terminal, ``json`` for a pipeline, ``markdown`` for a ticket. It creates
    nothing and changes nothing, which is what makes it safe to run first, and
    it answers the question asked most often: where is the fleet and in what
    state."
  - "``fleet_report`` never counts a zone it could not read. **A zone that does
    not answer has not been measured to be empty**, so it is named as unmeasured
    rather than contributing a zero, and when no zone answers at all the playbook
    says so instead of printing a total. A report that counted an unreachable
    zone as empty would be worse than no report, because it would be a plausible
    one."
