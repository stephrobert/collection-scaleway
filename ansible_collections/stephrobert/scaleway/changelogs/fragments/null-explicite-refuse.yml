bugfixes:
  - "Managing modules no longer ignore an explicit ``null`` on a field the
    contract declares clearable. ``description: null`` used to produce the same
    request as an omitted ``description``, and the module reported ``ok`` with
    the description still there. The module now fails before reading anything,
    names the field, and says to omit the option to leave the value unchanged.
    Clearing a field is still not supported."
minor_changes:
  - "Options for clearable fields of managing modules are now published as
    ``type: raw`` with the marker ``__unchanged__`` as their default: it is the
    only public mechanism by which Ansible lets a module tell an explicit
    ``null`` from an omitted option, measured on every ``ansible-core`` the
    collection supports. The option description states the API type, and the
    runtime re-validates provided values against it, so a playbook sees no
    difference in conversions or error messages."
