bugfixes:
  - "roles - each role now ships a README, which Galaxy requires: the import of
    the whole collection is refused without one, with ``No role readme found``,
    and that refusal arrives after the gate, the checks, the sanity run and the
    archive have all passed. Neither ``ansible-galaxy install`` nor the
    packaging step applies that rule. The pages are derived from each role's
    argument spec rather than repeating it, and carry one real invocation each."
  - "The release workflow now runs Galaxy's own importer on the built archive
    before publishing, which reproduces that refusal to the second. It is
    installed in that job rather than in the repository's lock file: it pulls
    around forty packages, including the very tool this repository refused for
    that reason, and it is worth nothing except at the moment of publishing."
