---
bugfixes:
  - "``version_added`` now says the version in which a module, option or return
    value **appeared**, instead of the version the generator happened to run
    in. Every module published up to 0.4.0 announced the release it shipped
    with, so a module present since 0.1.0 claimed to need 0.4.0. The dates are
    read from a journal versioned alongside the generator, reconstructed from
    the published tags; a name is dated once and never redated, and the loader
    refuses a journal that contradicts itself. See ADR-013."
minor_changes:
  - "``mise run introductions`` checks that the appearance journal still tells
    the truth about what is published: it refuses a version in preparation that
    is not later than the released one, and lists every module, option and
    return value that no dated block covers yet."
