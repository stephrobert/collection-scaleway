---
bugfixes:
  - "Pagination no longer truncates a list when the API caps the page size. The
    condition \"the page is shorter than requested\" was tested **before**
    ``total_count``, while the information needed to continue was in the same
    response: facing an API that caps ``per_page`` at 50 for 100 requested
    while announcing 120 items, the function returned 50 items, requested only
    one page, and reported nothing. That is the defect its own documentation
    named as the worst of the three, an incomplete list presenting itself as
    complete. Instance caps at 100, so the case was latent; this runtime is
    shared by every product to come."
  - "An API announcing a ``total_count`` it does not honour now produces a
    named error. Returning the partial list in silence would be exactly what
    this function exists to prevent."
