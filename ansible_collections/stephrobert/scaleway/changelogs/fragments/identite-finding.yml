minor_changes:
  - "filter - every audit finding now carries an C(id) that is recomputed on
    every run and comes out the same tomorrow for the same problem on the same
    resource. Nothing random, nothing timestamped, or everything would be new
    each morning. It is what lets a later version count findings as new,
    persisting or resolved without a heuristic."
  - "filter - a finding also carries the C(field) the rule judges, which is
    information rather than identity: each rule judges exactly one field, so the
    field adds nothing the rule does not already say. A test holds that
    invariant, because the day a rule judged two fields two distinct findings
    would share one identity."
bugfixes:
  - "filter - an audit finding identified its resource by name, and a name is not
    an identity: measured on a real account, two machines accept the same name in
    one zone and the API then returns two distinct identifiers. Two homonymous
    machines produced indistinguishable findings, and grouping refusals by name
    merged them into one, so the count of examined resources was short by one.
    Both now go through the resource identifier."
