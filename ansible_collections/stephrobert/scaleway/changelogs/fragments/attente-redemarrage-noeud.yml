bugfixes:
  - "modules - ``k8s_node_reboot_action`` waits for the node to be back before
    returning, instead of returning on an accepted trigger. A rolling reboot
    would have moved to the next batch while the first was still rebooting,
    which is the whole thing a rolling reboot exists to avoid."
  - "modules - the wait observes what the contract declares: ``status``, not the
    ``state`` Instance uses, and ``ready`` after passing through ``rebooting``.
    Waiting on the wrong field would fail the action after ``wait_timeout`` on a
    node that had come back."
minor_changes:
  - "modules - ``k8s_node_reboot_action`` gains ``wait`` and ``wait_timeout``,
    and returns the state the node settled in."
