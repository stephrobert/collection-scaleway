---
minor_changes:
  - "The version of ``mise`` and the SHA of the action that installs it were
    copied into nine steps across four workflows. Dependabot keeps the SHA
    fresh, because that is a dependency to it; it does not keep ``version:``
    fresh, because that is not. One of the nine could therefore drift alone with
    nothing to notice. Both now live in a single composite action, and
    ``mise run outillage`` refuses a second declaration, with two mutations
    proving the refusal bites. ``mise.toml`` also gained a ``min_version``,
    which is a different thing: the pin says what CI installs, the floor refuses
    a ``mise`` too old to read the file."
