bugfixes:
  - "The ``diff`` of a management module read its two sides differently. The
    ``before`` went through the projection that reconciles a written
    ``backend_id`` with a read ``backend: {id: ...}``; the ``after`` read the
    key directly and found nothing. On ``lb_frontend`` a user saw
    ``after: {backend_id: null}`` while the API had returned ``backend.id``.
    The module worked and the diff lied, which is worse than a module that
    fails."
