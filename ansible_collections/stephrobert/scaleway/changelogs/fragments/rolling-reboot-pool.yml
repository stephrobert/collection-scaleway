minor_changes:
  - "roles - ``rolling_reboot`` rolls through the nodes of a Kubernetes pool
    with the same grammar as machines: ``kind: k8s_node`` plus one of ``group``,
    ``name`` or ``id``. Somebody who knows how to roll through machines learns
    nothing new."
  - "roles - ``kind`` says what is being rolled through, not how it is
    designated. It is not a criterion, so the selector still carries exactly one
    of them and one grammar validates both products."
  - "roles - for nodes, ``group`` means the pool, which groups nodes the way an
    inventory group groups machines. The list comes from the API rather than the
    inventory, which serves Instance, Elastic Metal and Apple Silicon and
    nothing from Kubernetes."
  - "roles - ``tags`` is not accepted for nodes. Measured:
    ``scaleway.k8s.v1.Node`` carries none, ``scaleway.k8s.v1.Pool`` does, and
    passing a pool's tags off as its nodes' would add a hop you cannot see."
  - "roles - a region that did not answer stops the roll rather than narrowing
    it. Rolling through a fleet that is only partly known is how a roll takes
    down what it could not see."
  - "filter - ``select_resources`` says what a selector designates among
    resources read from the API, the counterpart of ``select_hosts`` for what
    does not come from the inventory. An ambiguous ``name`` is refused; several
    nodes in a pool are the point, not an ambiguity."
  - "filter - a node carries the name of the pool it lives in, joined at the
    seam. It is the name an operator writes in a selector and reads in the
    console, where ``pool_id`` is what the API returns."
