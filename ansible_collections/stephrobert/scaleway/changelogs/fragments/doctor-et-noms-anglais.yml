breaking_changes:
  - "The shipped playbooks are renamed to English. ``inventaire_serveurs``
    becomes ``list_servers``, ``detail_dun_serveur`` becomes ``server_details``,
    and ``arreter_un_serveur`` becomes ``stop_server``. A playbook name is what a
    user types, so it is published surface, and the rest of the collection is in
    English. **The old names stop resolving, and nothing can soften that**:
    Ansible exposes no playbook loader, so ``meta/runtime.yml`` cannot redirect
    an old playbook name to a new one. Update any
    ``ansible-playbook stephrobert.scaleway.<name>`` call accordingly."
minor_changes:
  - "New ``stephrobert.scaleway.doctor`` playbook, the first command to run
    against a new setup. It checks the ansible-core that will run the modules,
    the Scaleway SDK the playbook interpreter can import, where the credentials
    come from, and whether the API answers in a zone. **Every check runs**: none
    aborts the others, so one run reports every problem rather than the first
    one. Finding one problem per run is how a first contact is spent on nothing."
  - "``doctor`` separates three states that are not the same thing: the check ran
    and the answer is yes, the check ran and the answer is no, and the check
    could not run at all. A zone that does not answer has not been measured to be
    empty. ``Ready.`` is printed only when everything was checked **and**
    everything passed, so an unreachable API never reads as a success."
  - "``doctor`` never prints a credential. It names where one comes from, which
    is what repairs a setup, and a report can be pasted into an issue as is."
