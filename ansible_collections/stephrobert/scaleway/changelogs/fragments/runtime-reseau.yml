---
bugfixes:
  - "API calls are now bounded in time. The Scaleway SDK issues its requests
    **with no timeout at all**: a silent connection froze a playbook
    indefinitely. An ``api_timeout`` parameter bounds every call, at 60 seconds
    by default."
  - "A network failure now produces a named error instead of a Python
    traceback. Exceptions from ``requests`` were left as they were, and Ansible
    displayed ``MODULE FAILURE``: the user could not tell whether their
    playbook was at fault or the network was."
minor_changes:
  - "The collection composes its own HTTP requests and no longer calls
    ``API._request``, a private method of the SDK. Carrying the
    ``x-total-count`` header into the body's ``total_count`` field, on which
    the pagination guard depends, was that method's quietest behaviour: it is
    now explicit and tested."
