---
bugfixes:
  - "The collection README claimed the inventory's variables were **all any
    module needs**. Measured: 25 of the 50 modules work with what the inventory
    posts, and the other 25 act on a sub-resource carrying its own identifier
    that no machine discovery can supply. The page now says which, and shows the
    ``_info``-then-manage chain that supplies the missing identifier."
minor_changes:
  - "``mise run docs:examples`` now analyses both READMEs, not only ``docs/``.
    The collection README is what Galaxy publishes, so it holds the first
    playbook a user copies, and nothing checked it: a renamed module would have
    stayed there until somebody tried. Adding it surfaced that a README publishes
    **tasks**, not plays; those are wrapped in a minimal play before the syntax
    check rather than refused, since refusing them would leave the most-copied
    examples uncontrolled. Two mutations prove both halves."
