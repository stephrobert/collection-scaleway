bugfixes:
  - "roles - ``fleet_report`` reported two zones as unmeasured on every clean
    run, and neither was unmeasured. The Load Balancer contract declares eight
    zones where Instance declares ten, and the module refused the rest before
    any call. ``zones_unmeasured`` carries this collection's most repeated
    claim, that nothing measured is not nothing found, and a signal that cries
    wolf is a signal nobody reads: the day a zone really does not answer, the
    line would have looked the same."
minor_changes:
  - "Each product is now asked only the zones its own contract declares, and the
    report carries ``zones_not_offered`` beside ``zones_unmeasured``: a zone a
    product does not offer is a fact about the product, not a measurement that
    failed. The map comes from the versioned contracts, written by the generator
    into ``module_utils`` and held by ``check:generated``. Typing the eight
    zones into a role would have been a second source of the contract, wrong the
    day the product opens a zone."
  - "filter - ``product_zones`` splits asked zones into what a product offers
    and what it does not, and refuses a product absent from the map: one without
    modules has nothing to be asked."
