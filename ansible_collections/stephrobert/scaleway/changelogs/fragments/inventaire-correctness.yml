---
bugfixes:
  - "An authentication refusal was never fatal. Scaleway returns
    ``{\"message\": \"denied authentication\"}`` on a 401, and the
    classification rule looked for the word ``denied`` to identify a missing
    permission: no revoked token therefore raised ``AuthenticationFailed``, and
    the inventory came out **empty with a return code of 0**. The rule now
    looks for ``permission``, and the nuance on permission 401s survives."
  - "``tags_match: any``, which is the default, lost machines. The Instance API
    applies an **AND** on ``tags`` and not an OR, measured on three concordant
    sources: asking for two tags returned only the machines carrying both, and
    local filtering cannot recover what was never downloaded. With several tags
    in ``any`` mode, the filter is no longer delegated to the API."
  - "``include_raw`` was entirely inert. The option was documented, counted in
    the cache key and tested on the provider side, but the raw response did not
    enter the serialisation **every** run goes through: ``scaleway_raw`` never
    appeared."
  - "A misspelled zone was discarded in silence: zero zones queried, zero
    calls, zero warnings, and an empty inventory with code 0. An unknown zone
    is now refused, as products, group axes and address families already were."
  - "An unknown hostname source was accepted, and every machine was then
    discarded for lack of a name. A source naming a non-textual field,
    ``private_networks``, returned an object where the type promises a string."
  - "Two accounts could share a cached inventory. With no ``profile``
    declared, two different access keys produced the same fingerprint, and the
    second run received the first one's fleet. Only the key's fingerprint
    enters the cache key, never its value."
