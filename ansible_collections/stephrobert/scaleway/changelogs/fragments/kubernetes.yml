minor_changes:
  - "modules - Kubernetes is the third product, and it does not enter on its
    number of routes. The official Scaleway collection ships ``k8s_cluster`` and
    ``k8s_pool``, both ``state: present/absent``: it creates clusters and offers
    nothing to operate them afterwards. This collection arrives behind it rather
    than facing it. Nineteen modules: the clusters, their pools, their nodes,
    the versions a cluster can move to, and the actions that upgrade, reboot or
    replace."
  - "modules - ``k8s_cluster_available_version_info`` next to ``k8s_cluster_info``
    is what makes version drift a measurement rather than an impression, and it
    is the question nobody serves today."
  - "lookup - ``resource_id`` no longer resolves a name that one product resolves
    and another refuses. ``acl_id`` exists in both the Load Balancer and
    Kubernetes, and they are not the same ACLs: the first resolved it, the second
    cannot for want of a name field, so the first one's resolution stood alone
    and somebody writing ``acl_id`` while thinking of a cluster rule got a load
    balancer rule in silence. Returning the wrong product's identifier is worse
    than returning none."
bugfixes:
  - "modules - a documentation line no longer exceeds what ``ansible-test
    sanity`` accepts. PyYAML never breaks inside a word, so a description
    carrying a URL of over a hundred characters in mid-sentence was wrapped after
    the URL, on a line of nearly two hundred characters. The rendering now
    narrows its width for the one block that needs it rather than reflowing every
    description in every module."
