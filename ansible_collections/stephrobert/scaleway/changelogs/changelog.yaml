      - lookup-resource-id.yml
      - power-schedule.yml
      - quickstart.yml
      - recettes.yml
      - release_summary.yml
      - rolling-reboot.yml
      - scheduling.yml
      - strict.yml
    plugins:
      lookup:
        - description: Resolve a Scaleway resource name into its identifier.
          name: resource_id
          namespace: null
