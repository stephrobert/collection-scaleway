ancestor: null
releases:
  0.1.0:
    changes:
      major_changes:
      - '``scaleway`` documentation fragment for the common parameters, which a module therefore
        never redeclares.'
      - New module ``instance_server_info``, which serves ``GetServer`` and ``ListServers``
        behind a single interface. A supplied identifier reads one Instance, an absent one
        lists the whole zone, every page walked.
      - 'Shared runtime in ``plugins/module_utils/scaleway.py``: one way to build the client,
        centralised error handling that never copies a secret, complete pagination and check
        mode.'
      minor_changes:
      - Two example playbooks in ``playbooks/``, played on every run of the integration target
        rather than written once.
      - '``SCW_API_URL`` is honoured end to end, which makes it possible to exercise a playbook
        against a local emulator, with no credentials and no spend.'
      release_summary: 'First version of the collection, produced by this repository''s generator
        from the OpenAPI documents Scaleway publishes.


        The complete chain, from contract to playbook, is proven before being widened: the
        generator, the shared runtime and the drift mechanisms come first, and the modules
        follow from them.'
    fragments:
    - 0.1.0-premiere-version.yml
    modules:
    - description: Gather information about Scaleway Instance servers.
      name: instance_server_info
      namespace: ''
    release_date: '2026-09-01'
