  0.5.0:
    changes:
      bugfixes:
        - 'The collection README announced the credential precedence **backwards**.
          It read ``environment, then configuration file, then module parameters``,
          while the runtime has always let a module parameter win over the environment,
          which wins over the configuration file. The documentation fragment said
          it correctly, so two published pages contradicted each other. Someone managing
          several projects could believe an environment variable overrode an explicit
          parameter, and work on the wrong project without the API saying anything:
          the credentials are valid, just not the intended ones.'
        - 'The collection README claimed the inventory''s variables were **all any
          module needs**. Measured: 25 of the 50 modules work with what the inventory
          posts, and the other 25 act on a sub-resource carrying its own identifier
          that no machine discovery can supply. The page now says which, and shows
          the ``_info``-then-manage chain that supplies the missing identifier.'
        - The examples of an action module no longer say "an Instance" whatever the
          product. The phrase was hard-coded, and it happened to be right only because
          ``instance_server_action`` is the only module whose action carries an enum;
          the next product with one would have published "Migrate an Instance" for
          a load balancer. The examples now name the resource the page is about.
        - The repository README announced two contradictory counts of CI jobs fourteen
          lines apart, one derived and one written by hand, and described ``mise run
          check`` as what a pull request has to pass, which stopped being true when
          CI grew jobs that ``check`` does not replay. Both are corrected, and the
          supply-chain row now names the workflow scanners instead of counting them.
        - 'The runtime no longer writes ``requests.Response._content``. It carried
          the ``x-total-count`` header into the response body by rewriting a private
          attribute of a third-party library, in a transport that had been rewritten
          precisely to stop depending on a private method of the Scaleway SDK. The
          header is now merged into the body **that was read**, which is what the
          paginator actually needed: the behaviour is unchanged and a regression test
          follows the header all the way to what ``request`` returns.'
        - 'Three ``*_type_info`` pages claimed "The API contract names no payload
          field for this operation", while the contract names ``servers`` or ``volumes``.
          Their response wraps a map, which the parser read as neither a list nor
          a single object, so the payload field was lost and the page published ``contains:
          {}`` alongside a sentence that says the opposite of what the contract says.
          The pages now return the field the contract names, and describe what it
          holds.'
        - '``--check`` on an action module now sees what a rehearsal is for. It exited
          before building the API client, so it reported ``changed`` with no SDK,
          no credentials and no check that the resource exists, while the same play
          without ``--check`` failed cleanly. The client is now built, and the resource
          read when the contract offers a unitary read, before returning without sending
          anything. When no unitary read exists, the message says the resource was
          not verified rather than implying it was. See #168.'
        - '``.github/zizmor.yml`` disables the ``self-repository`` audit, with the
          measurement that justifies it. zizmor 1.30.0 asks for ``uses: $/...``, which
          GitHub has supported since July 2026; **actionlint 1.7.12 rejects it** as
          an invalid format, and that is both the latest release and the one CI installs.
          Applying one gate''s fix would turn it into the other gate''s failure. Both
          were installed and run locally before writing that down, because a supposed
          conflict between gates is not a conflict between gates.'
        - '``galaxy.yml`` no longer claims the documentation site is unpublished.
          It has been online for months, and the comment stayed. The field keeps pointing
          at the repository tree **at the tag**, and now says why: the site publishes
          the state of ``main`` only, and Galaxy shows that link next to a version
          number, so a reader of an old release would land on today''s documentation.
          The site is announced from the README instead, where no version frames it.'
        - '``instance_server`` rewrote ``public_ips`` and ``private_nics`` on **every**
          run, reporting ``changed`` each time. The request takes a list of IDs and
          the API returns the full objects, so the comparison found them different
          at every execution: a playbook using either field was never idempotent,
          whatever ``changed`` displayed. This is the plural form of the ``lb_frontend.backend_id``
          defect, which the runtime handled only in the singular. Reproduced offline
          before being fixed, and the reproduction is kept as a test.'
        - '``lb_frontend`` rewrote ``certificate_ids`` on every run. Measured against
          the real account on 8 September 2026 through a recording proxy: the write
          answers in the order asked, and the **read reverses it**, stably, two hundred
          exchanges apart. Comparing in order therefore found a difference at every
          execution, and the module was never idempotent whatever ``changed`` displayed.
          The override sets ``set``, which keeps multiplicities: a certificate listed
          twice stays distinct from one listed once.'
        - '``version_added`` now says the version in which a module, option or return
          value **appeared**, instead of the version the generator happened to run
          in. Every module published up to 0.4.0 announced the release it shipped
          with, so a module present since 0.1.0 claimed to need 0.4.0. The dates are
          read from a journal versioned alongside the generator, reconstructed from
          the published tags; a name is dated once and never redated, and the loader
          refuses a journal that contradicts itself. See ADR-013.'
      minor_changes:
        - 'A new comparison strategy, ``id_list``, compares a requested list of IDs
          with the list of objects the API returns. It is **not** a human decision:
          the generator measures both sides of the contract, the request declaring
          an array and the read schema declaring an array of objects, and comparing
          those two directly has only one possible verdict. Exactly two managed parameters
          are in that case across both products, and a test names them so the count
          cannot drift in silence. The runtime refuses to project anything that is
          not a list of objects carrying an ``id``, and the diff goes through the
          same projection, which is the invariant ADR-009 already carried.'
        - 'Every generated module now publishes an ``attributes`` section, the place
          Ansible normalises for declaring ``check_mode`` and ``diff_mode`` support.
          Until now the collection README claimed both and the module pages said nothing,
          so a reader on Galaxy had to take the README''s word for it, which is exactly
          what this repository''s own criterion forbids. The values are not intuited
          from the class: a test exercises the runtime for each of the three kinds
          and asserts the declared support against what actually happens, and ``mise
          run docs:quality`` refuses a page announcing a support its kind does not
          hold. Three mutations prove those refusals bite.

          The attributes carry no ``version_added``: check mode has worked since each
          module''s own first version, and only the declaration is new. Dating the
          declaration would suggest new support, which would be a second way of lying
          about a date.'
        - Every operation now carries a retry policy, and the runtime honours it.
          A read replays on ``429``, on the ambiguous ``5xx`` and on transport failures;
          a managing module's write replays only on ``429``, where the rate limiter
          answered before the API and the request was not processed; the operation
          an action module triggers is never replayed, because a reboot played twice
          is not a reboot. See ADR-018.
        - 'Managing modules now say how to clear a field the contract declares clearable.
          Measured against the real account: the empty value of the type clears it
          (``description: ""``, ``tags: []``), while an explicit ``null`` is accepted
          with a 200 and changes nothing, because this API reads ``null`` as "field
          not provided". An explicit ``null`` is therefore refused before anything
          is read, and the refusal names the value to write. ``int`` and ``bool``
          have no empty value and cannot be cleared; their pages say so. See ADR-016.'
        - 'Options for clearable fields recover their natural type on the published
          page. They were ``type: raw`` with the default ``__unchanged__``, and their
          ``choices`` and ``elements`` had to be stated in prose; they now publish
          the type, choices and elements of the contract, and no default at all. An
          omitted option is told from an explicit ``null`` by a witness that publishes
          nothing.'
        - The credential precedence now has a single definition, ``PRECEDENCE`` in
          the runtime. One test puts the three sources in conflict on the same field
          and asserts which wins; another reads the collection README, the documentation
          fragment and the runtime architecture page, and requires each to name the
          three sources in that order. A third pins the sentence published up to 0.4.0
          and proves the check refuses it.
        - 'The version of ``mise`` and the SHA of the action that installs it were
          copied into nine steps across four workflows. Dependabot keeps the SHA fresh,
          because that is a dependency to it; it does not keep ``version:`` fresh,
          because that is not. One of the nine could therefore drift alone with nothing
          to notice. Both now live in a single composite action, and ``mise run outillage``
          refuses a second declaration, with two mutations proving the refusal bites.
          ``mise.toml`` also gained a ``min_version``, which is a different thing:
          the pin says what CI installs, the floor refuses a ``mise`` too old to read
          the file.'
        - '``Retry-After`` is honoured in both forms RFC 9110 allows, a number of
          seconds or an HTTP date. An unreadable header falls back to the default
          wait rather than failing the module, and a delay beyond the ceiling is not
          waited for: the module would look frozen, and the error carries the header.'
        - '``docs/architecture/runtime.md`` describes the transport that exists. It
          still explained that requests went through ``scaleway_core.api.API._request``
          and that a guard watched that private method''s signature, a decision reversed
          before 0.4.0. Every responsibility of the transport is now named with the
          place that holds it, and the absence of a retry policy is named as a deliberate
          gap rather than left to be discovered. See ADR-014.'
        - '``lb_backend`` gains the ``host`` option, and ``lb_backend_info`` returns
          it. Scaleway added the field upstream: it sets the HTTP Host header or the
          TLS SNI used when connecting to backend servers. Nobody wrote this option
          by hand; the drift was detected, the contract re-synced, and the generator
          produced it.'
        - '``mise run api:privee`` refuses an underscored attribute of a third-party
          library anywhere in what the collection ships. The rule existed as a paragraph
          and had already been broken once by the very change that stated it. Two
          mutations prove the refusal bites, including the counter-example that ``self._client``
          stays allowed, without which the control would refuse the whole runtime
          and be turned off.'
        - '``mise run chiffres`` now reads numbers spelled out in letters, not only
          digits, for the vocabulary of CI: jobs, scanners, required checks, gates.
          That is the class of defect that had escaped it. A guard keeps it from reading
          a count inside a compound term such as ``Day-2 operations``, and two mutations
          prove both the reach and the guard. What the control still cannot see is
          written in its own docstring, with what it leaves to human review.'
        - '``mise run docs:examples`` now analyses both READMEs, not only ``docs/``.
          The collection README is what Galaxy publishes, so it holds the first playbook
          a user copies, and nothing checked it: a renamed module would have stayed
          there until somebody tried. Adding it surfaced that a README publishes **tasks**,
          not plays; those are wrapped in a minimal play before the syntax check rather
          than refused, since refusing them would leave the most-copied examples uncontrolled.
          Two mutations prove both halves.'
        - '``mise run introductions`` checks that the appearance journal still tells
          the truth about what is published: it refuses a version in preparation that
          is not later than the released one, and lists every module, option and return
          value that no dated block covers yet.'
        - '``mise run security`` and ``mise run security:trust`` now refuse to run
          when a workflow scanner installed locally is not the version CI installs.
          The gate that exists to replay CI had reported **12/12 green** on a tree
          CI then refused: zizmor was 1.28.0 locally against 1.30.0 in CI, and the
          audit that reddened the pull request was introduced in 1.30.0. A gate judging
          with a different tool than the one it claims to replay produces a green
          worth nothing. The versions are read from the workflows that install them,
          which keeps a single declaration.'
        - '``plumber`` moves from 0.4.51 to 0.4.55. The pin had three different values
          at once: the workflow said 0.4.51, the maintainer''s toolchain 0.4.52, and
          upstream published 0.4.55. Verdict on this repository is unchanged, grade
          A with no finding at any severity.'
        - '``python scripts/example.py reel --enregistrer <file>`` puts ``feint proxy``
          between the collection and the cloud and writes every exchange. An assertion
          returns a boolean; when it fails it says what it expected, never what the
          API answered, and a play that dies on one carries away everything after
          it. Two billed runs returned nothing about the question asked before the
          third recorded the answer even though the measurement task was skipped again.
          See ADR-015.'
        - '``scripts/example.py`` now takes a lock while a platform is up. It refuses
          a second run, and before destroying it compares the tree with the one that
          deployed, naming the commit to recover when the two diverge. A real run
          had left billed resources alive: the ``finally`` was reached and did launch
          the destroy, but ``examples/stack/`` is versioned, lock file included, and
          a branch switch during the run replaced the definition **under** the deployment.
          Terraform then refused to load a provider its own definition no longer named.
          A ``finally`` only protects if the command it launches can still run, and
          that limit was written nowhere. Three mutations prove the refusals bite,
          and the tests build a lock rather than touching any cloud.'
