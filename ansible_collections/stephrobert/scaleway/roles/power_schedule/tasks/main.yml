---
# Bring a named inventory group of Instances to a power state, and nothing else.
#
# **This is the playbook that pays for itself twice a day.** Machines running at
# night that nobody uses are the most ordinary waste there is, and the collection
# already had every piece: the inventory groups by tag, the action module powers
# on and off. Nothing joined them, so everyone wrote the loop again.
#
# **The action module is not idempotent, and it is not supposed to be.** An
# action is a trigger, not a state: running it twice reports `changed` twice. So
# idempotence lives here, in the role: the current state is read first, and only
# the machines that are not already where they should be are acted on. A second
# run reports nothing changed because nothing needed to change, not because a
# module pretended.
#
# **Three refusals, before anything is sent.**
#
#   no group named        no default means "the whole fleet". A schedule that
#                         guesses its target powers off production one evening
#   an empty selection    finding nothing does not authorise acting on
#                         everything, and the role says what it searched
#   a machine in flight   `starting`, `stopping` and `locked` are not states to
#                         act from. They are named, not silently swept up
#
# **Why every fact here is prefixed.** This role is meant to be included from
# somebody else's playbook. A `set_fact: selection` would land in their host
# facts and collide with whatever they call `selection`, which is a defect that
# only exists once the code is a role, and which nothing would report.

# **Rien demandé n'est pas une erreur.** Sans groupe, le rôle ne fait rien et le
# dit : c'est la convention de `stop_server.yml`, et c'est ce qui permet à
# `mise run integration` de le jouer sans argument. Un exemple qui choisirait à
# votre place quelles machines éteindre est un piège, pas une documentation.
- name: With no group named, do nothing and say so
  ansible.builtin.debug:
    msg: >-
      No group named. Run again with
      `-i <name>.scaleway.yml -e group=<inventory group> -e desired_state=on|off`
      to act. The playbook stops here without touching anything.
  when:
    - scaleway_power_schedule_group | length == 0
    - scaleway_power_schedule_selector | length == 0

- name: Bring the named group where it should be
  when: scaleway_power_schedule_group | length > 0 or scaleway_power_schedule_selector | length > 0
  block:
    # ---- What the role refuses to guess ----------------------------------

    - name: A desired state comes with the group
      ansible.builtin.assert:
        that:
          - scaleway_power_schedule_desired_state in ['on', 'off']
        fail_msg: >-
          group `{{ scaleway_power_schedule_group }}` was named without
          `-e desired_state=on|off`. A schedule that guesses which way to move
          a fleet is how a production fleet goes down one evening.
        quiet: true

    # Pris avant la première lecture : une durée qui démarrerait après les
    # appels mesurerait le compte rendu, pas l'opération.
    - name: When this operation started
      ansible.builtin.set_fact:
        _scaleway_power_schedule_debut: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

    # Un raccourci et une forme longue disent la même chose ; les deux à la
    # fois laisseraient la réponse dépendre de l'ordre de lecture.
    - name: A group name and a selector are two ways of saying one thing
      ansible.builtin.assert:
        that:
          - not (scaleway_power_schedule_group | length > 0
                 and scaleway_power_schedule_selector | length > 0)
        fail_msg: >-
          `group` et `selector` ont été donnés tous les deux. `group: X` est le
          raccourci de `selector: {group: X}`.
        quiet: true

    - name: What the selector designates
      ansible.builtin.set_fact:
        _scaleway_power_schedule_selecteur: >-
          {{ scaleway_power_schedule_selector if scaleway_power_schedule_selector | length > 0
             else {'group': scaleway_power_schedule_group} }}

    - name: The machines it holds, read from the inventory
      ansible.builtin.set_fact:
        _scaleway_power_schedule_selection: >-
          {{ _scaleway_power_schedule_selecteur
             | stephrobert.scaleway.select_hosts(groups=groups, hostvars=hostvars) }}

    # **Un groupe nommé et vide est une erreur, pas un silence.** À 20:00, un
    # planificateur qui ne trouve rien et sort en 0 est un planificateur qui
    # échoue sans que personne ne le sache.
    - name: The selection is not empty
      ansible.builtin.assert:
        that:
          - _scaleway_power_schedule_selection | length > 0
        fail_msg: >-
          the selector `{{ _scaleway_power_schedule_selecteur | to_json }}` holds no host.
          {{ ('No inventory was parsed: run with `-i <name>.scaleway.yml`.
               That missing option is the likeliest cause.')
             if groupes_construits | length == 0
             else ('Groups the inventory built: '
                   ~ (groupes_construits | join(', ')) ~ '.') }}
          Finding nothing does not authorise acting on everything.
        quiet: true
      vars:
        groupes_construits: >-
          {{ groups.keys() | reject('equalto', 'all')
             | reject('equalto', 'ungrouped') | list | sort }}

    # ---- What the machines are, read rather than remembered --------------

    # The inventory can be served from its cache, and a cached state is not a
    # state: a decision to power a machine off is worth one read.
    - name: Read each selected machine, now
      stephrobert.scaleway.instance_server_info:
        zone: "{{ hostvars[item].scaleway_zone }}"
        server_id: "{{ hostvars[item].scaleway_id }}"
      loop: "{{ _scaleway_power_schedule_selection }}"
      register: lecture
      failed_when: false

    - name: Sort the machines by what is to be done with them
      ansible.builtin.set_fact:
        # `server is defined` rather than `failed`: `failed_when: false`
        # rewrites that field, measured, so a machine that could not be read
        # would pass for one that answered.
        _scaleway_power_schedule_lues: >-
          {{ lecture.results | selectattr('server', 'defined') | list }}
        _scaleway_power_schedule_illisibles: >-
          {{ lecture.results | rejectattr('server', 'defined')
             | map(attribute='item') | list | sort }}

    - name: Separate what is already there, what moves, and what cannot
      ansible.builtin.set_fact:
        _scaleway_power_schedule_deja: >-
          {{ lues | selectattr('server.state', 'equalto', etat_vise)
             | map(attribute='server.name') | list | sort }}
        _scaleway_power_schedule_a_agir: >-
          {{ lues | selectattr('server.state', 'in', etats_de_depart) | list }}
        _scaleway_power_schedule_en_vol: >-
          {{ lues | rejectattr('server.state', 'equalto', etat_vise)
             | rejectattr('server.state', 'in', etats_de_depart)
             | map(attribute='server') | list }}
      vars:
        lues: "{{ _scaleway_power_schedule_lues }}"
        etat_vise: >-
          {{ 'running' if scaleway_power_schedule_desired_state == 'on'
             else 'stopped' }}
        # `stopped in place` keeps the hypervisor slot; both count as off, and
        # both are a legitimate starting point for a power-on.
        etats_de_depart: >-
          {{ ['stopped', 'stopped in place']
             if scaleway_power_schedule_desired_state == 'on' else ['running'] }}

    # ---- What is about to happen, said before it happens -----------------

    - name: What this run would change
      ansible.builtin.debug:
        msg: >-
          {{ scaleway_power_schedule_group }} ->
          {{ scaleway_power_schedule_desired_state }} :
          {{ a_agir | length }} to act on
          ({{ a_agir | map(attribute='server.name') | list | sort
              | join(', ') or 'none' }}),
          {{ deja | length }} already there
          {{ ('· in flight or locked, left alone: '
              ~ (en_vol | map(attribute='name') | list | sort | join(', ')))
             if en_vol else '' }}
          {{ ('· unreadable: ' ~ (illisibles | join(', '))) if illisibles else '' }}
      vars:
        a_agir: "{{ _scaleway_power_schedule_a_agir }}"
        deja: "{{ _scaleway_power_schedule_deja }}"
        en_vol: "{{ _scaleway_power_schedule_en_vol }}"
        illisibles: "{{ _scaleway_power_schedule_illisibles }}"

    # ---- The only thing that writes --------------------------------------

    # `check_mode` is honoured by the action module, which reads the resource
    # before announcing a change rather than announcing one blind (#168).
    - name: Bring each machine that is not already there
      stephrobert.scaleway.instance_server_action:
        zone: "{{ item.server.zone }}"
        server_id: "{{ item.server.id }}"
        action: >-
          {{ 'poweron' if scaleway_power_schedule_desired_state == 'on'
             else 'poweroff' }}
      loop: "{{ _scaleway_power_schedule_a_agir }}"
      loop_control:
        label: "{{ item.server.name }}"
      register: agi

    # ---- What happened ---------------------------------------------------

    # **A rehearsal that reports like a run is worse than no rehearsal.** In
    # check mode the action module announces the change without sending it, so
    # `changed` here counts what *would* move. Reporting that as `acted on` told
    # the operator their machines were off while they were still running, and
    # the fleet report said otherwise a minute later.
    - name: The result
      ansible.builtin.debug:
        msg: >-
          {{ agi.results | default([]) | selectattr('changed') | list | length }}
          {{ 'would be acted on (check mode: nothing was sent)'
             if ansible_check_mode else 'acted on' }},
          {{ deja | length }} already {{ scaleway_power_schedule_desired_state }},
          {{ en_vol | length }} left alone,
          {{ illisibles | length }} unreadable.
      vars:
        deja: "{{ _scaleway_power_schedule_deja }}"
        en_vol: "{{ _scaleway_power_schedule_en_vol }}"
        illisibles: "{{ _scaleway_power_schedule_illisibles }}"

    # ---- What a machine reads --------------------------------------------

    # **La phrase est pour un opérateur, la structure est pour une chaîne.**
    # Les deux sortent des mêmes listes, donc elles ne peuvent pas se
    # contredire, et personne n'a plus à analyser une sortie standard pour
    # savoir ce qui s'est passé.
    - name: What happened, in a shape a machine reads
      ansible.builtin.set_fact:
        scaleway_power_schedule_operation: "{{ resultat }}"
        # La dernière opération du play, pour le cas courant : une chaîne qui
        # veut le résultat de ce qu'elle vient de lancer. Même objet, pas un
        # second calcul.
        scaleway_operation: "{{ resultat }}"
      vars:
        resultat: >-
          {{ 'power_schedule' | stephrobert.scaleway.operation_result(
               target=(_scaleway_power_schedule_selecteur | to_json),
               mode=('check' if ansible_check_mode else 'apply'),
               changed=(agi.results | default([]) | selectattr('changed')
                        | map(attribute='item.server.name') | list),
               already_compliant=_scaleway_power_schedule_deja,
               refused=_scaleway_power_schedule_en_vol,
               refused_reason='state',
               unmeasured=_scaleway_power_schedule_illisibles,
               started_at=_scaleway_power_schedule_debut,
               completed_at=now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')) }}

    # A machine that could not be read is not a machine that is fine. The run
    # stops on it, after having done what it could for the others: hiding it
    # would let the next schedule act on a fleet it does not know.
    - name: Every selected machine was readable
      ansible.builtin.assert:
        that:
          - _scaleway_power_schedule_illisibles | length == 0
        fail_msg: >-
          {{ _scaleway_power_schedule_illisibles | length }} machine(s) could
          not be read: {{ _scaleway_power_schedule_illisibles | join(', ') }}.
          Their power state is unknown, so this run does not claim the group is
          where it should be.
        quiet: true
