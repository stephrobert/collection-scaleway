---
# The whole fleet in one read-only command, with three outputs for three readers.
#
# **It creates nothing and changes nothing**, which is what makes it safe to run
# first on an account nobody has described to you.
#
# **A zone that did not answer is named, never counted as zero.** Rien n'a été
# mesuré n'est pas rien n'a été trouvé, and a report that counted an unreachable
# zone as empty would be worse than no report, because it would be a plausible
# one.
#
# **What this role leaves behind.** `scaleway_fleet_report_result` holds the
# report, so a calling playbook can act on it instead of reading it off the
# screen. Everything else it sets is prefixed with an underscore and is internal:
# a role included in somebody else's play shares their namespace, and a bare
# `set_fact: machines` would overwrite whatever they call `machines`.

# **Le format est validé par le contrat d'arguments, pas par une tâche ici.**
# `choices` fait refuser Ansible avant la première tâche, en nommant les valeurs
# acceptées, le rôle et l'option. Un `assert` en tête de rôle serait alors du
# code mort, et du code mort dans une garde est pire que pas de garde : il
# rassure.
#
# `power_schedule` fait l'inverse, et pour une raison mesurée : chez lui la
# chaîne vide est une valeur légitime, celle qui veut dire « ne rien faire ».
# `choices` la refuserait.
# Pris avant la première lecture : une durée qui démarrerait après les appels
# mesurerait le compte rendu, pas l'opération.
- name: When this operation started
  ansible.builtin.set_fact:
    _scaleway_fleet_report_debut: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

- name: The zones to ask, cleaned of whatever the command line carried
  ansible.builtin.set_fact:
    # Une chaîne séparée par des virgules ou une liste : le playbook livré passe
    # ce que la ligne de commande porte, un appelant passe une liste. Les deux
    # arrivent ici, et une seule forme en sort.
    _scaleway_fleet_report_zones: >-
      {{ (scaleway_fleet_report_zones
          if scaleway_fleet_report_zones is sequence
             and scaleway_fleet_report_zones is not string
          else scaleway_fleet_report_zones | split(','))
         | map('trim') | select | list | sort }}

# **Chaque produit ne sert pas les mêmes zones.** Demander au Load Balancer une
# zone que son contrat ne déclare pas faisait ressortir cette zone comme « non
# mesurée », à chaque exécution propre. `zones_unmeasured` porte l'affirmation
# la plus répétée de ce dépôt, et un signal qui crie au loup est un signal que
# personne ne lit (#222).
- name: What each product offers among the zones asked
  ansible.builtin.set_fact:
    _scaleway_fleet_report_instance: >-
      {{ _scaleway_fleet_report_zones
         | stephrobert.scaleway.product_zones(kind='instance') }}
    _scaleway_fleet_report_lb: >-
      {{ _scaleway_fleet_report_zones
         | stephrobert.scaleway.product_zones(kind='lb') }}

# ---- What each zone answers ---------------------------------------------

# `failed_when: false` so one unreachable zone does not hide the others.
# **It also rewrites `failed` to `false`**, measured, so the presence of the
# payload is what says whether the zone answered, not that field.
- name: Ask each zone for its Instances
  stephrobert.scaleway.instance_server_info:
    zone: "{{ item }}"
  loop: "{{ _scaleway_fleet_report_instance.offered }}"
  register: sonde_instances
  failed_when: false

- name: Ask each zone for its Load Balancers
  stephrobert.scaleway.lb_load_balancer_info:
    zone: "{{ item }}"
  loop: "{{ _scaleway_fleet_report_lb.offered }}"
  register: sonde_lb
  failed_when: false

# ---- Measured, and not measured -----------------------------------------

- name: Separate the zones that answered from the zones that did not
  ansible.builtin.set_fact:
    _scaleway_fleet_report_machines: >-
      {{ sonde_instances.results | selectattr('servers', 'defined')
         | map(attribute='servers') | flatten | list }}
    _scaleway_fleet_report_balanceurs: >-
      {{ sonde_lb.results | selectattr('lbs', 'defined')
         | map(attribute='lbs') | flatten | list }}
    # Les parenthèses portent le dédoublonnage : sans elles, `a + b | unique`
    # ne dédoublonne que `b`, et une zone muette des deux côtés apparaît deux
    # fois. Mesuré au premier essai.
    _scaleway_fleet_report_muettes: >-
      {{ ((sonde_instances.results | rejectattr('servers', 'defined')
           | map(attribute='item') | list)
        + (sonde_lb.results | rejectattr('lbs', 'defined')
           | map(attribute='item') | list)) | unique | sort }}
    _scaleway_fleet_report_mesurees: >-
      {{ sonde_instances.results | selectattr('servers', 'defined')
         | map(attribute='item') | list | sort }}

# ---- The counts ---------------------------------------------------------

# Sorted everywhere, because the same fleet must produce the same bytes twice:
# two runs that cannot be compared make the JSON a decoration.
#
# `groupby` gives `[[key, [items]]]`, so the count is the length of the second
# element. Measured rather than assumed, like everything else here.
- name: Count what the measured zones hold
  ansible.builtin.set_fact:
    scaleway_fleet_report_result:
      zones_asked: "{{ _scaleway_fleet_report_zones }}"
      zones_measured: "{{ mesurees }}"
      zones_unmeasured: "{{ _scaleway_fleet_report_muettes }}"
      # Distinct de `zones_unmeasured`, et c'est tout l'objet du champ : une
      # zone qu'un produit n'offre pas est un fait sur le produit, pas une
      # mesure qui a manqué.
      zones_not_offered: "{{ non_offertes }}"
      # **`null` et non `0` quand aucune zone n'a répondu.** Un total nul se lit
      # « le parc est vide », et rien n'a été mesuré n'est pas rien n'a été
      # trouvé. Le dépôt rend déjà `None` plutôt que `0.0 %` pour un ratio sans
      # dénominateur, et c'est la même règle.
      instances_total: "{{ none if not mesurees else machines | length }}"
      instances_by_state: "{{ dict(machines | groupby('state')
        | map('first') | zip(machines | groupby('state')
        | map('last') | map('length'))) }}"
      instances_by_zone: "{{ dict(machines | groupby('zone')
        | map('first') | zip(machines | groupby('zone')
        | map('last') | map('length'))) }}"
      instances_by_tag: "{{ etiquettes }}"
      load_balancers_total: "{{ none if not mesurees else balanceurs | length }}"
      load_balancers_by_status: "{{ dict(balanceurs | groupby('status')
        | map('first') | zip(balanceurs | groupby('status')
        | map('last') | map('length'))) }}"
  vars:
    machines: "{{ _scaleway_fleet_report_machines }}"
    balanceurs: "{{ _scaleway_fleet_report_balanceurs }}"
    mesurees: "{{ _scaleway_fleet_report_mesurees }}"
    non_offertes: >-
      {{ {'instance': _scaleway_fleet_report_instance.not_offered,
          'lb': _scaleway_fleet_report_lb.not_offered}
         | dict2items | rejectattr('value', 'equalto', []) | items2dict }}
    # Les étiquettes sont une liste plate de chaînes, pas des objets : il n'y a
    # pas d'attribut sur lequel `groupby` puisse travailler. Un dictionnaire se
    # construit donc à la main, et `untagged` compte les machines qu'aucune
    # étiquette ne décrit, qui sont celles qu'on cherche.
    plates: "{{ _scaleway_fleet_report_machines | map(attribute='tags') | flatten | list }}"
    etiquettes: >-
      {%- set compte = {} -%}
      {%- for etiquette in plates | unique | sort -%}
      {%- set _ = compte.update(
          {etiquette: plates | select('equalto', etiquette) | list | length}) -%}
      {%- endfor -%}
      {%- set _ = compte.update(
          {'untagged': _scaleway_fleet_report_machines | rejectattr('tags') | list | length}) -%}
      {{ compte }}

# ---- Ce qu'une prochaine lecture pourra comparer -------------------------

# **L'instantané coûte zéro appel**, parce que les charges utiles sont déjà là.
# Un rôle séparé rejouerait les mêmes lectures, et deux implémentations d'une
# même lecture divergent : le dépôt refuse déjà qu'un playbook réimplémente son
# rôle pour ce motif.
#
# **La collection ne stocke rien.** Elle rend l'instantané, et l'appelant le
# range où il veut : artefact de CI, stockage d'objets, dépôt git. C'est la
# limite, pas une étape vers autre chose (#231).
- name: What a later read will be able to compare against
  ansible.builtin.set_fact:
    scaleway_fleet_report_snapshot: >-
      {{ (machines + balanceurs)
         | stephrobert.scaleway.fleet_snapshot(
             zones_measured=_scaleway_fleet_report_mesurees,
             zones_unmeasured=_scaleway_fleet_report_muettes,
             captured_at=_scaleway_fleet_report_debut,
             collection_version=version) }}
  vars:
    machines: >-
      {{ _scaleway_fleet_report_machines
         | stephrobert.scaleway.resource_facts(kind='instance') }}
    balanceurs: >-
      {{ _scaleway_fleet_report_balanceurs
         | stephrobert.scaleway.resource_facts(kind='lb') }}
    # La version se lit là où elle se trouve vraiment, et ce n'est pas le même
    # fichier selon le contexte : une collection installée porte `MANIFEST.json`
    # et **pas** `galaxy.yml`, le dépôt l'inverse. Le filtre cherche les deux,
    # plutôt que ce Jinja recopie un chemin qui ne vaut que dans un des deux cas.
    version: "{{ undef | stephrobert.scaleway.collection_version }}"

# **Le fichier est écrit par l'appelant, pas par le rôle.** Un rôle qui écrit
# dans le système de fichiers de qui l'inclut décide à sa place, et un chemin par
# défaut finirait par écraser quelque chose. Le rôle rend la structure ; celui
# qui la veut sur disque la pose lui-même.
- name: The snapshot, for whoever keeps it
  ansible.builtin.debug:
    msg: "{{ scaleway_fleet_report_snapshot | to_nice_json }}"
  when: scaleway_fleet_report_output == 'snapshot'

# **Une lecture rend la même structure qu'une écriture**, et c'est ce qui fait
# de cette forme une grammaire plutôt qu'un format de plus. `changed` y est
# toujours vide, et ce sont les zones muettes qui remplissent `unmeasured` : la
# structure porte alors exactement ce que la prose du rapport dit déjà.
- name: What happened, in a shape a machine reads
  ansible.builtin.set_fact:
    scaleway_fleet_report_operation: "{{ resultat }}"
    scaleway_operation: "{{ resultat }}"
  vars:
    resultat: >-
      {{ 'fleet_report' | stephrobert.scaleway.operation_result(
           target=(_scaleway_fleet_report_zones | join(',')),
           mode='apply',
           already_compliant=_scaleway_fleet_report_mesurees,
           unmeasured=_scaleway_fleet_report_muettes,
           started_at=_scaleway_fleet_report_debut,
           completed_at=now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')) }}

- name: Nothing was measured, and that is not an empty fleet
  ansible.builtin.debug:
    msg: >-
      No zone answered:
      {{ scaleway_fleet_report_result.zones_unmeasured | join(', ') }}.
      Nothing was measured, which is not the same as nothing being there.
      `ansible-playbook stephrobert.scaleway.doctor` says why.
  when: _scaleway_fleet_report_mesurees | length == 0

- name: The report, for a terminal
  ansible.builtin.debug:
    msg: "{{ scaleway_fleet_report_result }}"
  when:
    - scaleway_fleet_report_output == 'text'
    - _scaleway_fleet_report_mesurees | length > 0

- name: The report, for a pipeline
  ansible.builtin.debug:
    msg: "{{ scaleway_fleet_report_result | to_nice_json }}"
  when:
    - scaleway_fleet_report_output == 'json'
    - _scaleway_fleet_report_mesurees | length > 0

# Une boucle plutôt qu'un enchaînement de filtres : la première version
# composait les lignes par `regex_replace` avec une référence arrière, et rendait
# « | tag \1 | ». Un rendu se vérifie en le lisant.
- name: The report, for a ticket
  ansible.builtin.debug:
    msg: |-
      | what | count |
      |---|---|
      | instances | {{ rapport.instances_total }} |
      {% for etat, compte in rapport.instances_by_state.items() -%}
      | state {{ etat }} | {{ compte }} |
      {% endfor -%}
      {% for zone, compte in rapport.instances_by_zone.items() -%}
      | zone {{ zone }} | {{ compte }} |
      {% endfor -%}
      {% for etiquette, compte in rapport.instances_by_tag.items() -%}
      | tag {{ etiquette }} | {{ compte }} |
      {% endfor -%}
      | load balancers | {{ rapport.load_balancers_total }} |
      {% for statut, compte in rapport.load_balancers_by_status.items() -%}
      | lb {{ statut }} | {{ compte }} |
      {% endfor -%}
      {% if rapport.zones_unmeasured -%}
      | **zones unmeasured** | {{ rapport.zones_unmeasured | join(", ") }} |
      {% endif -%}
  vars:
    rapport: "{{ scaleway_fleet_report_result }}"
  when:
    - scaleway_fleet_report_output == 'markdown'
    - _scaleway_fleet_report_mesurees | length > 0
