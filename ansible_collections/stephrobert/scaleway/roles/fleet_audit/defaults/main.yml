---
# The zones to read. Same catalogue as the fleet report.
scaleway_fleet_audit_zones:
  - fr-par-1
  - fr-par-2
  - fr-par-3
  - nl-ams-1
  - nl-ams-2
  - nl-ams-3
  - pl-waw-1
  - pl-waw-2
  - pl-waw-3
  - it-mil-1

scaleway_fleet_audit_output: text

# **The findings of the previous run, as you kept them.** The collection keeps
# no history: comparing two runs needs the earlier one handed back, and where it
# is kept is the caller's business, not this role's.
#
# `none` is not an empty list. No previous run at all makes this one a baseline;
# a previous run that found nothing makes everything here new.
scaleway_fleet_audit_previous: ~

# **A starting point, not an opinion about your fleet.** Every rule here is a
# `warn`, so a first run never fails: the point of an audit you can run daily is
# that you read it, and a report that fails on day one is a report people turn
# off.
#
# Replace it. The severity is data because the public address of a bastion is
# normal and that of a database is not, and this repository has no business
# deciding that for anybody.
scaleway_fleet_audit_policy:
  rules:
    required_tags:
      severity: warn
      keys:
        - owner
        - environment
    stopped_since:
      severity: warn
      days: 30
