---
# What you run every day, in read-only.
#
# `rolling_reboot` is used when you need it. An audit is launched daily, and
# that is the whole difference between a useful tool and a tool somebody
# integrates into their operations.
#
# **It creates nothing and corrects nothing.** Terraform provisions, Ansible
# operates: an audit that repaired what it found would cross that boundary, and
# the repair nobody asked for is how automation loses trust.
#
# **A zone that did not answer is never counted as conforming.** It is named as
# unmeasured in the operation result, and a report that said `PASS` over a fleet
# it could not read would be worse than no report, because it would be a
# plausible one.
- name: When this audit started
  ansible.builtin.set_fact:
    _scaleway_fleet_audit_debut: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

- name: The zones to ask, cleaned of whatever the command line carried
  ansible.builtin.set_fact:
    _scaleway_fleet_audit_zones: >-
      {{ (scaleway_fleet_audit_zones
          if scaleway_fleet_audit_zones is sequence
             and scaleway_fleet_audit_zones is not string
          else scaleway_fleet_audit_zones | split(','))
         | map('trim') | select | list | sort }}

# `failed_when: false` so one unreachable zone does not hide the others. It also
# rewrites `failed` to `false`, measured, so the presence of the payload is what
# says whether the zone answered.
- name: Ask each zone for its Instances
  stephrobert.scaleway.instance_server_info:
    zone: "{{ item }}"
  loop: "{{ _scaleway_fleet_audit_zones }}"
  register: sonde
  failed_when: false

- name: Separate what was read from what could not be
  ansible.builtin.set_fact:
    _scaleway_fleet_audit_machines: >-
      {{ sonde.results | selectattr('servers', 'defined')
         | map(attribute='servers') | flatten | list }}
    _scaleway_fleet_audit_muettes: >-
      {{ sonde.results | rejectattr('servers', 'defined')
         | map(attribute='item') | list | sort }}
    _scaleway_fleet_audit_mesurees: >-
      {{ sonde.results | selectattr('servers', 'defined')
         | map(attribute='item') | list | sort }}

# ---- The judgement -------------------------------------------------------

# **La couture entre un produit et une règle.** Les règles ne lisent que la
# forme commune, donc elles ne connaissent aucun nom de champ d'Instance. Le
# jour où Elastic Metal aura des modules, un normaliseur s'ajoute et aucune
# règle ne bouge.
- name: Normalise what the zones answered
  ansible.builtin.set_fact:
    _scaleway_fleet_audit_faits: >-
      {{ _scaleway_fleet_audit_machines
         | stephrobert.scaleway.resource_facts(kind='instance') }}

- name: Judge what the measured zones hold
  ansible.builtin.set_fact:
    scaleway_fleet_audit_findings: >-
      {{ _scaleway_fleet_audit_faits | stephrobert.scaleway.audit_findings(
           policy=scaleway_fleet_audit_policy,
           now=now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')) }}

# **Une exception change un statut, elle n'efface pas un constat.** Il reste
# lisible, compté à part, avec ce qui le couvre : un constat effacé est un
# problème dont plus personne ne sait qu'il existe (#235).
#
# Et une échéance dépassée est un constat, pas un refus : refuser toute la
# politique parce qu'une ligne a expiré éteindrait l'audit entier, ce qui est le
# contraire de ce qu'on veut le jour où une exception se périme.
- name: Apply what the policy excuses, and say what it excuses
  ansible.builtin.set_fact:
    _scaleway_fleet_audit_juge: >-
      {{ scaleway_fleet_audit_findings | stephrobert.scaleway.audit_exceptions(
           exceptions=scaleway_fleet_audit_policy.exceptions | default([]),
           resources=_scaleway_fleet_audit_faits,
           now=now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')) }}

- name: What the exceptions left
  ansible.builtin.set_fact:
    scaleway_fleet_audit_findings: "{{ _scaleway_fleet_audit_juge.findings }}"
    scaleway_fleet_audit_suppressed: "{{ _scaleway_fleet_audit_juge.suppressed }}"
    scaleway_fleet_audit_expired_exceptions: >-
      {{ _scaleway_fleet_audit_juge.expired_exceptions }}
    scaleway_fleet_audit_exceptions_without_target: >-
      {{ _scaleway_fleet_audit_juge.exceptions_without_target }}

# **Un rapport qui affiche les mêmes avertissements chaque matin cesse d'être lu
# au troisième matin.** C'est le mode de défaillance d'un outil récurrent, et il
# est plus dangereux qu'une panne : il ne se voit pas.
#
# La comparaison a besoin du run précédent, et la collection ne tient pas
# d'historique : il est rendu par l'appelant, qui décide où il le garde (#234).
- name: What is new, what persists, what is resolved
  ansible.builtin.set_fact:
    scaleway_fleet_audit_changes: >-
      {{ scaleway_fleet_audit_findings | stephrobert.scaleway.audit_changes(
           previous=scaleway_fleet_audit_previous,
           zones_measured=_scaleway_fleet_audit_mesurees,
           now=now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')) }}

- name: What those changes demand, computed and never passed in
  ansible.builtin.set_fact:
    scaleway_fleet_audit_level: >-
      {{ scaleway_fleet_audit_changes | stephrobert.scaleway.changes_verdict }}

- name: Sort the findings by what they demand
  ansible.builtin.set_fact:
    # **Ce qui est couvert ne demande rien**, et c'est tout l'objet du statut :
    # il reste dans la liste, il ne compte pas dans ce qui appelle une action.
    # Une exception périmée, elle, compte comme un `fail` : c'est le seul moyen
    # qu'elle se voie le jour où elle expire.
    _scaleway_fleet_audit_fail: >-
      {{ (scaleway_fleet_audit_findings
          | selectattr('status', 'equalto', 'open')
          | selectattr('severity', 'equalto', 'fail') | list)
         + scaleway_fleet_audit_expired_exceptions }}
    _scaleway_fleet_audit_warn: >-
      {{ scaleway_fleet_audit_findings
         | selectattr('status', 'equalto', 'open')
         | selectattr('severity', 'equalto', 'warn') | list }}
    # **Ce qu'un rendu montre, et le mélange est délibéré ici.** La variable de
    # sortie garde les deux listes séparées, parce qu'une exception périmée est
    # un problème de politique et non de machine ; mais un rapport qui ne
    # montrerait que la première laisserait l'échéance dépassée invisible à qui
    # lit le JSON, ce qui est le défaut que tout ce filtre existe pour éviter.
    _scaleway_fleet_audit_publies: >-
      {{ scaleway_fleet_audit_findings + scaleway_fleet_audit_expired_exceptions }}
    # Une machine sans constat est conforme **à cette politique**, ce qui n'est
    # pas la même chose que conforme. Le rapport nomme la politique pour que la
    # nuance reste lisible.
    _scaleway_fleet_audit_pass: >-
      {{ _scaleway_fleet_audit_machines | map(attribute='name') | list
         | difference(_noms_en_constat) }}
    # **Un refus par machine, jamais par constat.** Le contrat calcule
    # `examined` comme la somme de ce qui a changé, de ce qui était conforme et
    # de ce qui est refusé : passer les constats y ferait compter deux fois une
    # machine qui enfreint deux règles. Sur un parc où chaque machine n'en
    # enfreint qu'une, le total tombe juste par coïncidence, ce qui est la forme
    # même d'un faux vert.
    #
    # Seuls les constats **ouverts** y entrent : une ressource qu'une exception
    # couvre n'est pas refusée, elle est excusée, et la compter comme refusée
    # ferait échouer une chaîne sur ce que quelqu'un a explicitement accepté.
    _scaleway_fleet_audit_refus: >-
      {{ scaleway_fleet_audit_findings | selectattr('status', 'equalto', 'open')
         | list | stephrobert.scaleway.audit_refusals }}
  vars:
    _noms_en_constat: >-
      {{ scaleway_fleet_audit_findings | selectattr('status', 'equalto', 'open')
         | map(attribute='name')
         | map('regex_replace', '^instance/', '') | list }}

# ---- What a machine reads ------------------------------------------------

- name: What this audit examined, in a shape a machine reads
  ansible.builtin.set_fact:
    scaleway_fleet_audit_operation: "{{ resultat }}"
    scaleway_operation: "{{ resultat }}"
  vars:
    resultat: >-
      {{ 'fleet_audit' | stephrobert.scaleway.operation_result(
           target=(_scaleway_fleet_audit_zones | join(',')),
           mode='apply',
           already_compliant=_scaleway_fleet_audit_pass,
           refused=_scaleway_fleet_audit_refus,
           unmeasured=_scaleway_fleet_audit_muettes,
           started_at=_scaleway_fleet_audit_debut,
           completed_at=now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')) }}

# ---- What a person reads -------------------------------------------------

- name: Nothing was measured, and that is not a compliant fleet
  ansible.builtin.debug:
    msg: >-
      No zone answered: {{ _scaleway_fleet_audit_muettes | join(', ') }}.
      Nothing was audited, which is not the same as nothing being wrong.
      `ansible-playbook stephrobert.scaleway.doctor` says why.
  when: _scaleway_fleet_audit_mesurees | length == 0

# Une boucle plutôt qu'un enchaînement de filtres : la première version
# composait les lignes par `zip` et `map('join')`, et personne ne relit ça. Un
# rendu se vérifie en le lisant.
- name: The audit, for a terminal
  ansible.builtin.debug:
    msg: |-
      Fleet audit

      PASS {{ _scaleway_fleet_audit_pass | length }}
      WARN {{ _scaleway_fleet_audit_warn | length }}
      FAIL {{ _scaleway_fleet_audit_fail | length }}
      SUPPRESSED {{ scaleway_fleet_audit_suppressed }}
      {% for constat in scaleway_fleet_audit_findings %}
      {{ 'SUPPRESSED' if constat.status == 'suppressed' else constat.severity | upper }} {{ constat.name }}
           {{ constat.rule }}: {{ constat.detail }}
      {% if constat.status == 'suppressed' %}     excused by {{ constat.suppressed_by }}
      {% endif %}
      {% endfor %}
      {% for expiree in scaleway_fleet_audit_expired_exceptions %}
      FAIL {{ expiree.name }}
           {{ expiree.detail }}
      {% endfor %}
      {% for orpheline in scaleway_fleet_audit_exceptions_without_target %}
      note exception on {{ orpheline.rule }} ({{ orpheline.owner }}) {{ orpheline.detail }}
      {% endfor %}
      {% if _scaleway_fleet_audit_muettes %}
      unmeasured zones: {{ _scaleway_fleet_audit_muettes | join(', ') }}
      {% endif %}
  when:
    - scaleway_fleet_audit_output == 'text'
    - _scaleway_fleet_audit_mesurees | length > 0

# **Ce bloc n'apparaît que s'il y a quelque chose à comparer.** Sur un premier
# run il n'y a pas de « nouveau » : il n'y a qu'une référence, et l'annoncer
# autrement noierait la première lecture sous ce qu'elle sert à établir.
- name: What moved since the run you kept
  ansible.builtin.debug:
    msg: |-
      Fleet posture changes

      {% for constat in scaleway_fleet_audit_changes.new %}
      {% if loop.first %}NEW{% endif %}
        {{ constat.severity | upper }} {{ constat.name }}  {{ constat.rule }}
      {% endfor %}
      {% for constat in scaleway_fleet_audit_changes.persisting %}
      {% if loop.first %}PERSISTING{% endif %}
        {{ constat.severity | upper }} {{ constat.name }}  {{ constat.rule }}
             {{ 'first seen ' ~ constat.first_seen if constat.first_seen is defined
                else 'first seen unknown, no kept report says when' }}
      {% endfor %}
      {% for constat in scaleway_fleet_audit_changes.resolved %}
      {% if loop.first %}RESOLVED{% endif %}
        {{ constat.name }}  {{ constat.rule }}
      {% endfor %}
      {# **Jamais dans RESOLVED.** Dire à quelqu'un que son problème est réglé
         alors que personne n'a regardé est la pire ligne d'un tel rapport. #}
      {% for constat in scaleway_fleet_audit_changes.unmeasured %}
      {% if loop.first %}NOT CONCLUDED{% endif %}
        {{ constat.name }}  {{ constat.rule }}: {{ constat.reason }}
      {% endfor %}
      level: {{ scaleway_fleet_audit_level }}
  when:
    - scaleway_fleet_audit_output == 'text'
    - _scaleway_fleet_audit_mesurees | length > 0
    - not scaleway_fleet_audit_changes.baseline

- name: The audit, for a pipeline
  ansible.builtin.debug:
    msg: "{{ _scaleway_fleet_audit_publies | to_nice_json }}"
  when:
    - scaleway_fleet_audit_output == 'json'
    - _scaleway_fleet_audit_mesurees | length > 0

- name: The audit, for a ticket
  ansible.builtin.debug:
    msg: |-
      | status | severity | resource | rule | detail |
      |---|---|---|---|---|
      {% for constat in _scaleway_fleet_audit_publies -%}
      | {{ constat.status }} | {{ constat.severity }} | {{ constat.name }} | {{ constat.rule }} | {{ constat.detail }} |
      {% endfor -%}
      {% for orpheline in scaleway_fleet_audit_exceptions_without_target -%}
      | note | | exception/{{ orpheline.rule }} | {{ orpheline.owner }}: {{ orpheline.detail }} |
      {% endfor -%}
      {% if _scaleway_fleet_audit_muettes -%}
      | **zones unmeasured** | {{ _scaleway_fleet_audit_muettes | join(", ") }} | | |
      {% endif -%}
  when:
    - scaleway_fleet_audit_output == 'markdown'
    - _scaleway_fleet_audit_mesurees | length > 0

# ---- The verdict ---------------------------------------------------------

# **Une planification qui n'échoue jamais visiblement est une planification que
# personne ne regarde.** Un `fail` fait sortir le run en échec ; un `warn` non,
# parce que sinon les deux sévérités n'en feraient qu'une.
- name: No rule of severity fail is broken
  ansible.builtin.assert:
    that:
      - _scaleway_fleet_audit_fail | length == 0
    fail_msg: >-
      {{ _scaleway_fleet_audit_fail | length }} finding(s) of severity fail:
      {{ _scaleway_fleet_audit_fail | map(attribute='name') | list | join(', ') }}.
    quiet: true
