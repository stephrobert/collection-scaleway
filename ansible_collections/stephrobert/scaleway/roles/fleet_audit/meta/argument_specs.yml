---
argument_specs:
  main:
    short_description: Judge a Scaleway fleet against a policy
    description:
      - >-
        Read-only. It creates nothing, changes nothing and reboots nothing: an
        audit that corrected things would cross the boundary this collection
        exists to hold, where Terraform provisions and Ansible operates.
      - >-
        Every rule names the field it reads, and a rule the evaluation cannot
        settle is refused rather than reported as compliant. A zone that did not
        answer is named as unmeasured, never counted as conforming.
      - >-
        The run fails when a rule of severity C(fail) is broken, so a schedule
        that never fails visibly is not what you end up with.
    options:
      scaleway_fleet_audit_zones:
        type: list
        elements: str
        description:
          - The zones to read. Defaults to what the contract declares.
      scaleway_fleet_audit_output:
        type: str
        default: text
        choices: [text, json, markdown, none]
        description:
          - Which rendering to print. The findings are returned whatever this says.
          - >-
            C(none) prints nothing. It is for a caller that includes this role
            for its data, and for which a second report on screen is noise.
      scaleway_fleet_audit_previous:
        type: list
        elements: dict
        description:
          - >-
            The findings of the previous run, as you kept them. This collection
            keeps no history, so comparing two runs needs the earlier one handed
            back; where it is kept is yours to decide.
          - >-
            Leaving it unset is not the same as passing an empty list. No
            previous run at all makes this one a baseline; a previous run that
            found nothing makes everything here new.
      scaleway_fleet_audit_policy:
        type: dict
        description:
          - >-
            The rules and their severities. The shipped default is a starting
            point made only of warnings, so a first run never fails; replacing
            it is the point.
          - >-
            Its optional C(exceptions) key carries the exceptions. Each one
            needs a C(rule), a C(reason), an C(owner), an C(expires_at) and a
            C(selector) naming exactly one of C(id), C(name) or C(tags). An
            exception marks a finding suppressed; it never removes it.
