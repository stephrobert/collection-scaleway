---
# The whole fleet in one read-only command.
#
#   ansible-playbook stephrobert.scaleway.fleet_report
#   ansible-playbook stephrobert.scaleway.fleet_report -e output=json
#   ansible-playbook stephrobert.scaleway.fleet_report -e output=markdown -e zones=fr-par-1
#
# **This playbook is the ergonomics, the role is the operation.** What it does
# lives in `roles/fleet_report`, and the role leaves its report in
# `scaleway_fleet_report_result` so a calling playbook can act on it:
#
#   - ansible.builtin.include_role:
#       name: stephrobert.scaleway.fleet_report
#     vars:
#       scaleway_fleet_report_zones: [fr-par-1, fr-par-2]
#   - ansible.builtin.assert:
#       that: scaleway_fleet_report_result.zones_unmeasured | length == 0
#
# Nothing is reimplemented here, and a test refuses it.
- name: Report on a Scaleway fleet, without touching it
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # The command line carries a comma-separated string; the role accepts both
    # that and a list. Keeping the string form is what keeps `-e zones=a,b`
    # working, and what a user types is published surface.
    zones: >-
      fr-par-1,fr-par-2,fr-par-3,nl-ams-1,nl-ams-2,nl-ams-3,
      pl-waw-1,pl-waw-2,pl-waw-3,it-mil-1
    output: text

  roles:
    - role: stephrobert.scaleway.fleet_report
      scaleway_fleet_report_zones: "{{ zones }}"
      scaleway_fleet_report_output: "{{ output }}"
