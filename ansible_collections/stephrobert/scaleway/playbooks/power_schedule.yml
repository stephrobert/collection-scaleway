---
# Bring a named group of Instances to a power state, and nothing else.
#
#   ansible-playbook stephrobert.scaleway.power_schedule \
#     -i production.scaleway.yml -e group=scw_tag_office_hours -e desired_state=off
#
#   08:00  -e desired_state=on
#   20:00  -e desired_state=off
#
# **This playbook is the ergonomics, the role is the operation.** What it does
# lives in `roles/power_schedule`, so anybody can call the same logic from their
# own playbook without copying it:
#
#   - ansible.builtin.include_role:
#       name: stephrobert.scaleway.power_schedule
#     vars:
#       scaleway_power_schedule_group: scw_tag_office_hours
#       scaleway_power_schedule_desired_state: "off"
#
# Nothing is reimplemented here, and a test refuses it: two implementations of
# one operation always diverge, and the day they do, nobody can tell which of
# the documentation and the code is right.
#
# The short option names are kept on purpose. What a user types is published
# surface, and renaming it would be a breaking change for a convenience.
- name: Bring a named group of Instances to a power state
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    group: ""
    desired_state: ""

  roles:
    - role: stephrobert.scaleway.power_schedule
      scaleway_power_schedule_group: "{{ group }}"
      scaleway_power_schedule_desired_state: "{{ desired_state }}"
