---
# Reboot a named group in batches, and stop if one does not come back.
#
#   ansible-playbook stephrobert.scaleway.rolling_reboot \
#     -i production.scaleway.yml -e group=scw_tag_production -e batch_size=1
#
# **This playbook is the ergonomics, the role is the operation.** What it does
# lives in `roles/rolling_reboot`, so anybody can call the same logic from their
# own playbook without copying it:
#
#   - ansible.builtin.include_role:
#       name: stephrobert.scaleway.rolling_reboot
#     vars:
#       scaleway_rolling_reboot_group: scw_tag_production
#       scaleway_rolling_reboot_batch_size: 2
#
# Nothing is reimplemented here, and a test refuses it: two implementations of
# one operation always diverge.
#
# The short option names are kept on purpose. What a user types is published
# surface, and renaming it would be a breaking change for a convenience.
- name: Reboot a named group in batches, and stop if one does not come back
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    group: ""
    batch_size: 1
    wait_timeout: 300

  roles:
    - role: stephrobert.scaleway.rolling_reboot
      scaleway_rolling_reboot_group: "{{ group }}"
      scaleway_rolling_reboot_batch_size: "{{ batch_size }}"
      scaleway_rolling_reboot_wait_timeout: "{{ wait_timeout }}"
