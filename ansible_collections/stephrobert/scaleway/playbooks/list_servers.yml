# Inventory of one zone's Instances, broken down by state.
#
# The most common Day-2 case: knowing what runs before deciding anything. The
# module walks **every** page, so the count is the real count, not the first
# hundred.
#
#   ansible-playbook stephrobert.scaleway.list_servers -e zone=fr-par-1
#
# Credentials come from the environment (SCW_ACCESS_KEY, SCW_SECRET_KEY) or
# from the Scaleway configuration file. To try this without an account, point
# SCW_API_URL at a local emulator: see the repository's runtime documentation.
- name: Scaleway Instances inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    zone: fr-par-1

  tasks:
    - name: List the Instances of the zone
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
      register: inventaire

    - name: What the zone holds
      ansible.builtin.debug:
        msg: "{{ inventaire.servers | length }} Instance(s) in {{ zone }}"

    - name: Breakdown by state
      ansible.builtin.debug:
        msg: >-
          {{ item }} :
          {{ inventaire.servers | selectattr('state', 'equalto', item) | list | length }}
      loop: "{{ inventaire.servers | map(attribute='state') | unique | list }}"

    - name: The stopped Instances, which occupy without serving
      ansible.builtin.debug:
        msg: >-
          {{ inventaire.servers
             | selectattr('state', 'equalto', 'stopped')
             | map(attribute='name')
             | list }}

    - name: The commercial types in use, and how many of each
      ansible.builtin.debug:
        msg: >-
          {{ item }} :
          {{ inventaire.servers | selectattr('commercial_type', 'equalto', item) | list | length }}
      loop: "{{ inventaire.servers | map(attribute='commercial_type') | unique | list }}"
