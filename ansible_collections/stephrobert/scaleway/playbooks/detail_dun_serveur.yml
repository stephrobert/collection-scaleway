# Read one Instance, and call the API once to do it.
#
# The same module serves both modes: `server_id` given reads one resource,
# `server_id` omitted lists the zone. That is the only choice the module makes,
# and the playbook shows it.
#
#   ansible-playbook stephrobert.scaleway.detail_dun_serveur \
#     -e zone=fr-par-1 -e server_id=<uuid>
#
# Without `server_id`, the playbook takes the first Instance in the zone, so it
# can be tried without knowing anything in advance.
- name: Detail of one Scaleway Instance
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    zone: fr-par-1
    server_id: ""

  tasks:
    - name: Find an Instance when none was named
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
      register: inventaire
      when: not server_id

    - name: Keep the Instance to read
      ansible.builtin.set_fact:
        cible: "{{ server_id or (inventaire.servers | first).id }}"

    - name: Read the Instance
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
        server_id: "{{ cible }}"
      register: instance

    - name: What the API says about this Instance
      ansible.builtin.debug:
        msg:
          - "name            : {{ instance.server.name }}"
          - "state           : {{ instance.server.state }}"
          - "commercial type : {{ instance.server.commercial_type }}"
          - "zone            : {{ instance.server.zone }}"
          - "created         : {{ instance.server.creation_date }}"
          - "tags            : {{ instance.server.tags | default([]) }}"

    - name: An information module never changes anything
      ansible.builtin.assert:
        that:
          - instance is not changed
        success_msg: "read-only confirmed, changed=false"
