# Stop one Instance, and check that it really stopped.
#
# The Day-2 case par excellence: acting on a machine that exists, without ever
# creating or deleting one.
#
#   ansible-playbook stephrobert.scaleway.stop_server \
#     -e zone=fr-par-1 -e server_id=<uuid>
#
# Without `server_id` the playbook does nothing and says so: an example that
# picks which machine to stop on your behalf is a trap, not documentation.
#
# Run it twice: the second run reports `changed=true`, because an action is a
# trigger and not a state. Idempotence is the business of the management
# modules, not of the action ones.
- name: Stop a Scaleway Instance
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    zone: fr-par-1
    server_id: ""
    # `poweroff` releases the slot on the hypervisor, `stop_in_place` keeps it.
    # Both values come from the contract, with their consequences.
    #
    # `extinction` and not `action`: Ansible reserves that name, which is also
    # the task keyword naming the module to run. A variable carrying it can
    # collide, and `ansible-lint` refuses it at the basic profile.
    extinction: poweroff

  tasks:
    - name: With no Instance named, do nothing and say so
      ansible.builtin.debug:
        msg: >-
          No Instance named. Run again with -e server_id=<uuid> to act. The
          playbook stops here without touching anything.
      when: not server_id

    - name: Read the Instance before acting
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
        server_id: "{{ server_id }}"
      register: avant
      when: server_id | length > 0

    - name: What is about to be stopped
      ansible.builtin.debug:
        msg: "{{ avant.server.name }} is {{ avant.server.state }}, action requested: {{ extinction }}"
      when: server_id | length > 0

    - name: Stop the Instance, and wait for the target state
      stephrobert.scaleway.instance_server_action:
        zone: "{{ zone }}"
        server_id: "{{ server_id }}"
        action: "{{ extinction }}"
      register: arret
      when: server_id | length > 0

    - name: Read the Instance back rather than take the module's word for it
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
        server_id: "{{ server_id }}"
      register: apres
      when: server_id | length > 0

    - name: The API confirms the state
      ansible.builtin.assert:
        that:
          - apres.server.state == 'stopped'
        fail_msg: "state {{ apres.server.state }} after {{ extinction }}, 'stopped' expected"
        success_msg: "{{ apres.server.name }} is {{ apres.server.state }}"
      when: server_id | length > 0
