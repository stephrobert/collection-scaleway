# Say what is wrong before a playbook says it badly, halfway through.
#
#   ansible-playbook stephrobert.scaleway.doctor
#   ansible-playbook stephrobert.scaleway.doctor -e zone=nl-ams-1
#
# This repository is good at diagnosing itself and said nothing useful to
# someone whose setup is wrong: they found out in the middle of a play, through
# an SDK traceback or an HTTP status. Every check here runs, none stops the
# others, and the report lists all of them at once. Discovering one problem per
# run is how a first contact is spent on nothing.
#
# **Three states, and they are not the same thing.**
#
#   ok      the check ran, and the answer is yes
#   ko      the check ran, and the answer is no
#   ?       the check could not run, so nothing is known
#
# A `?` is not a `ko`. A zone that does not answer has not been measured to be
# empty, and an SDK that could not be interrogated is not an absent SDK. This
# is the same rule the residue check follows against a real account, and the
# reason it is trusted.
#
# **No secret is ever printed.** Where a credential comes from is named, its
# value never is: a profile name and an environment variable name say enough to
# fix a setup, and a report is pasted into issues.
- name: Check a Scaleway setup, and name what is missing
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # The zone the API is asked about. Any zone works: the point is to reach
    # the API, not to inspect this one in particular.
    zone: fr-par-1
    # Measured, not supposed. `meta/runtime.yml` carries the reason for the
    # first, the documentation fragment for the second.
    core_minimum: "2.17.0"
    sdk_minimum: "2.9.0"

  tasks:
    # ---- What runs the modules -------------------------------------------

    - name: The ansible-core that will run the modules
      ansible.builtin.set_fact:
        verdict_core: >-
          {{ 'ok' if ansible_version.full is version(core_minimum, '>=') else 'ko' }}
        detail_core: >-
          ansible-core {{ ansible_version.full
          }}{{ '' if ansible_version.full is version(core_minimum, '>=')
               else ' (the collection requires >= ' ~ core_minimum ~ ')' }}

    # The interpreter that will import the SDK is the one running this play,
    # not the one on `$PATH`. Asking the wrong Python is how a setup looks
    # broken while it is merely split across two environments.
    - name: The Scaleway SDK, asked of the interpreter that will import it
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "-c"
          - "import importlib.metadata as m; print(m.version('scaleway'))"
      register: sonde_sdk
      changed_when: false
      failed_when: false

    - name: What the interpreter answered about the SDK
      ansible.builtin.set_fact:
        version_sdk: "{{ sonde_sdk.stdout | default('') | trim }}"

    - name: The SDK verdict
      ansible.builtin.set_fact:
        verdict_sdk: >-
          {{ 'ok' if version_sdk is version(sdk_minimum, '>=') else 'ko' }}
        detail_sdk: >-
          {{ 'Scaleway SDK ' ~ version_sdk if version_sdk
             else 'Scaleway SDK missing: pip install ' ~ ('scaleway>=' ~ sdk_minimum) }}
      when: version_sdk | length > 0

    - name: The SDK verdict when the interpreter could not be asked
      ansible.builtin.set_fact:
        verdict_sdk: "ko"
        detail_sdk: >-
          Scaleway SDK missing: pip install 'scaleway>={{ sdk_minimum }}'
      when: version_sdk | length == 0

    # ---- Where the credentials come from ---------------------------------

    # Names, never values. A profile name and a variable name are enough to
    # repair a setup, and this report gets pasted into issues.
    - name: The sources of credentials that are set
      ansible.builtin.set_fact:
        sources: >-
          {{ (['SCW_PROFILE=' ~ lookup('env', 'SCW_PROFILE')]
              if lookup('env', 'SCW_PROFILE') else [])
           + (['SCW_ACCESS_KEY (environment)']
              if lookup('env', 'SCW_ACCESS_KEY') else [])
           + (['SCW_SECRET_KEY (environment)']
              if lookup('env', 'SCW_SECRET_KEY') else [])
           + ([config_path ~ ' (configuration file)']
              if config_path is exists else []) }}
      vars:
        config_path: >-
          {{ lookup('env', 'SCW_CONFIG_PATH')
             | default(lookup('env', 'HOME') ~ '/.config/scw/config.yaml', true) }}

    - name: The credentials verdict
      ansible.builtin.set_fact:
        verdict_sources: "{{ 'ok' if sources else 'ko' }}"
        detail_sources: >-
          {{ 'credentials from ' ~ (sources | join(', ')) if sources
             else 'no credential source: set SCW_ACCESS_KEY and SCW_SECRET_KEY, '
                  ~ 'or a profile in the configuration file' }}

    # ---- What the API answers --------------------------------------------

    # One call answers three questions at once, and its failure mode says which
    # one failed. Splitting it into three would triple the cost and tell the
    # same story.
    - name: Ask the API for this zone's Instances
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
      register: sonde_api
      failed_when: false
      when: verdict_sdk == 'ok'

    # **`failed_when: false` rewrites `failed` to `false`.** Measured: a module
    # that could not reach the API at all still reports `failed=False` once the
    # task declares it cannot fail. Reading that field here made this check
    # unable to ever go red, which is the decoration this playbook exists to
    # replace. What the module returned is the honest signal: `servers` on an
    # answer, `status_code` on a refusal, neither when nothing was reached.
    - name: What the API answered
      ansible.builtin.set_fact:
        verdict_api: >-
          {{ 'ok' if sonde_api.servers is defined
             else ('ko' if sonde_api.status_code is defined else '?') }}
        detail_api: >-
          {{ (zone ~ ' at ' ~ point_dentree ~ ' reachable, '
              ~ (sonde_api.servers | length) ~ ' Instance(s)')
             if sonde_api.servers is defined
             else ((zone ~ ': the API refused, HTTP ' ~ (sonde_api.status_code | string)
                    ~ (' (' ~ sonde_api.api_type ~ ')' if sonde_api.api_type | default('') else ''))
                   if sonde_api.status_code is defined
                   else (zone ~ ' at ' ~ point_dentree
                         ~ ': the API could not be reached, so nothing is known')) }}
      vars:
        # Nommer l'endroit interrogé règle la moitié des diagnostics : viser un
        # émulateur en croyant viser Scaleway ressemble à une panne d'API.
        point_dentree: >-
          {{ lookup('env', 'SCW_API_URL') | default('https://api.scaleway.com', true) }}
      when: verdict_sdk == 'ok'

    - name: The API is not asked when the SDK cannot import
      ansible.builtin.set_fact:
        verdict_api: "?"
        detail_api: "the API was not asked: the SDK has to import first"
      when: verdict_sdk != 'ok'

    # ---- The report ------------------------------------------------------

    - name: Gather the checks in the order they matter
      ansible.builtin.set_fact:
        controles:
          - {verdict: "{{ verdict_core }}", detail: "{{ detail_core }}"}
          - {verdict: "{{ verdict_sdk }}", detail: "{{ detail_sdk }}"}
          - {verdict: "{{ verdict_sources }}", detail: "{{ detail_sources }}"}
          - {verdict: "{{ verdict_api }}", detail: "{{ detail_api }}"}

    - name: The report
      ansible.builtin.debug:
        msg: >-
          {{ controles | map(attribute='verdict')
             | zip(controles | map(attribute='detail'))
             | map('join', '  ') | list }}

    # The verdict is separate from the report, so the report is printed whatever
    # it says. A check that aborted the play would hide the ones after it, which
    # is the behaviour this playbook exists to replace.
    #
    # **`Ready` is only said when everything was checked and everything passed.**
    # A `?` keeps its own meaning in the report, and it does not pass for a
    # success here: someone whose API cannot be reached is not ready, and telling
    # them otherwise is the failure this playbook exists to prevent. Ansible
    # offers one failing exit code, so the distinction lives in the message,
    # where a human reads it, rather than in a number nobody prints.
    - name: The verdict
      ansible.builtin.assert:
        that:
          - controles | rejectattr('verdict', 'equalto', 'ok') | list | length == 0
        fail_msg: >-
          {{ ('not ready: ' ~ (controles | selectattr('verdict', 'equalto', 'ko')
              | map(attribute='detail') | list | join(' · '))
              if controles | selectattr('verdict', 'equalto', 'ko') | list else '')
          }}{{ ' · ' if (controles | selectattr('verdict', 'equalto', 'ko') | list)
               and (controles | selectattr('verdict', 'equalto', '?') | list) else ''
          }}{{ ('not verified: ' ~ (controles | selectattr('verdict', 'equalto', '?')
              | map(attribute='detail') | list | join(' · '))
              if controles | selectattr('verdict', 'equalto', '?') | list else '') }}
        success_msg: "Ready."
        quiet: true
