# Inventaire des Instances d'une zone, réparti par état.
#
# Le cas Day-2 le plus courant : savoir ce qui tourne avant de décider quoi que
# ce soit. Le module parcourt **toutes** les pages, donc le compte est le vrai
# compte, pas celui de la première centaine.
#
#   ansible-playbook playbooks/inventaire_serveurs.yml -e zone=fr-par-1
#
# Les identifiants viennent de l'environnement (SCW_ACCESS_KEY, SCW_SECRET_KEY)
# ou du fichier de configuration Scaleway. Pour essayer sans compte, pointer
# SCW_API_URL vers un émulateur local : voir docs/architecture/runtime.md.
- name: Inventaire des Instances Scaleway
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    zone: fr-par-1

  tasks:
    - name: Lister les Instances de la zone
      local.scaleway.instance_server_info:
        zone: "{{ zone }}"
      register: inventaire

    - name: Ce que la zone contient
      ansible.builtin.debug:
        msg: "{{ inventaire.servers | length }} Instance(s) dans {{ zone }}"

    - name: Répartition par état
      ansible.builtin.debug:
        msg: >-
          {{ item }} :
          {{ inventaire.servers | selectattr('state', 'equalto', item) | list | length }}
      loop: "{{ inventaire.servers | map(attribute='state') | unique | list }}"

    - name: Les Instances arrêtées, celles qui occupent sans servir
      ansible.builtin.debug:
        msg: >-
          {{ inventaire.servers
             | selectattr('state', 'equalto', 'stopped')
             | map(attribute='name')
             | list }}

    - name: Les types commerciaux en usage, et combien de chacun
      ansible.builtin.debug:
        msg: >-
          {{ item }} :
          {{ inventaire.servers | selectattr('commercial_type', 'equalto', item) | list | length }}
      loop: "{{ inventaire.servers | map(attribute='commercial_type') | unique | list }}"
