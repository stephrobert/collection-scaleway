# Identité de la collection. Le générateur lit ce fichier : le namespace, le
# nom et la version qu'il déclare finissent dans chaque module produit.
#
# Le namespace est une décision de périmètre, pas une préférence de style :
# `scaleway.scaleway` appartient à Scaleway, et rien ne s'y publie sans son
# accord. `local` désigne une collection interne, installée par chemin ou par
# archive. Le renommer se fait ici, puis `mise run generate` réécrit les modules.
namespace: local
name: scaleway
version: 0.1.0
readme: README.md
authors:
  - Stéphane Robert (@stephrobert)
description: >-
  Modules Ansible Day-2 pour les APIs Scaleway, produits par le générateur de
  ce dépôt. Terraform provisionne les ressources, cette collection exploite
  les ressources existantes.
license:
  - GPL-3.0-or-later
tags:
  - scaleway
  - cloud
  - infrastructure
dependencies: {}

# La collection ne contient que ce qui se livre : le générateur, les contrats
# et les tests du dépôt vivent au-dessus de `ansible_collections/`, hors de ce
# répertoire. `build_ignore` n'a donc plus à les écarter, et ce qui reste est
# ce qu'`ansible-galaxy` produirait de toute façon.
build_ignore:
  - tests/output
