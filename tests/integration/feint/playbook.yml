# Ce que ce playbook prouve, et qu'aucun test unitaire ne peut prouver.
#
# Il parle à un vrai serveur HTTP, avec le vrai SDK, sur le module tel qu'il a
# été généré. Il est joué par `scripts/integration.py`, qui démarre feint,
# l'amorce et le range ensuite.
#
# `feint` est un émulateur local : c'est un backend de test, pas une
# dépendance de la collection. Rien dans `plugins/` ne le connaît, et
# `mise run check` tourne sans lui.
- name: instance_server_info contre un émulateur local
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    zone: fr-par-1
    # Amorcés par le lanceur. Au-delà d'une page (100), pour que la liste ne
    # puisse pas passer pour complète en n'ayant rendu que la première.
    attendus: "{{ lookup('env', 'FEINT_SEEDED_SERVERS') | int }}"
    # Allumé par le lanceur avant le playbook. Sous FEINT_VM=off c'est un
    # changement d'état ; sous incus-ovn une machine a réellement démarré, et
    # le module doit dire la même chose dans les deux cas.
    serveur_allume: "{{ lookup('env', 'FEINT_RUNNING_SERVER') }}"

  tasks:
    - name: Lister tous les serveurs de la zone
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
      register: liste

    - name: La liste va jusqu'au bout, et ne modifie rien
      ansible.builtin.assert:
        that:
          - liste.servers | length == attendus | int
          - liste is not changed
        fail_msg: >-
          {{ liste.servers | length }} serveur(s) rendu(s) pour {{ attendus }} amorcé(s) :
          la pagination s'est arrêtée avant la fin.
        success_msg: "{{ liste.servers | length }} serveurs rendus, toutes pages parcourues"

    - name: Lire un serveur par son identifiant
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
        server_id: "{{ liste.servers[0].id }}"
      register: unitaire

    - name: L'identifiant fourni bascule bien sur la lecture unitaire
      ansible.builtin.assert:
        that:
          - unitaire.server.id == liste.servers[0].id
          - unitaire.servers is not defined
          - unitaire is not changed
        success_msg: "serveur {{ unitaire.server.name }} lu par son identifiant"

    - name: Lire le serveur qui tourne réellement
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
        server_id: "{{ serveur_allume }}"
      register: allume

    - name: Le module rapporte l'état de la machine, pas un état supposé
      ansible.builtin.assert:
        that:
          - allume.server.state == 'running'
          - allume.server.id == serveur_allume
        fail_msg: >-
          le serveur {{ serveur_allume }} est rendu dans l'état
          {{ allume.server.state }}, alors que le lanceur l'a allumé et attendu.
        success_msg: "serveur {{ allume.server.name }} lu en état running"

    - name: Le serveur allumé fait partie de la liste complète
      ansible.builtin.assert:
        that:
          - serveur_allume in (liste.servers | map(attribute='id') | list)
        success_msg: "le serveur allumé est bien dans les {{ attendus }} rendus"

    - name: Un filtre du contrat restreint la liste
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
        name: "{{ liste.servers[0].name }}"
      register: filtree

    - name: Le filtre a bien été transmis à l'API
      ansible.builtin.assert:
        that:
          - filtree.servers | length < liste.servers | length
        success_msg: "{{ filtree.servers | length }} serveur(s) après filtrage par nom"

    - name: Le check mode ne change rien à une lecture
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
      check_mode: true
      register: en_check_mode

    - name: Un module d'information rend la même chose en check mode
      ansible.builtin.assert:
        that:
          - en_check_mode.servers | length == liste.servers | length
          - en_check_mode is not changed

    - name: Un identifiant inconnu échoue avec un message qui le dit
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
        server_id: 00000000-0000-4000-8000-000000000000
      register: absent
      # `ignore_errors` et non `failed_when: false` : le second efface le
      # statut d'échec, et l'assertion suivante ne mesurerait plus rien.
      ignore_errors: true

    - name: L'erreur porte l'opération et le statut, et aucun secret
      ansible.builtin.assert:
        that:
          - absent is failed
          - absent.operation == 'GetServer'
          - absent.status_code == 404
          - "'SCW' not in (absent.msg | string)"
        success_msg: "erreur remontée : {{ absent.msg }}"

    - name: Annoncer un arrêt sans le déclencher
      stephrobert.scaleway.instance_server_action:
        zone: "{{ zone }}"
        server_id: "{{ serveur_allume }}"
        action: poweroff
      check_mode: true
      register: annonce

    - name: Le check mode annonce le changement et ne touche à rien
      ansible.builtin.assert:
        that:
          - annonce is changed
          - annonce.expected_state == 'stopped'
        success_msg: "arrêt annoncé, état attendu {{ annonce.expected_state }}"

    - name: Le serveur tourne toujours après le check mode
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
        server_id: "{{ serveur_allume }}"
      register: apres_annonce

    - name: Rien n'a bougé
      ansible.builtin.assert:
        that:
          - apres_annonce.server.state == 'running'
        fail_msg: >-
          le check mode a réellement arrêté le serveur : l'état est
          {{ apres_annonce.server.state }}.
        success_msg: "le check mode n'a rien déclenché"

    - name: Arrêter réellement l'Instance, et attendre qu'elle soit arrêtée
      stephrobert.scaleway.instance_server_action:
        zone: "{{ zone }}"
        server_id: "{{ serveur_allume }}"
        action: poweroff
      register: arret

    - name: L'action est confirmée, et l'état visé est atteint
      ansible.builtin.assert:
        that:
          - arret is changed
          - arret.action == 'poweroff'
          - arret.state == 'stopped'
        success_msg: "Instance arrêtée, état {{ arret.state }}"

    - name: Relire l'Instance pour ne pas croire le module sur parole
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
        server_id: "{{ serveur_allume }}"
      register: relu

    - name: L'API confirme l'arrêt
      ansible.builtin.assert:
        that:
          - relu.server.state == 'stopped'
        success_msg: "l'API rend bien {{ relu.server.state }}"

    # `reboot` n'est pas joué ici, et c'est mesuré plutôt que supposé : en
    # `--vm off`, l'émulateur bascule l'état sans passer par `stopping` ni
    # `starting`, donc la machine ne quitte jamais `running`. Le module exige
    # désormais d'observer une transition avant de confirmer un redémarrage,
    # et il échouerait ici pour une raison qui n'est pas la sienne. La garde
    # est prouvée par les tests unitaires ; l'émulateur ne peut pas la juger
    # (feint#637).
    #
    # `stop_in_place` attendait `stopped` jusqu'à ce que quelqu'un la joue :
    # le contrat déclare `stopped in place`, un état **distinct**, et le module
    # échouait après `wait_timeout` sur une Instance pourtant bien arrêtée.
    # Aucun test hors ligne ne pouvait l'attraper, parce que le défaut était
    # dans la valeur, pas dans la forme. Celui-ci l'attrape.
    - name: Rallumer pour éprouver la seconde forme d'arrêt
      stephrobert.scaleway.instance_server_action:
        zone: "{{ zone }}"
        server_id: "{{ server_id }}"
        action: poweron
        wait: true

    - name: Arrêter en gardant la place sur l'hyperviseur
      stephrobert.scaleway.instance_server_action:
        zone: "{{ zone }}"
        server_id: "{{ server_id }}"
        action: stop_in_place
        wait: true
      register: fige

    - name: L'état atteint est bien « stopped in place », et pas « stopped »
      ansible.builtin.assert:
        that:
          - fige is changed
          - fige.state == 'stopped in place'
        success_msg: >-
          stop_in_place atteint '{{ fige.state }}', l'état que le contrat
          déclare pour cette action
        fail_msg: >-
          stop_in_place a rendu '{{ fige.state | default("rien") }}' :
          l'override d'attente ne correspond plus au contrat

    - name: Relire l'Instance plutôt que croire le module
      stephrobert.scaleway.instance_server_info:
        zone: "{{ zone }}"
        server_id: "{{ server_id }}"
      register: apres_fige

    - name: L'API confirme l'état distinct
      ansible.builtin.assert:
        that:
          - apres_fige.server.state == 'stopped in place'
        quiet: true

    - name: Une action que la collection n'expose pas est refusée par Ansible
      stephrobert.scaleway.instance_server_action:
        zone: "{{ zone }}"
        server_id: "{{ serveur_allume }}"
        action: terminate
      register: refus
      ignore_errors: true

    - name: terminate supprimerait l'Instance, et le module ne le propose pas
      ansible.builtin.assert:
        that:
          - refus is failed
          - "'terminate' in (refus.msg | string)"
        success_msg: "terminate refusé avant tout appel réseau"

    # ---- L'instantané, joué plutôt qu'affirmé --------------------------------
    #
    # Un test unitaire dit que le filtre calcule ce que le test croit. Il ne dit
    # pas qu'Ansible sait charger le filtre depuis la collection, que le rôle lui
    # passe ce qu'il faut, ni que la version se lit à l'endroit où l'on tourne.
    # C'est ici que ça se mesure (#231).
    - name: Lire le parc, et garder de quoi le comparer plus tard
      ansible.builtin.include_role:
        name: stephrobert.scaleway.fleet_report
      vars:
        scaleway_fleet_report_zones: "{{ zone }}"

    - name: L'instantané porte sa forme, sa clé, et ce qu'il n'a pas mesuré
      ansible.builtin.assert:
        that:
          - scaleway_fleet_report_snapshot.schema_version == 1
          # La version vient du disque, pas d'une constante recopiée : la seule
          # chose qu'on puisse affirmer sans la figer est qu'elle existe.
          - scaleway_fleet_report_snapshot.collection_version is string
          - scaleway_fleet_report_snapshot.collection_version | length > 0
          - scaleway_fleet_report_snapshot.captured_at is string
          - scaleway_fleet_report_snapshot.scopes_measured
              | selectattr('type', 'equalto', 'zone') | map(attribute='name') | list == [zone]
          - scaleway_fleet_report_snapshot.scopes_unmeasured
              | selectattr('type', 'equalto', 'zone') | list == []
          # Toute ressource porte sa clé : c'est ce qui rend la comparaison
          # possible, et son absence est le défaut que le diff ne verrait pas.
          - scaleway_fleet_report_snapshot.resources
              | rejectattr('id') | list | length == 0
          - scaleway_fleet_report_snapshot.resources
              | rejectattr('kind') | list | length == 0
        success_msg: >-
          instantané v{{ scaleway_fleet_report_snapshot.schema_version }},
          {{ scaleway_fleet_report_snapshot.resources | length }} ressource(s),
          produit par {{ scaleway_fleet_report_snapshot.collection_version }}
        fail_msg: >-
          l'instantané ne tient pas sa forme :
          {{ scaleway_fleet_report_snapshot }}

    # Gardé avant la seconde lecture : le rôle réécrit son propre fait, donc
    # comparer sans copier comparerait le second instantané à lui-même, et le
    # test passerait sans rien mesurer.
    - name: Garder le premier instantané, que la seconde lecture va écraser
      ansible.builtin.set_fact:
        instantane_garde: "{{ scaleway_fleet_report_snapshot }}"

    - name: Le même parc relu produit le même instantané, aux dates près
      ansible.builtin.include_role:
        name: stephrobert.scaleway.fleet_report
      vars:
        scaleway_fleet_report_zones: "{{ zone }}"

    - name: Deux lectures d'un parc inchangé se comparent
      ansible.builtin.assert:
        that:
          - scaleway_fleet_report_snapshot.resources == premier.resources
        success_msg: >-
          deux lectures, {{ premier.resources | length }} ressource(s)
          identiques : ce que le diff de #232 pourra comparer
        fail_msg: >-
          deux lectures d'un parc inchangé diffèrent, donc un diff annoncerait
          des changements que personne n'a faits
      vars:
        premier: "{{ instantane_garde }}"

    # ---- Le diff, joué sur un changement qu'on provoque ---------------------
    #
    # L'instantané seul ne prouve rien d'utile : il prouve qu'on sait écrire un
    # fichier. Ce qui compte est qu'une modification réelle du parc ressorte, et
    # ressorte au bon endroit. On change donc l'état d'une machine entre les deux
    # lectures, et on exige de la retrouver (#232).
    - name: Un endroit où poser l'instantané, hors du dépôt
      ansible.builtin.tempfile:
        state: file
        suffix: .json
      register: fichier_instantane

    - name: Poser la référence
      ansible.builtin.copy:
        content: "{{ instantane_garde | to_json }}"
        dest: "{{ fichier_instantane.path }}"
        mode: "0600"

    - name: Changer vraiment quelque chose entre les deux lectures
      stephrobert.scaleway.instance_server_action:
        zone: "{{ zone }}"
        server_id: "{{ serveur_allume }}"
        action: poweroff
        wait: true

    - name: Comparer la référence à ce que le parc est devenu
      ansible.builtin.include_role:
        name: stephrobert.scaleway.fleet_diff
      vars:
        scaleway_fleet_diff_baseline: "{{ fichier_instantane.path }}"
        scaleway_fleet_diff_zones: "{{ zone }}"
        scaleway_fleet_diff_output: none

    - name: La machine éteinte ressort comme changée, sur le champ `state`
      ansible.builtin.assert:
        that:
          - scaleway_fleet_diff_level == 'changed'
          - serveur_allume in (diff.changed | map(attribute='id') | list)
          - "'state' in (diff.changed
              | selectattr('id', 'equalto', serveur_allume)
              | first).fields"
          # Rien n'a été créé ni supprimé : c'est un changement, et le diff doit
          # le dire comme tel plutôt que comme un départ suivi d'une arrivée.
          - diff.new == []
          - diff.removed == []
          # Une zone non comparée rendrait le verdict `action_required`, et
          # l'assertion précédente masquerait le fait qu'on n'a rien comparé.
          - diff.scopes_not_compared == {}
        success_msg: >-
          {{ serveur_allume }} ressort en changé sur
          {{ (diff.changed | selectattr('id', 'equalto', serveur_allume)
              | first).fields.keys() | list | join(', ') }},
          {{ diff.unchanged }} ressource(s) inchangée(s)
        fail_msg: >-
          un changement réel du parc n'est pas ressorti du diff : {{ diff }}
      vars:
        diff: "{{ scaleway_fleet_diff_result }}"

    - name: Comparer un instantané à lui-même ne dit rien
      ansible.builtin.include_role:
        name: stephrobert.scaleway.fleet_diff
      vars:
        scaleway_fleet_diff_baseline: "{{ fichier_instantane.path }}"
        scaleway_fleet_diff_current: "{{ fichier_instantane.path }}"
        scaleway_fleet_diff_output: none

    - name: Deux lectures identiques sortent en `quiet`
      ansible.builtin.assert:
        that:
          - scaleway_fleet_diff_level == 'quiet'
          - scaleway_fleet_diff_result.changed == []
          - scaleway_fleet_diff_result.new == []
          - scaleway_fleet_diff_result.removed == []
        success_msg: >-
          rien n'a bougé, et le dire coûte une ligne :
          {{ scaleway_fleet_diff_result.unchanged }} ressource(s) inchangée(s)
        fail_msg: >-
          un instantané comparé à lui-même annonce des changements :
          {{ scaleway_fleet_diff_result }}

    # **Ce que l'épreuve a éteint, elle le rallume.** Les playbooks joués ensuite
    # mesurent ce parc, et l'un d'eux a échoué sur `l'état n'a jamais quitté
    # stopped` : une épreuve qui laisse le terrain modifié fait rougir la
    # suivante, pour une raison qui n'a rien à voir avec elle.
    - name: Remettre la machine dans l'état où l'épreuve l'a trouvée
      stephrobert.scaleway.instance_server_action:
        zone: "{{ zone }}"
        server_id: "{{ serveur_allume }}"
        action: poweron
        wait: true

    - name: Ne rien laisser derrière
      ansible.builtin.file:
        path: "{{ fichier_instantane.path }}"
        state: absent

    # ---- L'identité d'un constat, éprouvée sur deux runs --------------------
    #
    # Le test unitaire prouve que la fonction rend deux fois la même chose sur
    # les mêmes données. Il ne prouve pas que deux audits d'un vrai parc, avec
    # deux lectures distinctes, produisent les mêmes identités : c'est ce que
    # « nouveau, persistant, résolu » exigera de #234, et ça se mesure ici.
    - name: Auditer le parc une première fois
      ansible.builtin.include_role:
        name: stephrobert.scaleway.fleet_audit
      vars:
        scaleway_fleet_audit_zones: "{{ zone }}"
        scaleway_fleet_audit_output: none

    - name: Garder les identités du premier audit
      ansible.builtin.set_fact:
        identites_premier: >-
          {{ scaleway_fleet_audit_findings | map(attribute='id') | list | sort }}
        # Ce qu'un appelant garderait entre deux runs. La collection ne tient pas
        # d'historique : la comparaison a besoin de ce que l'appelant a conservé.
        constats_premier: "{{ scaleway_fleet_audit_changes.current }}"
        niveau_premier: "{{ scaleway_fleet_audit_level }}"

    - name: Auditer le parc une seconde fois, en rendant le premier
      ansible.builtin.include_role:
        name: stephrobert.scaleway.fleet_audit
      vars:
        scaleway_fleet_audit_zones: "{{ zone }}"
        scaleway_fleet_audit_output: none
        scaleway_fleet_audit_previous: "{{ constats_premier }}"

    # **La propriété que le jalon exige, jouée et non affirmée.** Deux audits
    # d'un parc inchangé ne produisent ni nouveau ni résolu, et le second sort en
    # `quiet`. Sans ce contrôle, « ne pas augmenter le nombre de notifications »
    # serait une phrase dans une issue (#234).
    - name: Un parc inchangé ne produit ni nouveau ni résolu, et le dit
      ansible.builtin.assert:
        that:
          - niveau_premier == 'baseline'
          - scaleway_fleet_audit_changes.baseline is false
          - scaleway_fleet_audit_changes.counts.new == 0
          - scaleway_fleet_audit_changes.counts.resolved == 0
          - scaleway_fleet_audit_changes.counts.unmeasured == 0
          - scaleway_fleet_audit_changes.counts.persisting == identites_premier | length
          - scaleway_fleet_audit_level == 'quiet'
          # La première vue vient du premier run, recopiée et non réécrite.
          - scaleway_fleet_audit_changes.persisting
              | selectattr('first_seen', 'defined') | list | length
              == identites_premier | length
        success_msg: >-
          le premier audit est une référence, le second est `quiet` :
          {{ scaleway_fleet_audit_changes.counts.persisting }} constat(s)
          persistant(s), 0 nouveau, 0 résolu
        fail_msg: >-
          un parc inchangé a produit du mouvement, donc le rapport du lendemain
          serait du bruit : {{ scaleway_fleet_audit_changes.counts }}

    - name: Les deux audits nomment exactement les mêmes constats
      ansible.builtin.assert:
        that:
          - identites_premier | length > 0
          - identites_premier == identites_second
          # Une identité porte l'identifiant de la ressource, jamais son nom :
          # deux machines peuvent porter le même nom dans une zone.
          - identites_premier | select('search', ':instance:') | list | length
              == identites_premier | length
        success_msg: >-
          {{ identites_premier | length }} constat(s), les mêmes identités aux
          deux lectures : ce que #234 pourra compter en nouveau et en résolu
        fail_msg: >-
          deux audits du même parc ne nomment pas les mêmes constats, donc tout
          ressortirait comme neuf puis comme résolu :
          {{ identites_premier | symmetric_difference(identites_second) }}
      vars:
        identites_second: >-
          {{ scaleway_fleet_audit_findings | map(attribute='id') | list | sort }}

    # ---- Les exceptions de politique, jouées sur les trois cas --------------
    #
    # Un test unitaire dit que le filtre calcule ce que le test croit. Il ne dit
    # pas qu'Ansible sait le charger, que le rôle lui passe les ressources qu'il
    # faut, ni que les statuts ressortent jusque dans ce que le rôle publie
    # (#235).
    - name: Une machine du parc, pour y accrocher une exception
      ansible.builtin.set_fact:
        machine_excusee: "{{ liste.servers[0] }}"

    # **L'audit doit échouer, et c'est ce qu'on éprouve.** Une exception expirée
    # est un constat de sévérité `fail`, donc le rôle refuse le parc : c'est
    # exactement le comportement voulu, puisque l'échéance est l'information.
    # Le `rescue` attrape ce refus pour que les assertions puissent lire ce que
    # le rôle a laissé, plutôt que de mourir avec lui.
    - name: Auditer avec une exception valide, une expirée, et une sans cible
      block:
        - ansible.builtin.include_role:
            name: stephrobert.scaleway.fleet_audit
      rescue:
        - name: Le refus est attendu, l'exception expirée est un constat `fail`
          ansible.builtin.debug:
            msg: >-
              l'audit a refusé le parc, ce qui est le comportement voulu :
              {{ scaleway_fleet_audit_expired_exceptions | length }}
              exception(s) périmée(s)
      vars:
        scaleway_fleet_audit_zones: "{{ zone }}"
        scaleway_fleet_audit_output: none
        scaleway_fleet_audit_policy:
          rules:
            required_tags:
              severity: warn
              keys: [owner]
          exceptions:
            - rule: required_tags
              selector:
                id: "{{ machine_excusee.id }}"
              reason: Lab machine, tags are not the point here
              owner: platform-team
              expires_at: "2099-12-31"
            - rule: required_tags
              selector:
                tags: [jamais-posee-par-personne]
              reason: Covers nothing on purpose
              owner: platform-team
              expires_at: "2099-12-31"
            - rule: required_tags
              selector:
                id: "{{ machine_excusee.id }}"
              reason: Expired on purpose, to prove the deadline is information
              owner: ancienne-equipe
              expires_at: "2020-01-01"

    - name: Les trois cas ressortent chacun à sa place
      ansible.builtin.assert:
        that:
          # Le constat couvert est toujours là, avec son statut et qui l'excuse.
          - couvert | length == 1
          - "'platform-team' in couvert[0].suppressed_by"
          - scaleway_fleet_audit_suppressed | int == 1
          # L'exception périmée est un constat, pas un refus : l'audit a tourné.
          - scaleway_fleet_audit_expired_exceptions | length == 1
          - "'ancienne-equipe' in scaleway_fleet_audit_expired_exceptions[0].detail"
          # Celle qui ne désigne rien est signalée, et n'a rien empêché.
          - scaleway_fleet_audit_exceptions_without_target | length == 1
          # Et le reste du parc n'est pas excusé au passage.
          - scaleway_fleet_audit_findings
              | selectattr('status', 'equalto', 'open') | list | length > 1
        success_msg: >-
          1 constat excusé par platform-team, 1 exception périmée devenue
          constat, 1 exception sans cible signalée, et
          {{ scaleway_fleet_audit_findings
             | selectattr('status', 'equalto', 'open') | list | length }}
          constat(s) toujours ouverts
        fail_msg: >-
          les exceptions ne ressortent pas comme elles devraient :
          {{ scaleway_fleet_audit_suppressed }} couvert(s),
          {{ scaleway_fleet_audit_expired_exceptions | length }} périmée(s),
          {{ scaleway_fleet_audit_exceptions_without_target | length }} sans cible
      vars:
        couvert: >-
          {{ scaleway_fleet_audit_findings
             | selectattr('status', 'equalto', 'suppressed') | list }}

    # ---- Les règles sur des champs déjà rendus (#252, #243) ---------------
    #
    # Un test unitaire dit que les règles calculent ce que le test croit. Il ne
    # dit pas qu'Ansible sait charger la forme étendue, que le rôle demande les
    # bons produits, ni que la garde mord quand une règle ne juge rien.
    - name: Une règle qui ne juge rien fait échouer le run plutôt que de se taire
      block:
        - name: Auditer des nœuds sans demander le produit
          ansible.builtin.include_role:
            name: stephrobert.scaleway.fleet_audit
          vars:
            scaleway_fleet_audit_zones: "{{ zone }}"
            scaleway_fleet_audit_output: none
            scaleway_fleet_audit_policy:
              rules:
                unhealthy_conditions:
                  severity: warn

        - name: Le run aurait dû refuser
          ansible.builtin.fail:
            msg: >-
              une règle qui ne juge rien est passée en silence : le rapport
              serait vert sur zéro champ lu
      rescue:
        - name: Le refus nomme la règle et ce qu'il faut lire
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('unhealthy_conditions')
              - ansible_failed_result.msg is search('k8s_node')
            success_msg: >-
              refus attendu : la règle juge un champ qu'aucun produit lu ne porte
            fail_msg: >-
              le refus ne dit pas quoi ajouter : {{ ansible_failed_result.msg }}

    # Les trois règles qui ne demandent aucune lecture neuve : Instance rend
    # déjà `maintenances`, `end_of_service` et `allowed_actions`, et personne ne
    # les lisait.
    - name: Auditer le parc sur des champs que la collection traversait déjà
      ansible.builtin.include_role:
        name: stephrobert.scaleway.fleet_audit
      vars:
        scaleway_fleet_audit_zones: "{{ zone }}"
        scaleway_fleet_audit_output: none
        scaleway_fleet_audit_policy:
          rules:
            planned_maintenance:
              severity: warn
            end_of_service:
              severity: warn
            required_actions:
              severity: warn
              actions:
                - poweroff

    - name: Les trois règles ont jugé, et sur les champs qu'elles nomment
      ansible.builtin.assert:
        that:
          # Le parc de l'émulateur est sain sur les deux premières, et c'est
          # `[]` et `false` que l'API rend, pas des champs absents.
          - jugees | length > 0
          - jugees | select('equalto', 'allowed_actions') | list | length > 0
          # Une machine arrêtée ne peut pas être éteinte : c'est ce que
          # `allowed_actions` dit, et c'est la règle qui le remonte.
          - scaleway_fleet_audit_findings
              | selectattr('rule', 'equalto', 'required_actions')
              | list | length > 0
        success_msg: >-
          {{ scaleway_fleet_audit_findings | length }} constat(s) sur des champs
          que la collection rendait déjà et que personne ne lisait
        fail_msg: >-
          les règles n'ont rien jugé : {{ scaleway_fleet_audit_findings }}
      vars:
        jugees: >-
          {{ scaleway_fleet_audit_findings | map(attribute='field') | unique | list }}

    # ---- rolling_reboot : une grammaire, deux produits (#244) -------------
    #
    # L'émulateur ne sert pas de cluster, donc ce qui se joue ici est la
    # grammaire et ses refus, pas le roulement lui-même. Celui-ci s'éprouve sur
    # le compte réel, où la plateforme d'exemple porte un pool.
    - name: Un produit que ce rôle ne sait pas redémarrer est refusé
      block:
        - name: Rouler sur quelque chose dont il ne sait pas observer le retour
          ansible.builtin.include_role:
            name: stephrobert.scaleway.rolling_reboot
          vars:
            scaleway_rolling_reboot_selector:
              kind: lb_certificate
              name: www

        - name: Le run aurait dû refuser
          ansible.builtin.fail:
            msg: >-
              un roulement sur un produit dont le retour ne s'observe pas est
              une temporisation déguisée, et il est parti sans rien dire

      rescue:
        - name: Le refus nomme ce que le rôle sait redémarrer
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('lb_certificate')
              - ansible_failed_result.msg is search('k8s_node')
            success_msg: >-
              refus attendu : le rôle nomme les produits dont il sait observer
              le retour
            fail_msg: >-
              le refus ne dit pas ce qu'il sait faire : {{ ansible_failed_result.msg }}

    # `kind` dit de quoi on parle, pas comment on le désigne : le sélecteur en
    # porte toujours exactement un critère, et `kind` n'en est pas un.
    # `kind` dit de quoi on parle, pas comment on le désigne : le sélecteur en
    # porte toujours exactement un critère, et `kind` n'en est pas un.
    #
    # **La preuve est la forme du refus, pas son absence.** Ce playbook tourne
    # sans inventaire, donc un sélecteur d'Instances ne désigne rien et le rôle
    # refuse, à raison. Ce qui compte est qu'il refuse pour *cette* raison et
    # non pour « deux critères à la fois », ce qui serait le cas si `kind` en
    # était un.
    - name: "`kind` ne compte pas parmi les critères du sélecteur"
      block:
        - name: Rouler avec un `kind` et un critère
          ansible.builtin.include_role:
            name: stephrobert.scaleway.rolling_reboot
          vars:
            scaleway_rolling_reboot_selector:
              kind: instance
              group: scw_product_instance

        - name: Le run aurait dû refuser, faute d'inventaire
          ansible.builtin.fail:
            msg: ce playbook n'a pas d'inventaire, la sélection ne peut rien désigner

      rescue:
        - name: Le refus porte sur la sélection vide, jamais sur deux critères
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('holds no host')
              - not (ansible_failed_result.msg is search('à la fois'))
            success_msg: >-
              `kind` a traversé la grammaire sans compter pour un critère : le
              refus porte sur la sélection vide
            fail_msg: >-
              `kind` a été pris pour un critère : {{ ansible_failed_result.msg }}

    # ---- fleet_changes : la règle du jalon, jouée -------------------------
    #
    # « La 0.8.0 ne doit pas augmenter le nombre de notifications, elle doit
    # augmenter le rapport signal sur bruit. » Un test unitaire dit que le
    # filtre calcule ce que le test croit ; il ne dit pas que deux runs d'un
    # vrai parc, avec deux lectures distinctes et l'agrégation du rôle,
    # produisent le silence attendu (#236).
    - name: Un premier passage de fleet_changes, qui est une référence
      ansible.builtin.include_role:
        name: stephrobert.scaleway.fleet_changes
      vars:
        scaleway_fleet_changes_zones: "{{ zone }}"
        scaleway_fleet_changes_output: none

    - name: Garder ce qu'un appelant garderait entre deux runs
      ansible.builtin.set_fact:
        constats_gardes: "{{ scaleway_fleet_audit_changes.current }}"
        niveau_reference: "{{ scaleway_fleet_changes_level }}"

    - name: Un second passage, en rendant le premier
      ansible.builtin.include_role:
        name: stephrobert.scaleway.fleet_changes
      vars:
        scaleway_fleet_changes_zones: "{{ zone }}"
        scaleway_fleet_changes_output: none
        scaleway_fleet_changes_findings: "{{ constats_gardes }}"

    - name: Le second passage se tait, et rien de composite ne sort
      ansible.builtin.assert:
        that:
          - niveau_reference == 'baseline'
          - scaleway_fleet_changes_level == 'quiet'
          - scaleway_fleet_changes_summary.new_findings == 0
          - scaleway_fleet_changes_summary.resolved_findings == 0
          - scaleway_fleet_changes_summary.new_failures == 0
          - scaleway_fleet_changes_summary.not_concluded == 0
          # Aucun instantané rendu : l'infrastructure n'est pas comparée, ce qui
          # n'est pas « rien n'a bougé ».
          - scaleway_fleet_changes_summary.infrastructure_changes is none
          # Pas de score composite : un nombre composite ne se remonte pas
          # jusqu'à ce qui l'a fait bouger.
          - scaleway_fleet_changes_summary.keys() | select('search', 'score')
              | list | length == 0
          # Le rôle n'a pas réimplémenté la comparaison : elle vient de l'audit.
          - scaleway_fleet_changes_summary.severities.warn.now
              == scaleway_fleet_audit_changes.counts.current
        success_msg: >-
          premier passage `{{ niveau_reference }}`, second `quiet` :
          {{ scaleway_fleet_changes_summary.severities.warn.now }} constat(s)
          ouvert(s), 0 nouveau, 0 résolu, infrastructure non comparée
        fail_msg: >-
          un parc inchangé a produit du bruit au second passage :
          niveau {{ scaleway_fleet_changes_level }},
          bilan {{ scaleway_fleet_changes_summary }}
