# mise : outillage épinglé et lanceur de tâches, en remplacement du Makefile.
#
#   mise install        installe l'outillage et crée le venv
#   mise tasks          liste ce qui est lançable
#   mise run check      ce qu'une pull request doit passer
#
# Une seule définition par tâche, et la CI appelle ces tâches plutôt que de
# recopier leurs commandes : une CI qui diverge du lanceur ne mesure pas ce
# qu'on croit.

# **mise épingle tout, et rien n'épinglait mise.** Sa version de CI vit dans
# `.github/actions/mise/action.yml`, à un seul endroit ; ici c'est le plancher
# qu'un poste doit tenir. Les deux ne disent pas la même chose : l'une fixe ce
# que la CI installe, l'autre refuse un `mise` trop ancien pour lire ce fichier.
#
# Un plancher et non une épingle : imposer la version exacte de la CI à qui
# développe ferait échouer sur une version plus récente, ce qui n'aide personne.
min_version = "2026.9.2"

[tools]
python = "3.12"
# Le style et le typage sont épinglés ici plutôt que laissés à la version
# installée sur la machine : un lint qui change d'avis d'un poste à l'autre
# n'est pas un contrôle, c'est une loterie.
ruff = "0.16.5"
# uv ne sert qu'à recalculer le verrou des dépendances. Il est épinglé pour la
# même raison que ruff : l'outil qui décide quelles versions entrent dans le
# projet ne doit pas changer d'avis tout seul.
uv = "0.11.26"
# Terraform bâtit la plateforme d'exemple. Épinglé comme le reste : la stack
# doit produire le même plan sur un poste et dans la CI, et un fournisseur
# résolu différemment selon la machine ferait mentir le contrôle de résidu.
terraform = "1.15.4"

[env]
# Le venv du projet, créé et activé par mise. Les dépendances de développement
# s'y installent par `mise run setup`.
_.python.venv = { path = ".venv", create = true }

# `get_env` et non une valeur littérale : une valeur déclarée en dur ici
# gagnerait contre une variable exportée, et un réglage qui se lit comme
# configurable sans l'être est pire que pas de réglage du tout. La leçon vient
# de feint, qui l'a mesurée.
PRODUCT = "{{ get_env(name='PRODUCT', default='instance') }}"

# Périmètre de génération : les modules nommés ici, pas ceux que le générateur
# saurait écrire. La liste reste **explicite** parce qu'un périmètre déduit
# changerait tout seul le jour où l'API bouge, et personne ne le verrait dans
# une revue.
#
# Elle porte les seize modules que le modèle sait construire aujourd'hui :
# quinze lectures et une action, tous Day-2. Ce ne sont plus deux modules
# « parce que rien ne prouve les autres », mais seize parce que
# `ansible-test sanity` les accepte et que la stack d'exemple les exerce
# chacun contre le cloud réel et contre l'émulateur. Les quinze modules du
# plan qui manquent sont écartés **avec leur raison** par
# `mise run generate`, et le compte rendu de génération la publie.
MODULES = "{{ get_env(name='MODULES', default='') }}"

# Le périmètre du second produit, déclaré comme le premier. Treize lectures :
# le modèle ne sait pas encore construire les dix modules MANAGE du plan, et
# `lb_load_balancer_action` est écarté parce que `MigrateLb` ne porte aucun
# paramètre d'action dans son corps. Les onze écarts sortent avec leur raison
# dans le compte rendu de génération.
MODULES_LB = "{{ get_env(name='MODULES_LB', default='') }}"

# Ce qui porte un serveur allumé pendant la cible d'intégration : off, incus,
# incus-vm, incus-ovn. Démarrer des machines est un effet de bord qui se
# demande, jamais un défaut.
FEINT_VM = "{{ get_env(name='FEINT_VM', default='off') }}"

# ---- Environnement ---------------------------------------------------------

[tasks.setup]
description = "Installer les dépendances de développement depuis le verrou"
# `--require-hashes` change la nature de l'installation : pip refuse une archive
# dont l'empreinte ne correspond pas, et refuse aussi toute dépendance qui
# n'est pas dans le verrou. Une release compromise sur PyPI ne s'installe donc
# pas en silence dans la CI, où elle tournerait à côté du jeton GitHub.
#
# `--no-build-isolation` n'est pas une optimisation : sans lui, pip télécharge
# le backend de construction dans un environnement isolé, hors du verrou, et
# rouvre exactement la porte que le verrou ferme. setuptools est verrouillé,
# donc l'installation éditable s'en sert.
#
# `uv pip` et non `python -m pip`, et ce n'est pas une préférence : mise crée le
# venv **avec uv** dès qu'uv est dans `[tools]`, et un venv créé par uv ne
# contient pas `pip`. Mesuré au premier passage en CI, où `python -m pip` a
# répondu « No module named pip » alors que tout marchait en local, sur un venv
# plus ancien qui en avait un. C'est le cas d'école du « ça marche chez moi ».
run = """
uv pip install --require-hashes --requirement requirements-dev.lock
uv pip install --editable . --no-deps --no-build-isolation
"""

[tasks.lock]
description = "Recalculer le verrou des dépendances après un changement de pyproject.toml"
# Le verrou se relit comme un diff : c'est là qu'une dépendance qui apparaît se
# voit. Le régénérer sans lire son diff annule le mécanisme, exactement comme
# pour les golden.
run = "uv pip compile pyproject.toml --extra dev --generate-hashes --quiet -o requirements-dev.lock"

[tasks."setup:ansible"]
description = "Épingler une version d'ansible-core (ANSIBLE_CORE='>=2.17,<2.18')"
# La matrice de CI s'en sert pour éprouver chaque version que `meta/runtime.yml`
# déclare. Une version déclarée et jamais testée est une promesse sans preuve.
#
# C'est la seule installation du dépôt qui sorte du verrou, et c'est assumé :
# la plage de versions **est** le sujet du test. La verrouiller reviendrait à
# tenir quatre verrous, un par borne de la matrice, pour éprouver quatre
# versions figées au lieu des quatre plages que `meta/runtime.yml` promet.
#
# Guillemets et non apostrophes : dans `sh`, `${VAR:-défaut}` ne s'expanse pas
# entre apostrophes, et la chaîne partait littérale vers le résolveur. Défaut
# latent depuis l'écriture de la tâche, que personne n'avait vu parce que la
# matrice de CI échouait avant d'y arriver.
run = 'uv pip install "ansible-core${ANSIBLE_CORE:->=2.17}"'

[tasks."security:versions"]
description = "Les scanners jugent-ils avec la version que la CI installe ?"
# **`mise run qualifier` a rendu 12/12 vert sur un arbre que la CI a refusé.**
# zizmor local était en 1.28.0, la CI en 1.30.0, et l'audit qui a rougi est né
# avec la 1.30.0. Une porte qui juge avec un autre outil que celui qu'elle
# prétend rejouer produit un vert qui ne vaut rien.
run = "python scripts/scanners.py"

[tasks.security]
description = "Juger les workflows : actionlint, zizmor, poutine"
depends = ["security:versions"]
# Les mêmes portes que la CI, lançables avant de pousser. Elles échouent quand
# l'outil est absent au lieu de se sauter : un contrôle qui se saute tout seul
# finit par ne plus jamais tourner, et c'est la leçon que la cible
# d'intégration a déjà coûtée à ce dépôt.
run = """
actionlint -color
zizmor --no-progress --persona regular --min-severity low .github/workflows/
poutine analyze_local . --fail-on-violation --quiet
"""

[tasks."security:trust"]
description = "Juger la politique de confiance du pipeline : plumber"
depends = ["security:versions"]
# Séparé des trois autres, et pas par goût du rangement : plumber déduit le
# fournisseur du remote git et refuse une copie de travail qui n'en a pas. Tant
# que ce dépôt n'a pas de remote, cette tâche échoue avec ce message, et les
# trois scanners qui ne lisent que des fichiers restent lançables.
#
# Mesurée malgré tout, sur un clone jetable pourvu d'une origine GitHub :
# A, 100.0/100, zéro constat à toutes les gravités.
run = "plumber analyze --min-score B"

# ---- Contrôles rapides -----------------------------------------------------

[tasks.test]
description = "Lancer les tests du générateur et de la collection"
run = "python -m pytest tests/unit"

[tasks.lint]
description = "Vérifier le style"
run = """
ruff check generator scripts tests
ruff format --check generator scripts tests
"""

[tasks.typecheck]
description = "Vérifier les types"
run = "python -m mypy"

[tasks."lint:changelog"]
description = "Juger les fragments de changelog"
# L'outil veut tourner dans la collection ; le script l'y emmène en découvrant
# son chemin, pour que le namespace n'ait qu'une source.
# Un fragment mal formé ne se voit qu'au moment de publier, c'est-à-dire au pire
# moment. Une valeur commençant par un backtick, par exemple, n'est pas du YAML
# valide, et le linter le dit tout de suite.
run = "python scripts/changelog.py lint"

[tasks.falsify]
description = "Prouver que les gardes mordent, en les neutralisant hors dépôt"
run = "python scripts/falsify.py"

# ---- Générateur ------------------------------------------------------------

[tasks.report]
description = "Rapport de couverture de chaque produit suivi, en mode strict"
# Chaque produit, pas seulement `$PRODUCT` : le site refuse de se construire
# quand un produit de `products.txt` n'a pas sa page de mesure, et le dire ici
# vaut mieux que de le découvrir trois étapes plus loin. La liste vient de
# l'index, elle n'est pas recopiée.
run = "python scripts/report_all.py"

[tasks.generate]
description = "Écrire les modules des deux produits dans plugins/modules"
# **Aucun périmètre par défaut, et c'est une correction.** `MODULES` valait
# exactement l'ensemble des modules que le modèle sait construire, 25 et 21 :
# la liste n'écartait donc plus rien par décision, elle recopiait à la main ce
# que le générateur calcule. Mais `--module` était passé quand même, alors tout
# ce qui n'y figurait pas sortait du compte rendu sous l'étiquette « hors du
# périmètre demandé », y compris les six modules que le modèle refuse pour des
# raisons documentées. C'est la règle « rien ne disparaît en silence »
# appliquée à moitié : l'opération ne disparaissait pas, sa raison si.
#
# Le périmètre reste disponible, `MODULES="instance_server" mise run generate`,
# pour restreindre volontairement. Vide, il ne déguise plus un refus du modèle
# en décision humaine.
#
# Les deux produits sont générés l'un après l'autre, dans une seule collection.
# Écrire deux tâches laisserait la porte ouverte à n'en lancer qu'une, et
# `check:generated` mesurerait alors un arbre à moitié régénéré.
run = """
flags=""
for module in $MODULES; do flags="$flags --module $module"; done
python -m generator generate $PRODUCT $flags

flags_lb=""
for module in $MODULES_LB; do flags_lb="$flags_lb --module $module"; done
python -m generator generate lb $flags_lb
"""

[tasks."sync:api"]
description = "Retélécharger les contrats depuis le portail Scaleway"
run = "python scripts/sync_specs.py"

[tasks."parser:coverage"]
description = "Ce que le parser ne couvre pas, contrat par contrat"
# À passer sur le contrat d'un produit **avant** de l'importer. Le parser ne
# couvre pas tout OpenAPI, et généraliser sans cas déclenchant produirait du
# code que rien ne juge : la liste des travaux se déduit de ce que ce script
# trouve. Le Load Balancer l'a prouvé, en apportant `page_size` et 24 `oneOf`
# qu'Instance n'employait nulle part.
run = "python scripts/parser_coverage.py"

[tasks."drift"]
description = "Dire ce que les contrats téléchargés changent pour le générateur"
# À lancer après `sync:api`. Sort en 3 quand quelque chose a bougé, code
# distinct des trois que la CI connaît : une dérive n'est pas une erreur du
# dépôt, c'est une nouvelle du monde extérieur.
run = "python scripts/drift_report.py"

[tasks."golden:update"]
description = "Régénérer les golden fixtures, après lecture du diff"
run = "python scripts/update_golden.py"

# ---- Dérive ----------------------------------------------------------------

[tasks."check:generated"]
description = "Échouer si un artefact versionné n'est plus à jour"
# `git diff --exit-code` seul ne verrait pas un module tout neuf, produit et
# jamais commité : le script regarde aussi les fichiers non suivis.
depends = ["golden:update", "generate"]
run = "python scripts/check_generated.py tests/fixtures ansible_collections"

[tasks."check:worktree"]
description = "Échouer si un build a laissé un fichier non ignoré"
# Ce qu'une commande peut reproduire ne se versionne pas. Un artefact qui
# apparaît dans `git status` après un build est un fichier que quelqu'un
# finira par commiter sans le vouloir.
run = "python scripts/check_generated.py ."

# ---- Collection ------------------------------------------------------------

[tasks.sanity]
description = "Lancer ansible-test sanity sur la collection"
# Le script assemble la collection hors du dépôt : sous `build/`, ansible-test
# demande la liste des fichiers à git, ne reçoit rien, saute toutes les cibles
# et sort en 0. Il refuse ce vert-là.
depends = ["generate"]
run = "python scripts/sanity.py"

[tasks.docs]
description = "Juger la documentation, puis produire les pages RST"
# `antsibull-docs` voit ce qu'`ansible-test sanity` laisse passer : sur une
# référence croisée invalide, sanity sort en 0 et lui en 3.
depends = ["generate"]
run = "python scripts/docs.py"

[tasks."docs:site"]
description = "Assembler et construire le site de documentation sous build/site"
# Trois sources, une seule sortie, et rien de dérivé dans le dépôt : les pages
# des plugins viennent d'antsibull, les pages de mesure de la représentation
# intermédiaire, les guides de `docs/`. La péremption est impossible plutôt que
# surveillée, puisqu'il n'existe aucun état intermédiaire versionné.
#
# `-W` fait de cette tâche une porte : référence croisée morte, module
# documenté qui n'existe plus, page hors toctree. Et `scripts/docsite.py` refuse
# en plus un vert obtenu sur un site vide.
depends = ["docs", "report"]
run = "python scripts/docsite.py"

[tasks."docs:linkcheck"]
description = "Vérifier les liens externes du site (demande le réseau)"
# Séparée de `docs:site`, et pas sur les pull requests : un lien externe casse
# pour des raisons qui n'ont rien à voir avec le changement en cours, et une
# porte qui rougit sans rapport avec le code finit par ne plus être lue.
depends = ["docs", "report"]
run = "python scripts/docsite.py --linkcheck"

[tasks."docs:examples"]
description = "Faire analyser par Ansible les playbooks cités dans la documentation"
# Les `EXAMPLES` des modules sont déjà joués contre l'émulateur par
# `mise run integration`. Cette tâche couvre l'autre moitié : les playbooks
# écrits à la main dans les guides, qu'aucun scénario n'exécute. Elle ne les
# joue pas, elle les fait analyser : ils désignent des machines qui n'existent
# pas ici, et `--syntax-check` attrape déjà ce qu'une documentation produit
# vraiment, un module renommé ou un paramètre disparu.
depends = ["generate"]
run = "python scripts/doc_examples.py"

[tasks."lint:docs"]
description = "Juger la documentation sans produire de pages"
depends = ["generate"]
run = "python scripts/docs.py --lint"

[tasks.package]
description = "Construire l'archive installable, et la vérifier"
# Une archive qui existe ne prouve rien : le script contrôle son contenu,
# l'installe dans un répertoire jetable, puis demande sa documentation à
# `ansible-doc` et fait résoudre ses playbooks par `ansible-playbook`.
depends = ["generate"]
run = "python scripts/package.py"

[tasks.integration]
description = "Jouer les playbooks contre un émulateur local (FEINT_VM=off)"
# Volontairement hors de `check` : l'émulateur est un backend de test, pas une
# dépendance. `FEINT_VM=incus-ovn mise run integration` démarre de vraies
# machines ; `feint doctor --vm incus-ovn` dit avant tout si l'hôte peut.
depends = ["generate"]
run = "python scripts/integration.py"

# ---- Le tout ---------------------------------------------------------------

# ---- La plateforme d'exemple ----------------------------------------------

[tasks."example"]
description = "Déployer la plateforme d'exemple contre l'émulateur, l'exploiter, la détruire"
# Le plan de contrôle seul : rien ne démarre, donc aucun playbook SSH. C'est la
# cible rapide, gratuite et hors ligne, celle qui prouve que la stack tient et
# que l'inventaire trouve ce qu'elle a créé.
run = "python scripts/example.py emulateur"

[tasks."example:machines"]
description = "La même, avec de vraies machines : l'application se déploie pour de bon"
# `incus-ovn` fait démarrer de vraies machines avec un vrai réseau. Les
# playbooks se connectent, installent, et une requête traverse toute la chaîne.
run = "python scripts/example.py machines"

[tasks."example:reel"]
description = "La même, contre le compte Scaleway réel, encadrée par le contrôle de résidu"
# À lancer à la main, jamais depuis la CI : cette cible crée des ressources
# facturées. La destruction est dans un `finally`, et le contrôle de résidu
# compare l'état du compte avant et après.
run = "python scripts/example.py reel"

[tasks."example:residu"]
description = "Vérifier qu'aucune ressource de l'exemple ne survit sur le compte réel"
run = "python scripts/residue.py verify"

[tasks."lint:ansible"]
description = "ansible-lint en profil production sur la collection livrée"
# **Hors de `check`**, parce qu'`ansible-lint` n'est pas dans le verrou : il
# emporte une trentaine de paquets et sa propre version d'ansible-core, ce qui
# ferait entrer dans l'environnement de développement une seconde source de ce
# que « ansible » veut dire. Il se lance avant une publication, et la CI
# l'appelle dans le job de la collection.
run = "python scripts/ansible_lint.py"

[tasks."docs:quality"]
description = "Ce que la documentation publiée vaut, et ce qui la rend impubliable"
# `ansible-test sanity` dit qu'un bloc est bien formé, pas qu'il apprend quelque
# chose à quelqu'un. Cette porte cherche des défauts nommés, chacun trouvé sur
# un module réel, et chacun réparable dans le générateur plutôt que dans le
# fichier produit.
depends = ["generate"]
run = "python scripts/docs_quality.py --check"

[tasks."fuzz:verrou"]
description = "Le fuzzer installe par empreinte, et la même version que la CI"
# **Le fuzzer construit son image loin d'ici.** Il installait son lecteur YAML
# avec la version du verrou et sans son empreinte : une version dit *quoi*, une
# empreinte dit *quel octet*, et c'était le seul endroit du dépôt où une
# dépendance s'installait sans. L'épingler crée un second verrou, donc une
# seconde chose qui dérive : ce contrôle est ce qui l'empêche.
run = "python scripts/verrou_fuzz.py"

[tasks."fuzz:smoke"]
description = "Rejouer le harnais de fuzzing sur des mutations du contrat réel"
# **Il prouve que le harnais marche, pas qu'il trouve.** Trouver demande du
# temps machine, et c'est ClusterFuzzLite qui le passe, sur pull request et le
# mardi. Ceci tient en quelques secondes et garde le harnais vivant : un
# harnais qui ne tourne que dans le conteneur d'OSS-Fuzz est un harnais que
# personne ne relit, et qui pourrit sans que rien ne le dise.
run = "python scripts/fuzz_smoke.py 2000"

[tasks."version"]
description = "Ce que les fragments de changelog impliquent comme prochain numéro"
# **Le numéro se déduit, il ne se saisit pas.** Ce qu'une version promet est
# déjà écrit dans les fragments : une rupture, un ajout, ou une correction. Ce
# dépôt a corrigé quatre numéros recopiés à la main en deux jours.
#
# Pourquoi les fragments et non les sujets de commit, comme le fait
# `cz bump` ailleurs : Ansible lit `version:` dans `galaxy.yml` et nomme
# l'archive d'après lui, donc un fichier porte forcément le numéro et
# `version_provider = "scm"` est impossible ; le changelog appartient à
# antsibull, dont la CI vérifie le format ; et les commits sont en français,
# quand un fragment est publié, donc en anglais.
run = "python scripts/version.py --show"

[tasks."version:bump"]
description = "Écrire le prochain numéro dans galaxy.yml et composer le changelog"
run = "python scripts/version.py --bump"

[tasks."chiffres:check"]
description = "Refuser un compteur publié hors d'un bloc dérivé"
# Le README dérivait ses nombres et la CI refusait un README périmé. La règle
# ne valait que pour lui : un audit a trouvé huit compteurs faux dans `docs/`,
# dont « 41 Day-2 » quand la mesure en dit 40, et « sur 46 modules » quand la
# collection en porte 50. Ce contrôle étend la règle à ce qui est publié.
run = "python scripts/chiffres.py --check"

[tasks."release:check"]
description = "Ce qui doit être vrai avant de publier sur Galaxy"
# **Hors de `check`**, et c'est délibéré : cette garde exige un tag qui désigne
# HEAD et un arbre propre, donc elle refuserait toute pull request. Elle se
# lance avant une publication, et c'est le workflow de release qui l'appellera
# une fois la première publication faite à la main.
run = "python scripts/release.py --check"

[tasks.navigation]
description = "Le site annonce ses deux parcours, et sert l'usage en premier"
# Hors ligne et instantané, donc dans `check` : il lit `docs/index.md` et
# `docs/conf.py`, jamais le site construit. Il ne juge pas le goût, seulement
# quatre faits binaires ; un ratio de pages avec un seuil serait un nombre
# inventé, et le refuser au nom d'une porte ferait ce que ce dépôt reproche
# ailleurs.
run = "python scripts/navigation.py"

[tasks."cles:lues"]
description = "Refuser une clé lue par un playbook qu'aucun module ne publie"
# Dans `check`, parce qu'une porte qui ne tourne qu'en CI ne protège pas la
# poussée. Le cas est arrivé : un correctif du parser a renommé la clé rendue
# par trois modules, le playbook lisait l'ancienne, et c'est le job
# « Plateforme d'exemple » qui l'a dit, plusieurs minutes plus tard.
depends = ["generate"]
run = "python scripts/cles_lues.py --check"

[tasks."coverage:check"]
description = "Refuser un module livré qu'aucun playbook d'exemple n'appelle"
# Dans `check`, donc à chaque issue traitée : hors ligne, déterministe, il lit
# les clés de tâches des playbooks et le répertoire des modules, jamais un
# artefact de run. Un module écrit que rien n'exerce est un module dont on
# ignore s'il marche.
depends = ["generate"]
run = "python scripts/example_coverage.py --check"

[tasks."coverage:diff"]
description = "Comparer le dernier run réel au dernier run contre l'émulateur"
# Hors de `check` : il lui faut deux artefacts, donc deux exécutions. C'est le
# matériau d'une issue de feint, mesuré des deux côtés le même jour.
run = "python scripts/example_coverage.py --diff"

[tasks."coverage:example"]
description = "Les trois étages de couverture, et ce que le dernier run a joué"
# Hors de `check` : les deux derniers étages dépendent d'un artefact de run, et
# `check` doit rester déterministe et hors ligne. Le premier étage, lui, entre
# dans le bloc du README, donc `readme:check` le juge à chaque CI.
run = "python scripts/example_coverage.py"

[tasks."readme"]
description = "Réécrire les compteurs du README depuis ce qui est mesuré"
# Un nombre recopié à la main vieillit en silence, et se lit exactement comme
# une mesure. Le README en annonçait 366 quand pytest en collectait 420.
#
# **Les mêmes dépendances que `readme:check`, et c'est une correction.** Elles
# n'étaient déclarées que sur le contrôle, jamais sur l'écriture : `mise run
# readme` publiait donc ce que `build/reports` contenait, quel qu'il soit. C'est
# l'écriture qui est dangereuse, puisqu'elle pose le nombre dans un document
# publié.
depends = ["report", "generate"]
run = "python scripts/readme_counters.py --write"

[tasks."readme:check"]
description = "Échouer si les compteurs du README ont vieilli"
depends = ["report", "generate"]
run = "python scripts/readme_counters.py --check"

[tasks.check]
description = "La porte courte : hors ligne, déterministe, quelques secondes"
# **Elle ne suffit pas à une pull request, et le dire évite un aller-retour.**
# La CI lance plusieurs jobs ; `check` est ce que le premier rejoue. La
# description a longtemps promis « ce qu'une pull request doit passer », et une
# pull request est partie sur cette foi : elle a rougi sur la construction du
# site, que `check` ne lance pas. C'est `qualifier` qui rejoue les autres.
depends = [
  "lint",
  "typecheck",
  "test",
  "report",
  "check:generated",
  "lint:changelog",
  "falsify",
  "readme:check",
  "coverage:check",
  "cles:lues",
  "navigation",
  # **Le job Archive de la CI en fait partie, donc `check` doit le porter.**
  # Il n'y était pas, et une pull request est passée localement sur un contrôle
  # qui interrogeait un plugin d'inventaire renommé la veille. `check` promet
  # « ce qu'une pull request doit passer » : l'omission le rendait faux, et
  # coûte trois secondes à réparer.
  "package",
  # **Elle n'y était pas, et une version est partie avec cent phrases de repli
  # dans ses `RETURN`.** La porte documentaire n'était appelée que par
  # `release:check`, donc au moment où refuser coûte un numéro plutôt qu'un
  # aller-retour. Une pull request doit la passer comme le reste.
  "docs:quality",
  "fuzz:smoke",
  "fuzz:verrou",
  "chiffres:check",
  "histoire",
  "typographie",
  "nullabilite",
  "admission",
  "introductions",
  "api:privee",
  "outillage",
]

[tasks.qualifier]
description = "Rejouer la CI en local, et nommer ce qui n'est pas rejouable"
# **GitHub n'est pas une zone de qualification.** Une pull request rouge coûte
# le runner, la relecture et le budget d'API du dépôt. Ce dernier a déjà fait
# échouer CodeQL, OSV-Scanner et la revue de dépendances en même temps, sur une
# limite atteinte parce qu'on s'en servait de boucle d'essai.
#
# `check` reste la porte courte, celle qu'on lance à chaque changement. Celle-ci
# est la porte d'avant-poussée : elle joue en plus le sanity, l'intégration, la
# plateforme d'exemple, les deux images en conteneur et les scanners de
# workflows, et elle **nomme** ce qu'aucune commande locale ne rejoue.
run = "python scripts/qualifier.py"

[tasks."qualifier:rapide"]
description = "La même porte, réduite à ce qui tient en moins d'une minute"
run = "python scripts/qualifier.py --rapide"

[tasks.histoire]
description = "Refuser dans le code un nombre qui compte des choses du dépôt"
# **La règle du nombre dérivé ne valait que pour les documents publiés.** Le
# code portait les mêmes compteurs faux, et rien ne les faisait rougir : un
# compte de tests que la mesure démentait, un compte de modules inférieur à ce
# que la collection publie, deux copies d'un même tableau qui ne disaient plus
# la même chose.
#
# Un nombre vrai se prouve par une assertion, un golden ou un bloc dérivé ; un
# nombre historique va dans `docs/adr/`, qui porte sa date.
run = "python scripts/histoire.py"

[tasks.admission]
description = "Le verdict d'admission d'un produit, et le prix qu'il coûte"
# **« Les tests passent » n'est pas une réponse à « est-il sûr d'ajouter RDB ? ».**
# Les tests passent aussi sur un produit dont le parser ignore la moitié des
# constructions, dont personne n'a lu les pages, et dont la moitié des
# opérations sortent en UNKNOWN.
#
# Toutes les étapes ne bloquent pas, et c'est délibéré : une porte qui refuserait
# sur chaque mesure refuserait les deux produits déjà livrés, donc personne ne la
# lancerait. Les bloquantes sont celles dont l'échec produit un module faux ; les
# autres publient un nombre, qui est le prix d'admission et non un défaut.
run = "python scripts/admission.py --tous"

[tasks.nullabilite]
description = "Les champs que le contrat dit effaçables et qu'un module ne sait pas effacer"
# **Mesurer avant d'abstraire.** Une sémantique d'effacement se conçoit mal sans
# savoir combien de champs la réclament, ni lesquels. Ce relevé les compte et
# les nomme ; le nombre est publié dans un bloc dérivé de
# `docs/architecture/runtime.md`, jamais dans un commentaire.
#
# Il ne refuse rien : compter n'est pas refuser, et transformer ce compte en
# porte bloquerait la collection sur une limite connue et documentée.
run = "python scripts/nullabilite.py"

[tasks.introductions]
description = "Le journal des apparitions dit-il encore la vérité sur ce qui est publié ?"
# **Une date d'apparition est un fait, pas un calcul (ADR-013).** Le journal la
# porte, et deux façons de le désynchroniser demandent un contrôle : une version
# en préparation restée sur le numéro déjà publié, et un nom qu'aucun bloc ne
# date.
#
# Il refuse étroitement, et publie le reste : refuser un module non encore daté
# bloquerait un produit entre son écriture et sa publication, et une porte qu'on
# ne peut pas franchir est une porte qu'on désactive.
run = "python scripts/introductions.py"

[tasks."api:privee"]
description = "Aucun attribut privé d'une bibliothèque tierce dans ce qui est livré"
# **La règle était écrite, rien ne la mesurait.** Le runtime a quitté
# `scaleway_core.api.API._request` parce que c'était privé, puis a écrit
# `requests.Response._content` (ADR-014). Une règle qu'on énonce sans la mesurer
# se réintroduit par la porte d'à côté, et c'est ce qui s'est passé.
run = "python scripts/api_privee.py"

[tasks."outillage"]
description = "L'outillage de la CI n'est déclaré qu'à un endroit"
# **mise épingle toutes les versions, et sa propre version était recopiée neuf
# fois.** Dependabot rattrape le condensat de l'action, parce que c'est une
# dépendance pour lui ; il ne rattrape pas `version:`, qui n'en est pas une.
#
# Le 8 septembre 2026, le point de version de mise annonçait un numéro dont la
# release ne portait aucun artefact. Ce dépôt n'est pas tombé parce qu'il
# épingle ; le défaut était le nombre de copies, pas l'épingle.
run = "python scripts/outillage_ci.py"

[tasks.hooks]
description = "Installer les crochets git qui refusent avant la poussée ce que la CI refuse après"
# **Une seule commande documentée.** `pre-commit install` n'installe que le
# crochet de pré-commit tant qu'on ne lui dit pas lesquels câbler : un crochet
# de pré-poussée déclaré et jamais installé resterait dans le fichier à ne rien
# faire sur toutes les machines. `default_install_hook_types` le dit dans la
# configuration, et cette commande suffit.
run = "pre-commit install"

[tasks.typographie]
description = "Refuser le tiret cadratin, que le dépôt interdit dans les deux langues"
# **La règle était écrite, et rien ne la mesurait.** Le dépôt en portait cent
# quatre-vingt-quatorze, presque tous écrits en une semaine : un cadratin ne
# casse rien, ne rougit nulle part, et se relit comme de la prose ordinaire.
# C'est la définition d'une règle qui n'est qu'un commentaire.
run = "python scripts/typographie.py"

[tasks.clean]
description = "Supprimer les artefacts d'exécution"
# Le motif est quoté et passé à `find` : un glob non quoté sans correspondance
# est une erreur fatale sous zsh, pas un argument transmis.
#
# `*.egg-info` est un reliquat que le backend de construction laisse à la
# racine. Le retirer n'a aucune conséquence, mesuré après coup : le générateur
# s'importe encore, `pip show` répond encore, et `mise run check` reste vert.
# La métadonnée qui compte pour une installation éditable vit dans le venv,
# sous `dist-info`, pas ici.
run = """
rm -rf build .pytest_cache .ruff_cache .mypy_cache
find . -maxdepth 1 -name '*.egg-info' -exec rm -rf {} +
"""
