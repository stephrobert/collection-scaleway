# Décisions humaines sur l'API Instance v1.
#
# Chaque entrée corrige ce qu'une règle mécanique ne peut pas savoir : ce que
# l'opération veut dire pour un opérateur, et si Ansible a une raison de
# l'exposer. La clé est celle que l'IR calcule
# (`<produit>.<version>.<Ressource>.<OperationId>`), et `reason` est obligatoire
# dès qu'on change une classification.
#
# Ce que ce fichier ne fait pas : rattraper une règle qui se trompe partout.
# Une correction qui se répète sur dix opérations est une règle manquante dans
# `generator/classifier/rules.py`, pas dix overrides.

operations:

  # --- Le PUT de remplacement n'est pas le chemin d'un module idempotent ----
  #
  # Scaleway publie deux écritures pour la même ressource : un PATCH partiel
  # (`Update*`) et un PUT de remplacement complet (`Set*`). Un module MANAGE
  # compare l'état courant à l'état voulu et n'écrit que la différence : c'est
  # le PATCH. Exposer le PUT en plus donnerait deux modules pour une ressource,
  # dont un capable d'effacer silencieusement les champs non fournis.

  instance.v1.Image.SetImage:
    generation: ignore
    reason: PUT de remplacement complet ; le module utilise le PATCH UpdateImage.

  instance.v1.PlacementGroup.SetPlacementGroup:
    generation: ignore
    reason: PUT de remplacement complet ; le module utilise le PATCH UpdatePlacementGroup.

  instance.v1.SecurityGroup.SetSecurityGroup:
    generation: ignore
    reason: PUT de remplacement complet ; le module utilise le PATCH UpdateSecurityGroup.

  # **Deux listes pour une ressource, et l'une est un cas particulier de
  # l'autre.** Le modèle d'un module d'information réunit au plus une lecture
  # unitaire et une liste ; celui-ci en avait deux, donc aucun module ne
  # sortait, et les règles d'un groupe de sécurité n'étaient lisibles nulle
  # part.
  #
  # Mesuré avant de trancher, et c'est la mesure qui décide :
  #
  #     ListSecurityGroupRules         /security_groups/{security_group_id}/rules
  #     ListDefaultSecurityGroupRules  /security_groups/default/rules
  #
  # Le second chemin est **exactement** ce que le premier rend quand on lui
  # passe `default` comme identifiant : même méthode, même URL après
  # substitution, et même schéma de réponse, `ListSecurityGroupRulesResponse`
  # sous le champ `rules`. Ce n'est donc pas une seconde API, c'est la même
  # atteinte par une valeur particulière.
  #
  # L'écarter ne crée aucun écart, et le module restant est **meilleur** :
  # `ListSecurityGroupRules` déclare `page` et `per_page`, que celle-ci
  # n'expose pas. Un module dédié aurait rendu la première page en silence.
  #
  # Ce n'est pas le défaut « une ressource sous deux noms » déjà rencontré :
  # la dérivation range bien les trois opérations ensemble, et c'est vérifié.
  instance.v1.SecurityGroupRule.ListDefaultSecurityGroupRules:
    generation: ignore
    reason: >-
      Cas particulier de ListSecurityGroupRules, joignable par
      `security_group_id: default` sur la même URL et avec la même réponse,
      et celle-là est paginée.

  instance.v1.SecurityGroupRule.SetSecurityGroupRule:
    generation: ignore
    reason: PUT de remplacement complet ; le module utilise le PATCH UpdateSecurityGroupRule.

  instance.v1.Snapshot.SetSnapshot:
    generation: ignore
    reason: PUT de remplacement complet ; le module utilise le PATCH UpdateSnapshot.

  instance.v1.Volume.SetVolume:
    generation: ignore
    reason: PUT de remplacement complet ; le module utilise le PATCH UpdateVolume.

  instance.v1.PlacementGroupServer.SetPlacementGroupServers:
    generation: ignore
    reason: PUT de remplacement complet ; le module utilise le PATCH UpdatePlacementGroupServers.

  instance.v1.SecurityGroupRule.SetSecurityGroupRules:
    generation: manual
    module: instance_security_group_rules
    reason: >-
      Remplace en un appel la totalité des règles d'un groupe. L'idempotence
      demande de comparer deux listes ordonnées et de décider ce qu'est une
      règle « identique » : c'est de la logique métier, elle s'écrit à la main.
      Le module porte un nom au pluriel parce qu'il gère l'ensemble des règles,
      là où instance_security_group_rule en gère une.

  # --- Topologie : Terraform décide, Ansible n'attache pas ------------------
  #
  # Attacher un volume ou un système de fichiers à un serveur crée une relation
  # entre deux ressources. C'est exactement la frontière posée par le projet :
  # Terraform provisionne et relie, Ansible exploite l'existant.

  instance.v1.Server.AttachServerVolume:
    generation: ignore
    reason: Relation entre deux ressources, décrite par Terraform et non par Ansible.

  instance.v1.Server.DetachServerVolume:
    generation: ignore
    reason: Relation entre deux ressources, décrite par Terraform et non par Ansible.

  instance.v1.Server.AttachServerFileSystem:
    generation: ignore
    reason: Relation entre deux ressources, décrite par Terraform et non par Ansible.

  instance.v1.Server.DetachServerFileSystem:
    generation: ignore
    reason: Relation entre deux ressources, décrite par Terraform et non par Ansible.

  # --- Ce qu'un module d'action expose, et ce qu'il refuse -----------------
  #
  # Le contrat range sept valeurs dans un même enum, et sa description dit ce
  # que chacune fait. Trois d'entre elles ne sont pas du Day-2 :
  #
  #   terminate         « Delete the Instance along with its attached local
  #                     volumes. » Une suppression, donc le périmètre de
  #                     Terraform, et la plus irréversible du lot.
  #   backup            « Create an image with all the volumes of an
  #                     Instance. » Une création de ressource. Sauvegarder
  #                     relève du Day-2, mais l'arbitrage est le même que pour
  #                     CreateSnapshot, et il n'est pas rendu.
  #   enable_routed_ip  « Migrate the Instance to the new network stack. » Une
  #                     migration sans retour, qui change la topologie réseau.
  #
  # Les recopier parce que le contrat les liste, c'est laisser une suppression
  # entrer par la porte d'une action.

  instance.v1.Server.ServerAction:
    parameters:
      action:
        choices:
          - poweron
          - poweroff
          - reboot
          - stop_in_place
        required: true
        reason: >-
          Les quatre valeurs de contrôle d'alimentation, et elles seules.
          terminate supprime l'Instance et ses volumes locaux, backup crée une
          image, enable_routed_ip migre la pile réseau sans retour : aucune
          des trois n'est une exploitation de l'existant. `required` parce que
          le contrat ne déclare aucun champ de corps obligatoire, et qu'un
          module d'action sans action ne veut rien dire.
      name:
        expose: false
        reason: >-
          Le contrat le dit lui-même : « This field should only be specified
          when performing a backup action. » Cette action n'est pas exposée,
          donc ce paramètre ne pourrait jamais servir.
      volumes:
        expose: false
        reason: >-
          Même raison que `name` : réservé à l'action backup, que ce module
          n'expose pas.
      disable_ipv6:
        expose: false
        reason: >-
          Le contrat le réserve à l'action enable_routed_ip, que ce module
          n'expose pas.
    wait:
      field: state
      states:
        poweron: running
        reboot: running
        poweroff: stopped
        # `stopped in place` et non `stopped` : le contrat déclare les deux,
        # et ce sont des états distincts. Attendre `stopped` faisait échouer
        # l'action après `wait_timeout` sur une Instance pourtant arrêtée.
        stop_in_place: stopped in place
      reason: >-
        Le contrat dit ce qu'une action fait, jamais dans quel état elle laisse
        l'Instance. La correspondance est une décision, écrite ici pour que le
        module attende quelque chose de nommé plutôt que de rendre la main sur
        un déclenchement accepté.

  # --- Opérations qui alimentent un module sans en être un ------------------

  instance.v1.Server.ListServerActions:
    generation: ignore
    reason: >-
      Liste les actions qu'un serveur accepte à l'instant t. Elle est consommée
      par instance_server_action pour valider une demande, pas exposée comme
      module d'information.

  instance.v1.BlockMigration.CheckBlockMigrationOrganizationQuotas:
    generation: ignore
    reason: >-
      Pré-contrôle de quotas d'une migration de volumes vers Block Storage. La
      migration elle-même n'est pas exposée ; son pré-contrôle seul n'a pas
      d'usage Day-2.

  # --- Ressources que le chemin nomme mal ----------------------------------
  #
  # `/products/servers` est un catalogue, pas une ressource `product`. La règle
  # de dérivation lit le chemin ; ici le chemin ment sur ce qu'il décrit.

  instance.v1.ProductServer.ListServersTypes:
    resource: server_type

  instance.v1.ProductServer.GetServerTypesAvailability:
    resource: server_type_availability

  instance.v1.ProductVolume.ListVolumesTypes:
    resource: volume_type

  instance.v1.Server.GetServerCompatibleTypes:
    resource: server_compatible_type

  # --- Un filtre que le contrat décrit en prose ------------------------------

  instance.v1.Server.ListServers:
    parameters:
      tags:
        csv: true
        reason: >-
          Le contrat déclare `tags` en `string` et décrit sa forme dans sa
          propre description : « to filter with several tags, use commas to
          separate them ». L'override lit cette phrase, il n'invente rien. Sans
          lui, `tags: [exemple]` en YAML ne lève aucune erreur : Ansible produit
          la chaîne `"['exemple']"`, l'API ne trouve rien, et le playbook lit
          zéro machine sur un parc qui en porte cinq. Mesuré en capturant la
          requête émise. Une liste est ce que ce paramètre est ; la virgule est
          la façon dont l'API veut l'entendre, et c'est au runtime de la parler.

  # --- Un remplacement complet, qui relie plutôt qu'il ne configure ---------

  instance.v1.PlacementGroupServer.UpdatePlacementGroupServers:
    generation: ignore
    reason: >-
      Réécrit la liste des machines d'un groupe de placement. Relier des
      ressources relève de Terraform, qui déclare cette liste ; un module qui la
      remplace produirait un écart entre l'état déclaré et l'état réel,
      invisible jusqu'au prochain `terraform apply`. Même frontière que
      AttachServerVolume, et même raison que AddBackendServers côté Load
      Balancer. Le modèle l'écartait déjà, mais pour un symptôme, l'absence de
      lecture unitaire : c'est la décision qui doit porter l'écart, pas ce qui
      l'a révélé.

  # --- Combler les trous de documentation du contrat ------------------------
  #
  # **Ce qui est publié sur Galaxy y reste : la version est immuable.** Un
  # module qui sort avec « Not documented by the Scaleway API contract. » sur
  # six options publie ce texte pour toujours, et le lecteur n'a nulle part où
  # aller le compléter.
  #
  # Les phrases posées ici ne sont pas écrites de mémoire : chacune transpose
  # ce que **le même contrat** dit du même champ ailleurs, et la `reason` dit
  # où. Le chargeur exige cette raison, et le contrôle d'orphelins signale
  # l'override le jour où Scaleway documente le champ : c'est alors la phrase
  # de Scaleway qui sort, et celle-ci qui devient une erreur de CI.

  instance.v1.Dashboard.GetDashboard:
    description: >-
      Return the Instance dashboard of one zone: the resource counts the API
      keeps for an Organization or a Project, such as `servers_count`,
      `running_servers_count`, `volumes_count`, `images_count`,
      `snapshots_count`, `ips_count`, `ips_unused` and `security_groups_count`.
    reason: >-
      `GetDashboard` est la seule opération d'Instance v1 sans `summary` ni
      `description` : le module sortait avec `description: []`, ce
      qu'`ansible-test sanity` accepte sans rien dire. La phrase énumère les
      champs du schéma `scaleway.instance.v1.Dashboard`, mot pour mot ; elle
      n'affirme rien de plus que ce que le contrat déclare rendre.
    parameters:
      organization:
        description: Organization ID whose dashboard is returned.
        reason: >-
          Le contrat déclare ce paramètre de requête sans description. Partout
          ailleurs dans le même contrat il est décrit « Organization ID »
          (`scaleway.instance.v1.Server`, `ListIps`, `ListSecurityGroups`) :
          la phrase transpose cet usage, elle ne l'invente pas.
      project:
        description: Project ID whose dashboard is returned.
        reason: >-
          Même cas que `organization`, même source : « Project ID » dans
          `scaleway.instance.v1.Server`, `ListVolumes` et `ListSnapshots`.

  # **ListImages est la seule liste d'Instance v1 dont aucun filtre n'est
  # décrit.** Les six autres listes décrivent les mêmes filtres, avec la même
  # tournure ; l'override transpose ces tournures et rien d'autre.
  instance.v1.Image.ListImages:
    parameters:
      name:
        description: Filter images by name.
        reason: >-
          Transposé de `ListSnapshots`, « List snapshots of the requested
          name. », et de `ListSecurityGroups`, « Name of the security group. ».
          La phrase ne reprend pas les exemples de correspondance partielle que
          `ListServers` donne pour son propre filtre : le contrat ne dit pas
          que celui-ci se comporte pareil.
      arch:
        description: Filter images by CPU architecture.
        reason: >-
          `scaleway.instance.v1.Arch` se décrit lui-même « Architecture of the
          image. », et `scaleway.instance.v1.ServerType.arch` « CPU
          architecture. ». Le contrat déclare ici un `StringValue` et non
          l'enum, donc le module n'expose aucun `choices` et la description ne
          promet aucune liste de valeurs.
      public:
        description: Filter images on their public flag.
        reason: >-
          Le seul champ de ce lot que le contrat ne décrit nulle part :
          `scaleway.instance.v1.Image.public` est un booléen nu. La phrase ne
          dit donc rien de plus que le nom du champ, et surtout pas ce qu'un
          image publique serait, que le contrat ne définit pas.
      organization:
        description: List only images of this Organization ID.
        reason: >-
          Tournure de `ListServers` et `ListPlacementGroups` pour le même
          filtre, mot pour mot avec la ressource changée.
      project:
        description: List only images of this Project ID.
        reason: >-
          Même source que `organization` : `ListServers` et `ListSnapshots`
          décrivent ce filtre « List only ... of this Project ID ».
      tags:
        description: List images with these exact tags.
        reason: >-
          Tournure de `ListServers`, amputée de sa seconde phrase. Les autres
          listes ajoutent « to filter with several tags, use commas to separate
          them » ; c'est cette phrase que l'override `csv` lit pour exposer le
          filtre en liste, et `ListImages` ne la porte pas. L'écrire ici
          promettrait un comportement que rien ne mesure.

  instance.v1.SecurityGroupRule.GetSecurityGroupRule:
    parameters:
      security_group_rule_id:
        description: UUID of the rule. (UUID format)
        reason: >-
          Recopié mot pour mot de `UpdateSecurityGroupRule`, qui déclare le même
          paramètre de chemin avec cette description. Le trou est sur la lecture
          unitaire seulement.

  instance.v1.Ip.UpdateIp:
    parameters:
      server:
        description: Instance attached to the IP.
        reason: >-
          `scaleway.instance.v1.Volume.server` est décrit « Instance attached to
          the volume. » : même champ, même rôle, ressource changée.

  instance.v1.Server.UpdateServer:
    parameters:
      boot_type:
        description: Instance boot type.
        reason: Recopié de `scaleway.instance.v1.Server.boot_type`.
      dynamic_ip_required:
        description: True if a dynamic IPv4 is required.
        reason: Recopié de `scaleway.instance.v1.Server.dynamic_ip_required`.
      enable_ipv6:
        description: >-
          True if IPv6 is enabled (deprecated and always `False` when
          `routed_ip_enabled` is `True`).
        reason: Recopié de `scaleway.instance.v1.Server.enable_ipv6`.
      security_group:
        description: Instance security group.
        reason: Recopié de `scaleway.instance.v1.Server.security_group`.
      volumes:
        description: Instance volumes.
        reason: Recopié de `scaleway.instance.v1.Server.volumes`.

# --- Ce que le contrat ne décrit nulle part, et qui est publié quand même ---
#
# Un champ rendu traverse quatre étages : sa propre description au contrat, ce
# que le contrat en dit ailleurs quand il ne le dit qu'une fois, une
# reformulation qui ne redit que le nom, et enfin ceci. Neuf champs arrivent
# jusqu'ici, et `docs_quality` refuserait la publication sans eux.
#
# **Ces phrases ne disent rien de plus que le nom et le type du champ.** Écrire
# « Number of reserved IP addresses not attached to an Instance » pour
# `ips_unused` serait plus utile et serait une invention : le contrat ne définit
# nulle part ce que « unused » veut dire, et un lecteur bâtirait dessus.
returns:

  scaleway.instance.v1.Dashboard:
    ips_unused:
      description: Count of unused IP addresses.
      reason: >-
        Reformulation du nom, et rien d'autre. Le contrat ne dit pas ce qu'il
        entend par « unused » ; en déduire « non rattachée à une Instance »
        serait plausible et invérifiable.
    servers_by_types:
      description: Count of servers per type.
      reason: >-
        Reformulation du nom et de la forme déclarée, un objet dont les valeurs
        sont des entiers et dont la clé est nommée `<servers_by_typeKey>` par le
        contrat. Le mot « commercial » serait une invention.

  scaleway.instance.v1.Image:
    arch:
      description: CPU architecture of the image.
      reason: >-
        « CPU architecture. » est ce que le contrat écrit pour `arch` sur
        `scaleway.instance.v1.ServerType`, et « Instance architecture. » sur
        `Server`. Deux phrases pour un même nom, donc le glossaire ne peut pas
        trancher ; ici la ressource est connue, et la transposition est exacte.
    default_bootscript:
      description: Default bootscript of the image.
      reason: >-
        Reformulation du nom. Le contrat déclare ce champ `deprecated`, et cette
        mention-là vient de lui : le rendu l'ajoute désormais tout seul.
    extra_volumes:
      description: Extra volumes of the image.
      reason: >-
        Reformulation du nom. Le contrat déclare un objet dont les valeurs sont
        des `Volume` ; ce que la clé désigne n'est pas dit, donc rien n'en est
        dit ici.
    from_server:
      description: Server the image comes from.
      reason: >-
        Reformulation du nom. « Créée à partir de » serait une affirmation sur
        la façon dont l'image est produite, que le contrat ne fait pas.
    public:
      description: Whether the image is public.
      reason: >-
        Reformulation du nom et du type, un booléen. Ce qu'être publique
        implique n'est défini nulle part dans le contrat.

  scaleway.instance.v1.Ip:
    type:
      description: Type of the IP address.
      reason: >-
        Reformulation du nom. Les valeurs de l'enum `IpType` sortent déjà dans
        le module ; le contrat ne les commente pas.

  scaleway.instance.v1.Task:
    href_from:
      description: Source reference of the task, as the API returns it.
      reason: >-
        Reformulation du nom. `href` désigne conventionnellement une référence,
        mais le contrat ne dit ni sa forme ni ce qu'elle pointe, et l'appeler
        une URL serait déjà en dire plus que lui.

  scaleway.std.File:
    content_type:
      description: MIME type of the file content.
      reason: >-
        Reformulation du nom, et rien d'autre. `scaleway.std.File` n'est rendu
        que par `GetServerUserData`, dont la page ne documentait pas le retour
        avant que la clé `result` soit publiée ; le contrat décrit `name` et
        tait les deux autres champs.
    content:
      description: Content of the file, as the API returns it.
      reason: >-
        Reformulation du nom. Le contrat ne dit ni l'encodage du contenu ni sa
        taille maximale, et l'un comme l'autre serait une invention.
