# Le journal des apparitions : quand chaque module, option et valeur de retour
# est entré dans la collection.
#
# **C'est un fait historique, pas une propriété du contrat.** Le générateur ne
# peut pas le déduire : il doit s'en souvenir. Sans ce fichier, `version_added`
# valait la version courante de la collection, et chaque génération réécrivait
# l'histoire de tous les modules.
#
# Ce fichier est un **journal**, et sa forme porte son invariant : on ajoute un
# bloc, on ne touche jamais aux précédents. Un nom qui apparaîtrait dans deux
# blocs serait une apparition redatée, et le chargeur refuse le fichier dans ce
# cas. La règle n'est donc pas une consigne écrite dans un commentaire : elle
# est mesurée.
#
# **Il est exhaustif, et pas seulement fait d'exceptions.** Chaque option et
# chaque valeur de retour y porte son nom, même quand elle est née avec son
# module. Un journal réduit aux exceptions ne saurait pas distinguer une option
# ajoutée hier d'une option présente depuis toujours : la nouvelle hériterait
# en silence de la date de son module, ce qui est exactement le défaut corrigé
# ici.
#
# **D'où viennent les valeurs ci-dessous.** Elles ne sont pas estimées : elles
# sont lues dans les tags publiés, en cherchant pour chaque nom le premier tag
# qui le porte. ADR-013 porte cette mesure, avec sa date et ses comptes.
#
# **Ce que le générateur en fait.** Un module publie toujours son
# `version_added`. Une option ou une valeur de retour ne publie le sien que
# s'il diffère de celui de son module : sinon `antsibull-docs` répéterait le
# même badge sur chaque ligne d'une page, ce qui n'apprend rien.

# La version en préparation, celle qu'un nom encore absent du journal reçoit.
#
# Elle se pose à la main, et `scripts/introductions.py` la compare à ce que les
# fragments de changelog impliquent : un module neuf stampé `0.5.0` dans une
# version qui sortira en `1.0.0` publierait une date fausse dès son premier
# jour.
